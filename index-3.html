<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>FitWar 💪</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --bg: #07070e;
      --bg2: #0d0d1c;
      --card: rgba(255,255,255,0.04);
      --border: rgba(255,255,255,0.09);
      --green: #00ff87;
      --red: #ff3864;
      --yellow: #ffc107;
      --text: #f0f0f0;
      --muted: rgba(240,240,240,0.42);
      --display: 'Bebas Neue', sans-serif;
      --body: 'DM Sans', sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { background: var(--bg); color: var(--text); font-family: var(--body); min-height: 100vh; overflow-x: hidden; }

    /* Grid background */
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image:
        linear-gradient(rgba(0,255,135,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,135,0.025) 1px, transparent 1px);
      background-size: 44px 44px;
    }

    #root { position: relative; z-index: 1; }

    .screen {
      min-height: 100vh;
      padding: 20px 16px 90px;
      max-width: 480px;
      margin: 0 auto;
    }

    /* Logo */
    .logo {
      font-family: var(--display);
      font-size: 3.2rem;
      letter-spacing: 3px;
      color: var(--green);
      text-shadow: 0 0 40px rgba(0,255,135,0.45);
      line-height: 1;
    }
    .logo span { color: var(--text); }

    /* Cards */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 12px;
      backdrop-filter: blur(10px);
    }

    /* Fields */
    .field { margin-bottom: 14px; }
    label {
      display: block; font-size: 0.72rem; font-weight: 700;
      color: var(--muted); text-transform: uppercase; letter-spacing: 1.2px; margin-bottom: 6px;
    }
    input[type=text], input[type=password], input[type=number], select {
      width: 100%; background: rgba(255,255,255,0.06); border: 1px solid var(--border);
      border-radius: 9px; padding: 13px 14px; color: var(--text); font-family: var(--body);
      font-size: 1rem; outline: none; transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus, select:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(0,255,135,0.1);
    }
    input[type=number] { -moz-appearance: textfield; }
    input[type=number]::-webkit-outer-spin-button,
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    select option { background: #111126; }

    /* Buttons */
    .btn {
      display: block; width: 100%; padding: 14px; border-radius: 10px; border: none;
      font-family: var(--display); font-size: 1.25rem; letter-spacing: 1.5px;
      cursor: pointer; transition: all 0.18s;
    }
    .btn-primary { background: var(--green); color: #07070e; font-weight: 900; }
    .btn-primary:hover:not(:disabled) { opacity: 0.88; transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,255,135,0.25); }
    .btn-primary:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .btn-ghost:hover { border-color: var(--green); color: var(--green); }
    .btn + .btn { margin-top: 8px; }

    /* Bottom nav */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(7,7,14,0.96); backdrop-filter: blur(24px);
      border-top: 1px solid var(--border);
      display: flex; justify-content: space-around;
      padding: 10px 0 max(16px, env(safe-area-inset-bottom));
      z-index: 100;
    }
    .nav-btn {
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      background: none; border: none; color: var(--muted); cursor: pointer;
      padding: 5px 18px; font-family: var(--body); font-size: 0.68rem;
      transition: color 0.18s; position: relative;
    }
    .nav-btn svg { width: 22px; height: 22px; stroke-width: 1.8; }
    .nav-btn.active { color: var(--green); }
    .nav-btn .dot {
      position: absolute; top: 3px; right: 10px;
      width: 8px; height: 8px; background: var(--red);
      border-radius: 50%; border: 2px solid var(--bg);
    }

    /* Rank rows */
    .rank-row {
      display: flex; flex-direction: column; gap: 8px;
      padding: 14px 16px; border-radius: 11px; margin-bottom: 8px;
      border: 1px solid var(--border); background: var(--card);
      transition: transform 0.15s;
    }
    .rank-row.winner { border-color: rgba(0,255,135,0.35); background: rgba(0,255,135,0.04); }
    .rank-row.loser { border-color: rgba(255,56,100,0.35); background: rgba(255,56,100,0.05); }
    .rank-inner { display: flex; align-items: center; gap: 12px; }
    .rank-num { font-family: var(--display); font-size: 1.5rem; min-width: 30px; text-align: center; }
    .rank-name { flex: 1; font-weight: 700; font-size: 1rem; }
    .rank-score { font-family: var(--display); font-size: 1.5rem; color: var(--green); }
    .rank-row.loser .rank-score { color: var(--red); }
    .rank-stats { display: flex; gap: 14px; padding-left: 42px; }
    .stat-chip { font-size: 0.75rem; color: var(--muted); }

    /* Big score */
    .big-score {
      font-family: var(--display); font-size: 4rem; line-height: 1;
      color: var(--green); text-shadow: 0 0 40px rgba(0,255,135,0.3);
    }

    /* Photo upload */
    .photo-zone {
      border: 2px dashed var(--border); border-radius: 12px;
      padding: 28px 20px; text-align: center; cursor: pointer; transition: all 0.2s;
    }
    .photo-zone:hover, .photo-zone.filled { border-color: var(--green); background: rgba(0,255,135,0.03); }
    .photo-zone input { display: none; }
    .photo-zone img { width: 100%; max-height: 220px; object-fit: cover; border-radius: 8px; }

    /* Score preview */
    .score-preview {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; background: rgba(0,255,135,0.05);
      border: 1px solid rgba(0,255,135,0.2); border-radius: 10px; margin-bottom: 12px;
    }

    /* Misc */
    .section-title { font-family: var(--display); font-size: 1.5rem; letter-spacing: 1px; margin-bottom: 12px; }
    .muted { color: var(--muted); }
    .label-xs { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 1.2px; font-weight: 700; color: var(--muted); }
    .error { color: var(--red); font-size: 0.85rem; margin: 8px 0; display: flex; align-items: center; gap: 6px; }
    .loser-badge {
      font-size: 0.68rem; font-weight: 700; background: rgba(255,56,100,0.18);
      color: var(--red); padding: 2px 7px; border-radius: 4px; margin-left: 6px;
    }
    .you-badge {
      font-size: 0.68rem; font-weight: 400; color: var(--muted); margin-left: 4px;
    }
    .divider { height: 1px; background: var(--border); margin: 16px 0; }
    .spinner {
      display: inline-block; width: 20px; height: 20px;
      border: 2px solid rgba(255,255,255,0.2); border-top-color: var(--green);
      border-radius: 50%; animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Success animation */
    .success-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 70vh; text-align: center; }

    /* Tip box */
    .tip-box { padding: 12px 16px; background: rgba(255,255,255,0.03); border-radius: 10px; border: 1px solid var(--border); font-size: 0.82rem; color: var(--muted); }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

// ═══════════════════════════════════════
// ⚙️  CONFIGURAÇÃO — substitui estes valores
// Encontras em: Supabase → Project Settings → API
// ═══════════════════════════════════════
const SUPABASE_URL  = 'https://xmdktsqavrtifnrsaruo.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhtZGt0c3FhdnJ0aWZucnNhcnVvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1MzI4NTYsImV4cCI6MjA5NTEwODg1Nn0.ys6iTqg2-umW7ePi78WAdCZ66QkWOLu2Kg0FjE4yQOI';
// ═══════════════════════════════════════

const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON);

// ── Utilitários ──────────────────────────────────
const hoje      = () => new Date().toISOString().split('T')[0];
const mesAtual  = () => {
  const d = new Date();
  return {
    ano: d.getFullYear(),
    mes: d.getMonth() + 1,
    inicio: `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`,
    fim:    `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-31`,
    label:  d.toLocaleDateString('pt-PT', { month: 'long', year: 'numeric' })
  };
};
const fitScore = (passos, calorias, minutos) =>
  Math.round((passos / 100) + (calorias / 10) + minutos);

// ── Icons (SVG inline) ────────────────────────────
const HomeIcon = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>;
const PlusIcon = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>;
const TrophyIcon = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>;
const LogoutIcon = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>;

// ─────────────────────────────────────────────────
// LOADING
// ─────────────────────────────────────────────────
function LoadingScreen() {
  return (
    <div style={{ display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', minHeight:'100vh', gap:20 }}>
      <div className="logo">FIT<span>WAR</span></div>
      <div className="spinner"/>
    </div>
  );
}

// ─────────────────────────────────────────────────
// SETUP (primeira vez)
// ─────────────────────────────────────────────────
function SetupScreen({ onComplete }) {
  const [jogadores, setJogadores] = React.useState(
    Array(4).fill(null).map(() => ({ nome: '', pin: '' }))
  );
  const [loading, setLoading] = React.useState(false);
  const [erro, setErro] = React.useState('');

  const update = (i, field, val) => {
    const j = [...jogadores]; j[i] = { ...j[i], [field]: val }; setJogadores(j);
  };

  const submit = async () => {
    if (jogadores.some(j => !j.nome.trim() || !j.pin.trim())) {
      setErro('Preenche todos os nomes e PINs.'); return;
    }
    if (new Set(jogadores.map(j => j.nome.trim().toLowerCase())).size < 4) {
      setErro('Nomes duplicados. Usa nomes diferentes.'); return;
    }
    setLoading(true); setErro('');
    const { error } = await sb.from('players').insert(
      jogadores.map(j => ({ nome: j.nome.trim(), pin: j.pin.trim() }))
    );
    if (error) { setErro(error.message); setLoading(false); return; }
    onComplete();
  };

  return (
    <div className="screen">
      <div style={{ paddingTop: 40, paddingBottom: 28 }}>
        <div className="logo">FIT<span>WAR</span></div>
        <div className="muted" style={{ marginTop: 8, fontSize: '0.9rem', lineHeight: 1.5 }}>
          Configuração inicial — define os 4 jogadores e os seus PINs.
        </div>
      </div>

      {jogadores.map((j, i) => (
        <div className="card" key={i}>
          <div style={{ fontFamily:'var(--display)', fontSize:'1rem', marginBottom:12, color:'var(--muted)', letterSpacing:1 }}>
            JOGADOR {i+1}
          </div>
          <div className="field">
            <label>Nome</label>
            <input type="text" placeholder="Ex: Manuel" value={j.nome}
              onChange={e => update(i, 'nome', e.target.value)} />
          </div>
          <div className="field" style={{ marginBottom:0 }}>
            <label>PIN (só números)</label>
            <input type="password" inputMode="numeric" placeholder="····" maxLength={6}
              value={j.pin} onChange={e => update(i, 'pin', e.target.value.replace(/\D/g,''))} />
          </div>
        </div>
      ))}

      {erro && <div className="error">⚠️ {erro}</div>}
      <button className="btn btn-primary" onClick={submit} disabled={loading} style={{ marginTop:8 }}>
        {loading ? 'A criar...' : 'Arrancar o FitWar 🔥'}
      </button>
    </div>
  );
}

// ─────────────────────────────────────────────────
// LOGIN
// ─────────────────────────────────────────────────
function LoginScreen({ players, onLogin }) {
  const [selectedId, setSelectedId] = React.useState('');
  const [pin, setPin] = React.useState('');
  const [erro, setErro] = React.useState('');

  const handleLogin = () => {
    if (!selectedId) { setErro('Escolhe o teu nome.'); return; }
    const player = players.find(p => p.id === selectedId);
    if (!player || player.pin !== pin) { setErro('PIN errado. Tenta outra vez.'); setPin(''); return; }
    onLogin(player);
  };

  return (
    <div className="screen">
      <div style={{ paddingTop: 60, paddingBottom: 40, textAlign:'center' }}>
        <div className="logo" style={{ fontSize:'4.5rem' }}>FIT<span>WAR</span></div>
        <div className="muted" style={{ marginTop:10, fontSize:'0.9rem' }}>
          Quem vai pagar a conta este mês? 😈
        </div>
      </div>

      <div className="card">
        <div className="field">
          <label>Quem és tu?</label>
          <select value={selectedId} onChange={e => { setSelectedId(e.target.value); setErro(''); }}>
            <option value="">Escolhe o teu nome...</option>
            {players.map(p => <option key={p.id} value={p.id}>{p.nome}</option>)}
          </select>
        </div>
        <div className="field" style={{ marginBottom:0 }}>
          <label>PIN</label>
          <input type="password" inputMode="numeric" placeholder="····" maxLength={6}
            value={pin}
            onChange={e => { setPin(e.target.value.replace(/\D/g,'')); setErro(''); }}
            onKeyDown={e => e.key === 'Enter' && handleLogin()} />
        </div>
        {erro && <div className="error">⚠️ {erro}</div>}
        <button className="btn btn-primary" onClick={handleLogin} style={{ marginTop:16 }}>
          Entrar 💪
        </button>
      </div>

      <div className="tip-box" style={{ marginTop:12 }}>
        📱 Guarda esta página nos favoritos do teu telemóvel para acesso rápido.
      </div>
    </div>
  );
}

// ─────────────────────────────────────────────────
// BOTTOM NAV
// ─────────────────────────────────────────────────
function BottomNav({ screen, setScreen, temHoje, onLogout }) {
  return (
    <nav className="bottom-nav">
      <button className={`nav-btn ${screen==='dashboard'?'active':''}`} onClick={() => setScreen('dashboard')}>
        <HomeIcon />Início
      </button>
      <button className={`nav-btn ${screen==='entry'?'active':''}`} onClick={() => setScreen('entry')}>
        <PlusIcon />
        {!temHoje && <span className="dot"/>}
        Registar
      </button>
      <button className={`nav-btn ${screen==='leaderboard'?'active':''}`} onClick={() => setScreen('leaderboard')}>
        <TrophyIcon />Ranking
      </button>
      <button className="nav-btn" onClick={onLogout}>
        <LogoutIcon />Sair
      </button>
    </nav>
  );
}

// ─────────────────────────────────────────────────
// MINI LEADERBOARD (usado no dashboard)
// ─────────────────────────────────────────────────
function MiniLeaderboard({ players, currentPlayerId }) {
  const [ranks, setRanks] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const mes = mesAtual();

  React.useEffect(() => {
    (async () => {
      const { data } = await sb.from('entries').select('player_id,passos,calorias,minutos')
        .gte('data', mes.inicio).lte('data', mes.fim);
      const r = players.map(p => {
        const es = data ? data.filter(e => e.player_id === p.id) : [];
        return { ...p, score: es.reduce((s,e) => s + fitScore(e.passos, e.calorias, e.minutos), 0) };
      }).sort((a,b) => b.score - a.score);
      setRanks(r); setLoading(false);
    })();
  }, []);

  if (loading) return <div className="muted" style={{ padding:'16px 0', fontSize:'0.85rem' }}>A carregar...</div>;

  return (
    <div>
      {ranks.map((p, i) => (
        <div key={p.id} className={`rank-row ${i===0?'winner':''} ${i===ranks.length-1&&ranks.length>1?'loser':''}`}>
          <div className="rank-inner">
            <div className="rank-num">{i===0?'🥇':i===1?'🥈':i===2?'🥉':`${i+1}º`}</div>
            <div className="rank-name">
              {p.nome}
              {p.id === currentPlayerId && <span className="you-badge">(tu)</span>}
              {i === ranks.length-1 && ranks.length > 1 && <span className="loser-badge">PAGA 😅</span>}
            </div>
            <div className="rank-score">{p.score.toLocaleString()}</div>
          </div>
        </div>
      ))}
    </div>
  );
}

// ─────────────────────────────────────────────────
// DASHBOARD
// ─────────────────────────────────────────────────
function Dashboard({ player, players, setScreen }) {
  const [meuScore, setMeuScore] = React.useState(0);
  const [dias, setDias] = React.useState(0);
  const [temHoje, setTemHoje] = React.useState(false);
  const [loading, setLoading] = React.useState(true);
  const mes = mesAtual();

  React.useEffect(() => {
    (async () => {
      const { data } = await sb.from('entries').select('passos,calorias,minutos,data')
        .eq('player_id', player.id).gte('data', mes.inicio).lte('data', mes.fim);
      if (data) {
        setMeuScore(data.reduce((s,e) => s + fitScore(e.passos, e.calorias, e.minutos), 0));
        setDias(data.length);
        setTemHoje(data.some(e => e.data === hoje()));
      }
      setLoading(false);
    })();
  }, []);

  return (
    <div className="screen">
      <div style={{ paddingTop:28, paddingBottom:20 }}>
        <div className="label-xs">{mes.label}</div>
        <div style={{ fontFamily:'var(--display)', fontSize:'2.4rem', letterSpacing:1, marginTop:4 }}>
          Olá, {player.nome} 👋
        </div>
      </div>

      {/* Score card */}
      <div className="card" style={{ borderColor:'rgba(0,255,135,0.2)' }}>
        <div className="label-xs">Teu FitScore este mês</div>
        <div className="big-score" style={{ marginTop:6 }}>
          {loading ? <span className="spinner"/> : meuScore.toLocaleString()}
        </div>
        <div className="muted" style={{ fontSize:'0.8rem', marginTop:6 }}>
          {dias} dia{dias!==1?'s':''} com registo
        </div>
      </div>

      {/* Hoje */}
      <div className="card">
        <div style={{ fontFamily:'var(--display)', fontSize:'1.1rem', marginBottom:10, letterSpacing:1 }}>
          HOJE
        </div>
        {temHoje ? (
          <div style={{ display:'flex', alignItems:'center', gap:10 }}>
            <span style={{ fontSize:'1.6rem' }}>✅</span>
            <div>
              <div style={{ fontWeight:700 }}>Registo feito!</div>
              <div className="muted" style={{ fontSize:'0.82rem' }}>Continua assim amanhã 💪</div>
            </div>
          </div>
        ) : (
          <div>
            <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:14 }}>
              <span style={{ fontSize:'1.6rem' }}>⚠️</span>
              <div>
                <div style={{ fontWeight:700, color:'var(--red)' }}>Ainda não registaste hoje</div>
                <div className="muted" style={{ fontSize:'0.82rem' }}>Não fiques para trás!</div>
              </div>
            </div>
            <button className="btn btn-primary" onClick={() => setScreen('entry')}>
              Registar agora 📸
            </button>
          </div>
        )}
      </div>

      {/* Mini ranking */}
      <div style={{ marginTop:8 }}>
        <div className="section-title">Ranking do mês</div>
        <MiniLeaderboard players={players} currentPlayerId={player.id} />
      </div>

      <button className="btn btn-ghost" style={{ marginTop:8 }} onClick={() => setScreen('leaderboard')}>
        Ver ranking detalhado →
      </button>
    </div>
  );
}

// ─────────────────────────────────────────────────
// ENTRY FORM
// ─────────────────────────────────────────────────
function EntryForm({ player, onSuccess }) {
  const [passos, setPassos] = React.useState('');
  const [calorias, setCalorias] = React.useState('');
  const [minutos, setMinutos] = React.useState('');
  const [foto, setFoto] = React.useState(null);
  const [preview, setPreview] = React.useState(null);
  const [loading, setLoading] = React.useState(false);
  const [erro, setErro] = React.useState('');
  const [jaFeito, setJaFeito] = React.useState(null); // null=loading, false=nao, true=sim
  const [sucesso, setSucesso] = React.useState(false);

  React.useEffect(() => {
    (async () => {
      const { data } = await sb.from('entries').select('id')
        .eq('player_id', player.id).eq('data', hoje()).maybeSingle();
      setJaFeito(!!data);
    })();
  }, []);

  const handleFoto = (e) => {
    const f = e.target.files[0]; if (!f) return;
    setFoto(f); setPreview(URL.createObjectURL(f));
  };

  const submit = async () => {
    if (!passos || !calorias || !minutos) { setErro('Preenche passos, calorias e minutos.'); return; }
    if (parseInt(passos) < 0 || parseInt(calorias) < 0 || parseInt(minutos) < 0) { setErro('Valores não podem ser negativos.'); return; }
    if (!foto) { setErro('A foto de prova é obrigatória 📸'); return; }

    setLoading(true); setErro('');

    // Upload foto
    const ext = foto.name.split('.').pop() || 'jpg';
    const path = `${player.id}/${hoje()}.${ext}`;
    const { error: upErr } = await sb.storage.from('provas').upload(path, foto, { upsert: true });
    if (upErr) { setErro('Erro no upload da foto: ' + upErr.message); setLoading(false); return; }

    const { data: { publicUrl } } = sb.storage.from('provas').getPublicUrl(path);

    const { error: insErr } = await sb.from('entries').insert({
      player_id: player.id,
      data: hoje(),
      passos: parseInt(passos),
      calorias: parseInt(calorias),
      minutos: parseInt(minutos),
      foto_url: publicUrl
    });

    if (insErr) { setErro('Erro ao guardar: ' + insErr.message); setLoading(false); return; }

    setSucesso(true);
    setTimeout(() => onSuccess(), 1800);
  };

  // Loading check
  if (jaFeito === null) return (
    <div className="screen" style={{ display:'flex', alignItems:'center', justifyContent:'center' }}>
      <div className="spinner"/>
    </div>
  );

  // Already submitted
  if (jaFeito || sucesso) return (
    <div className="screen">
      <div className="success-screen">
        <div style={{ fontSize:'5rem', marginBottom:16 }}>{sucesso ? '🚀' : '✅'}</div>
        <div style={{ fontFamily:'var(--display)', fontSize:'2.2rem', marginBottom:8 }}>
          {sucesso ? 'SUBMETIDO!' : 'JÁ REGISTASTE HOJE!'}
        </div>
        <div className="muted" style={{ fontSize:'0.9rem' }}>
          {sucesso ? 'Registo guardado com sucesso.' : 'Um registo por dia. Volta amanhã 💪'}
        </div>
      </div>
    </div>
  );

  const scorePreview = passos && calorias && minutos
    ? fitScore(parseInt(passos)||0, parseInt(calorias)||0, parseInt(minutos)||0)
    : null;

  return (
    <div className="screen">
      <div style={{ paddingTop:28, paddingBottom:20 }}>
        <div className="label-xs">{hoje()}</div>
        <div style={{ fontFamily:'var(--display)', fontSize:'2rem', letterSpacing:1, marginTop:4 }}>
          Registo de hoje
        </div>
      </div>

      <div className="card">
        <div className="field">
          <label>👟 Passos</label>
          <input type="number" inputMode="numeric" placeholder="Ex: 10000"
            value={passos} onChange={e => setPassos(e.target.value)} />
        </div>
        <div className="field">
          <label>🔥 Calorias gastas</label>
          <input type="number" inputMode="numeric" placeholder="Ex: 450"
            value={calorias} onChange={e => setCalorias(e.target.value)} />
        </div>
        <div className="field" style={{ marginBottom:0 }}>
          <label>⏱️ Minutos ativos</label>
          <input type="number" inputMode="numeric" placeholder="Ex: 45"
            value={minutos} onChange={e => setMinutos(e.target.value)} />
        </div>
      </div>

      <div className="card">
        <div className="field" style={{ marginBottom:0 }}>
          <label>📸 Foto de prova (obrigatório)</label>
          <div className={`photo-zone ${preview?'filled':''}`}
            onClick={() => document.getElementById('foto-input').click()}>
            <input id="foto-input" type="file" accept="image/*" capture="environment" onChange={handleFoto} />
            {preview
              ? <img src={preview} alt="prova" />
              : <div>
                  <div style={{ fontSize:'2.5rem', marginBottom:10 }}>📷</div>
                  <div className="muted" style={{ fontSize:'0.9rem' }}>
                    Toca para tirar foto ou escolher da galeria
                  </div>
                  <div className="muted" style={{ fontSize:'0.75rem', marginTop:6 }}>
                    Screenshot da app de fitness, foto a correr, etc.
                  </div>
                </div>
            }
          </div>
        </div>
      </div>

      {scorePreview !== null && (
        <div className="score-preview">
          <div>
            <div className="label-xs">FitScore de hoje</div>
            <div style={{ fontFamily:'var(--display)', fontSize:'1.8rem', color:'var(--green)', marginTop:2 }}>
              +{scorePreview}
            </div>
          </div>
          <div style={{ fontSize:'0.75rem', color:'var(--muted)', textAlign:'right', lineHeight:1.6 }}>
            {passos}÷100 = {Math.round(parseInt(passos)/100)}<br/>
            {calorias}÷10 = {Math.round(parseInt(calorias)/10)}<br/>
            {minutos} min = {parseInt(minutos)}
          </div>
        </div>
      )}

      {erro && <div className="error">⚠️ {erro}</div>}

      <button className="btn btn-primary" onClick={submit} disabled={loading}>
        {loading ? 'A guardar...' : 'Submeter 🚀'}
      </button>
    </div>
  );
}

// ─────────────────────────────────────────────────
// LEADERBOARD COMPLETO
// ─────────────────────────────────────────────────
function LeaderboardFull({ players, currentPlayer }) {
  const [ranks, setRanks] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const [fotoModal, setFotoModal] = React.useState(null);
  const mes = mesAtual();

  const load = async () => {
    const { data } = await sb.from('entries')
      .select('player_id,passos,calorias,minutos,data,foto_url')
      .gte('data', mes.inicio).lte('data', mes.fim)
      .order('data', { ascending: false });

    const r = players.map(p => {
      const es = data ? data.filter(e => e.player_id === p.id) : [];
      return {
        ...p,
        score: es.reduce((s,e) => s + fitScore(e.passos, e.calorias, e.minutos), 0),
        passos: es.reduce((s,e) => s + e.passos, 0),
        calorias: es.reduce((s,e) => s + e.calorias, 0),
        minutos: es.reduce((s,e) => s + e.minutos, 0),
        dias: es.length,
        ultima_foto: es.length > 0 ? es[0].foto_url : null
      };
    }).sort((a,b) => b.score - a.score);

    setRanks(r); setLoading(false);
  };

  React.useEffect(() => { load(); }, []);

  if (loading) return (
    <div className="screen" style={{ display:'flex', alignItems:'center', justifyContent:'center' }}>
      <div className="spinner"/>
    </div>
  );

  const loser = ranks.length > 1 ? ranks[ranks.length-1] : null;

  return (
    <div className="screen">
      <div style={{ paddingTop:28, paddingBottom:16 }}>
        <div className="label-xs">{mes.label}</div>
        <div style={{ fontFamily:'var(--display)', fontSize:'2.2rem', letterSpacing:1, marginTop:4 }}>
          RANKING 🏆
        </div>
      </div>

      {loser && (
        <div className="card" style={{ borderColor:'rgba(255,56,100,0.3)', background:'rgba(255,56,100,0.05)', marginBottom:16, textAlign:'center' }}>
          <div style={{ fontSize:'0.75rem', textTransform:'uppercase', letterSpacing:1, color:'var(--red)', fontWeight:700 }}>
            🚨 Em último este mês
          </div>
          <div style={{ fontFamily:'var(--display)', fontSize:'2rem', marginTop:4 }}>
            {loser.nome}
          </div>
          <div style={{ color:'var(--muted)', fontSize:'0.82rem' }}>
            Vai a correr! 🏃
          </div>
        </div>
      )}

      {ranks.map((p, i) => (
        <div key={p.id} className={`rank-row ${i===0?'winner':''} ${i===ranks.length-1&&ranks.length>1?'loser':''}`}>
          <div className="rank-inner">
            <div className="rank-num">{i===0?'🥇':i===1?'🥈':i===2?'🥉':`${i+1}º`}</div>
            <div className="rank-name">
              {p.nome}
              {p.id === currentPlayer.id && <span className="you-badge">(tu)</span>}
              {i === ranks.length-1 && ranks.length>1 && <span className="loser-badge">PAGA 😅</span>}
            </div>
            <div style={{ textAlign:'right' }}>
              <div className="rank-score" style={{ color: i===ranks.length-1&&ranks.length>1 ? 'var(--red)' : 'var(--green)' }}>
                {p.score.toLocaleString()}
              </div>
              <div style={{ fontSize:'0.7rem', color:'var(--muted)' }}>{p.dias} dias</div>
            </div>
          </div>
          <div className="rank-stats">
            <span className="stat-chip">👟 {p.passos.toLocaleString()}</span>
            <span className="stat-chip">🔥 {p.calorias.toLocaleString()}</span>
            <span className="stat-chip">⏱️ {p.minutos} min</span>
            {p.ultima_foto && (
              <span className="stat-chip" style={{ cursor:'pointer', color:'var(--green)', textDecoration:'underline' }}
                onClick={() => setFotoModal(p.ultima_foto)}>
                📸 ver prova
              </span>
            )}
          </div>
        </div>
      ))}

      <div className="card" style={{ marginTop:16, textAlign:'center' }}>
        <div className="label-xs" style={{ marginBottom:6 }}>Fórmula FitScore</div>
        <div style={{ fontSize:'0.85rem', color:'var(--muted)' }}>
          Passos ÷ 100 &nbsp;+&nbsp; Calorias ÷ 10 &nbsp;+&nbsp; Minutos
        </div>
        <div style={{ fontSize:'0.78rem', color:'var(--muted)', marginTop:4 }}>
          Exemplo: 10.000 passos + 500 cal + 60 min = <strong style={{ color:'var(--green)' }}>210 pts</strong>
        </div>
      </div>

      <button className="btn btn-ghost" style={{ marginTop:8 }} onClick={load}>
        Atualizar ↻
      </button>

      {/* Foto modal */}
      {fotoModal && (
        <div onClick={() => setFotoModal(null)}
          style={{ position:'fixed', inset:0, background:'rgba(0,0,0,0.9)', display:'flex', alignItems:'center', justifyContent:'center', zIndex:200, padding:20 }}>
          <img src={fotoModal} style={{ maxWidth:'100%', maxHeight:'90vh', borderRadius:12, border:'1px solid var(--border)' }} />
        </div>
      )}
    </div>
  );
}

// ─────────────────────────────────────────────────
// ROOT APP
// ─────────────────────────────────────────────────
function App() {
  const [state, setState] = React.useState('loading'); // loading | setup | login | app
  const [players, setPlayers] = React.useState([]);
  const [player, setPlayer] = React.useState(null);
  const [screen, setScreen] = React.useState('dashboard');
  const [temHoje, setTemHoje] = React.useState(false);

  React.useEffect(() => {
    (async () => {
      const { data, error } = await sb.from('players').select('*').order('created_at');
      if (error || !data || data.length === 0) { setState('setup'); return; }
      setPlayers(data);

      const saved = localStorage.getItem('fitwar_pid');
      if (saved) {
        const p = data.find(x => x.id === saved);
        if (p) { setPlayer(p); await checkHoje(p.id); setState('app'); return; }
      }
      setState('login');
    })();
  }, []);

  const checkHoje = async (pid) => {
    const { data } = await sb.from('entries').select('id').eq('player_id', pid).eq('data', hoje()).maybeSingle();
    setTemHoje(!!data);
  };

  const handleLogin = async (p) => {
    setPlayer(p); localStorage.setItem('fitwar_pid', p.id);
    await checkHoje(p.id); setState('app');
  };

  const handleLogout = () => {
    localStorage.removeItem('fitwar_pid'); setPlayer(null); setState('login');
  };

  const handleSetupComplete = async () => {
    const { data } = await sb.from('players').select('*').order('created_at');
    setPlayers(data || []); setState('login');
  };

  const handleEntrySuccess = () => {
    setTemHoje(true); setScreen('dashboard');
  };

  if (state === 'loading') return <LoadingScreen />;
  if (state === 'setup')   return <SetupScreen onComplete={handleSetupComplete} />;
  if (state === 'login')   return <LoginScreen players={players} onLogin={handleLogin} />;

  return (
    <div>
      {screen === 'dashboard'   && <Dashboard player={player} players={players} setScreen={setScreen} />}
      {screen === 'entry'       && <EntryForm player={player} onSuccess={handleEntrySuccess} />}
      {screen === 'leaderboard' && <LeaderboardFull players={players} currentPlayer={player} />}
      <BottomNav screen={screen} setScreen={setScreen} temHoje={temHoje} onLogout={handleLogout} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
