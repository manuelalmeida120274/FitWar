<!DOCTYPE html>
<html lang="pt" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>FitWar 💪</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    /* ── Themes ── */
    [data-theme="dark"] {
      --bg:#07070e; --bg2:#0d0d1c; --card:rgba(255,255,255,0.04);
      --border:rgba(255,255,255,0.09); --green:#00ff87; --red:#ff3864;
      --yellow:#ffc107; --text:#f0f0f0; --muted:rgba(240,240,240,0.42);
      --input-bg:rgba(255,255,255,0.06); --nav-bg:rgba(7,7,14,0.96);
    }
    [data-theme="light"] {
      --bg:#f4f4f8; --bg2:#ffffff; --card:rgba(0,0,0,0.04);
      --border:rgba(0,0,0,0.1); --green:#00b860; --red:#e02040;
      --yellow:#e09800; --text:#111122; --muted:rgba(17,17,34,0.45);
      --input-bg:rgba(0,0,0,0.05); --nav-bg:rgba(244,244,248,0.96);
    }
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { background:var(--bg); color:var(--text); font-family:'DM Sans',system-ui,sans-serif; min-height:100vh; overflow-x:hidden; transition:background 0.2s,color 0.2s; }
    [data-theme="dark"] body::before {
      content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
      background-image:linear-gradient(rgba(0,255,135,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,255,135,0.025) 1px,transparent 1px);
      background-size:44px 44px;
    }
    #root { position:relative; z-index:1; }
    .screen { min-height:100vh; padding:20px 16px 90px; max-width:480px; margin:0 auto; }
    /* Typography */
    .logo { font-family:'Bebas Neue',sans-serif; font-size:3.2rem; letter-spacing:3px; color:var(--green); text-shadow:0 0 40px rgba(0,255,135,0.3); line-height:1; }
    .logo span { color:var(--text); }
    .display { font-family:'Bebas Neue',sans-serif; letter-spacing:1px; }
    .label-xs { font-size:0.72rem; text-transform:uppercase; letter-spacing:1.2px; font-weight:700; color:var(--muted); }
    .muted { color:var(--muted); }
    /* Cards */
    .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:18px; margin-bottom:12px; }
    /* Fields */
    .field { margin-bottom:14px; }
    label { display:block; font-size:0.72rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:1.2px; margin-bottom:6px; }
    input[type=text],input[type=password],input[type=number],input[type=url],input[type=date],select,textarea {
      width:100%; background:var(--input-bg); border:1px solid var(--border);
      border-radius:9px; padding:13px 14px; color:var(--text); font-family:'DM Sans',system-ui,sans-serif;
      font-size:1rem; outline:none; transition:border-color 0.2s,box-shadow 0.2s;
    }
    textarea { resize:vertical; min-height:80px; }
    input:focus,select:focus,textarea:focus { border-color:var(--green); box-shadow:0 0 0 3px rgba(0,255,135,0.1); }
    input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button { -webkit-appearance:none; }
    select option { background:var(--bg2); }
    /* Buttons */
    .btn { display:block; width:100%; padding:14px; border-radius:10px; border:none; font-family:'Bebas Neue',sans-serif; font-size:1.25rem; letter-spacing:1.5px; cursor:pointer; transition:all 0.18s; }
    .btn-primary { background:var(--green); color:#07070e; font-weight:900; }
    .btn-primary:hover:not(:disabled) { opacity:0.88; transform:translateY(-1px); }
    .btn-primary:disabled { opacity:0.35; cursor:not-allowed; }
    .btn-ghost { background:transparent; color:var(--text); border:1px solid var(--border); }
    .btn-ghost:hover { border-color:var(--green); color:var(--green); }
    .btn-danger-sm { background:rgba(255,56,100,0.12); color:var(--red); border:1px solid rgba(255,56,100,0.25); border-radius:8px; padding:7px 12px; font-family:'DM Sans',sans-serif; font-size:0.82rem; font-weight:700; cursor:pointer; }
    .btn + .btn { margin-top:8px; }
    /* Toggle row */
    .toggle-row { display:flex; gap:8px; margin-bottom:14px; }
    .toggle-btn { flex:1; padding:10px 8px; border-radius:8px; border:1px solid var(--border); background:transparent; color:var(--muted); cursor:pointer; font-size:0.85rem; font-weight:700; font-family:'DM Sans',sans-serif; transition:all 0.15s; }
    .toggle-btn.active { background:rgba(0,255,135,0.1); border-color:var(--green); color:var(--green); }
    /* Nav */
    .bottom-nav { position:fixed; bottom:0; left:0; right:0; background:var(--nav-bg); backdrop-filter:blur(24px); border-top:1px solid var(--border); display:flex; justify-content:space-around; padding:10px 0 max(16px,env(safe-area-inset-bottom)); z-index:100; }
    .nav-btn { display:flex; flex-direction:column; align-items:center; gap:3px; background:none; border:none; color:var(--muted); cursor:pointer; padding:5px 14px; font-family:'DM Sans',sans-serif; font-size:0.65rem; transition:color 0.18s; position:relative; }
    .nav-btn svg { width:21px; height:21px; stroke-width:1.8; }
    .nav-btn.active { color:var(--green); }
    .nav-btn .dot { position:absolute; top:3px; right:8px; width:8px; height:8px; background:var(--red); border-radius:50%; border:2px solid var(--bg); }
    /* Rank */
    .rank-row { display:flex; flex-direction:column; gap:8px; padding:14px 16px; border-radius:11px; margin-bottom:8px; border:1px solid var(--border); background:var(--card); }
    .rank-row.winner { border-color:rgba(0,255,135,0.35); background:rgba(0,255,135,0.04); }
    .rank-row.loser { border-color:rgba(255,56,100,0.35); background:rgba(255,56,100,0.05); }
    .rank-inner { display:flex; align-items:center; gap:12px; }
    .rank-num { font-family:'Bebas Neue',sans-serif; font-size:1.5rem; min-width:30px; text-align:center; }
    .rank-name { flex:1; font-weight:700; font-size:1rem; }
    .rank-score { font-family:'Bebas Neue',sans-serif; font-size:1.5rem; color:var(--green); }
    .rank-row.loser .rank-score { color:var(--red); }
    .rank-stats { display:flex; gap:10px; padding-left:42px; flex-wrap:wrap; }
    .stat-chip { font-size:0.75rem; color:var(--muted); }
    /* Badges */
    .loser-badge { font-size:0.65rem; font-weight:700; background:rgba(255,56,100,0.18); color:var(--red); padding:2px 6px; border-radius:4px; margin-left:4px; }
    .multa-badge { font-size:0.65rem; font-weight:700; background:rgba(255,56,100,0.12); color:var(--red); padding:2px 6px; border-radius:4px; margin-left:4px; }
    .you-badge { font-size:0.65rem; color:var(--muted); margin-left:4px; }
    .version-badge { display:inline-block; font-size:0.65rem; font-weight:700; background:rgba(0,255,135,0.1); color:var(--green); border:1px solid rgba(0,255,135,0.2); padding:2px 8px; border-radius:20px; }
    /* Misc */
    .big-score { font-family:'Bebas Neue',sans-serif; font-size:4rem; line-height:1; color:var(--green); }
    .error { color:var(--red); font-size:0.85rem; margin:8px 0; }
    .warn-box { padding:12px 14px; background:rgba(255,193,7,0.08); border:1px solid rgba(255,193,7,0.25); border-radius:10px; font-size:0.85rem; color:var(--yellow); margin-bottom:12px; }
    .success-screen { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:70vh; text-align:center; }
    .score-preview { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; background:rgba(0,255,135,0.05); border:1px solid rgba(0,255,135,0.2); border-radius:10px; margin-bottom:12px; }
    .photo-zone { border:2px dashed var(--border); border-radius:12px; padding:28px 20px; text-align:center; cursor:pointer; transition:all 0.2s; }
    .photo-zone.filled { border-color:var(--green); }
    .photo-zone img { width:100%; max-height:200px; object-fit:cover; border-radius:8px; }
    .spinner { display:inline-block; width:20px; height:20px; border:2px solid rgba(255,255,255,0.2); border-top-color:var(--green); border-radius:50%; animation:spin 0.7s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }
    /* Avatar */
    .avatar-lg { width:72px; height:72px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:2.2rem; background:var(--card); border:2px solid var(--border); overflow:hidden; }
    .avatar-lg img { width:100%; height:100%; object-fit:cover; }
    .emoji-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:6px; margin-top:10px; }
    .emoji-opt { font-size:1.5rem; padding:6px; border-radius:8px; cursor:pointer; text-align:center; border:2px solid transparent; transition:all 0.15s; }
    .emoji-opt:hover,.emoji-opt.selected { border-color:var(--green); background:rgba(0,255,135,0.08); }
    /* Alert overlay */
    .alert-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.88); z-index:300; display:flex; align-items:center; justify-content:center; padding:20px; }
    .alert-box { background:var(--bg2); border:1px solid rgba(255,56,100,0.35); border-radius:16px; padding:24px; width:100%; max-width:420px; max-height:80vh; overflow-y:auto; }
    .alert-item-self { padding:12px 14px; border-radius:10px; margin-bottom:8px; font-size:0.88rem; line-height:1.6; background:rgba(255,56,100,0.08); border:1px solid rgba(255,56,100,0.2); }
    .alert-item-other { padding:12px 14px; border-radius:10px; margin-bottom:8px; font-size:0.88rem; line-height:1.6; background:rgba(255,193,7,0.06); border:1px solid rgba(255,193,7,0.18); }
    .alert-item-msg { padding:12px 14px; border-radius:10px; margin-bottom:8px; font-size:0.88rem; line-height:1.6; background:rgba(0,255,135,0.05); border:1px solid rgba(0,255,135,0.18); }
    .alert-item-peso { padding:12px 14px; border-radius:10px; margin-bottom:8px; font-size:0.88rem; line-height:1.6; background:rgba(255,193,7,0.06); border:1px solid rgba(255,193,7,0.18); }
    /* Divider */
    .divider { height:1px; background:var(--border); margin:16px 0; }
    /* Theme toggle */
    .theme-switch { display:flex; align-items:center; justify-content:space-between; padding:14px 16px; background:var(--card); border:1px solid var(--border); border-radius:10px; margin-bottom:10px; }
    .switch { position:relative; width:44px; height:24px; }
    .switch input { opacity:0; width:0; height:0; }
    .slider { position:absolute; cursor:pointer; inset:0; background:var(--border); border-radius:24px; transition:0.3s; }
    .slider:before { content:''; position:absolute; height:18px; width:18px; left:3px; bottom:3px; background:var(--text); border-radius:50%; transition:0.3s; }
    input:checked + .slider { background:var(--green); }
    input:checked + .slider:before { transform:translateX(20px); background:#07070e; }
    /* Changelog */
    .changelog-item { padding:10px 14px; border-left:3px solid var(--green); margin-bottom:8px; background:var(--card); border-radius:0 8px 8px 0; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

// ── Config ─────────────────────────────────────────
const SUPABASE_URL  = 'https://xmdktsqavrtifnrsaruo.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhtZGt0c3FhdnJ0aWZucnNhcnVvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1MzI4NTYsImV4cCI6MjA5NTEwODg1Nn0.ys6iTqg2-umW7ePi78WAdCZ66QkWOLu2Kg0FjE4yQOI';
const APP_VERSION = '2.0';
const APP_DATE    = '24 Mai 2026';
const CHANGELOG = [
  { v:'2.0', data:'24 Mai 2026', resumo:'Perfil, peso/cintura, mensagens, temas claro/escuro' },
  { v:'1.0', data:'23 Mai 2026', resumo:'Lançamento — registo diário, ranking, multas, fotos' },
];
const AVATARES = ['🏃','💪','🚴','🏊','⚽','🎾','🏋️','🧘','🤸','🥊','🏆','🔥','⚡','🦁','🐺','🦊','🐯','🦅','🌟','💎'];

const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON);

// ── Utils ──────────────────────────────────────────
const hoje = () => new Date().toISOString().split('T')[0];
const mesAtual = () => {
  const d = new Date();
  const m = String(d.getMonth()+1).padStart(2,'0');
  return {
    inicio: `${d.getFullYear()}-${m}-01`,
    fim:    `${d.getFullYear()}-${m}-31`,
    label:  d.toLocaleDateString('pt-PT',{month:'long',year:'numeric'})
  };
};
const semanaAtual = () => {
  const d = new Date();
  const day = d.getDay();
  const diff = d.getDate() - day + (day===0 ? -6 : 1);
  const seg = new Date(d.setDate(diff));
  return seg.toISOString().split('T')[0];
};
const fitScore = (passos, calorias, minutos) =>
  Math.round((passos/100) + (calorias/8) + (minutos*1.5));
const diasSemPeso = (ultimoPeso) => {
  if (!ultimoPeso) return 999;
  const diff = new Date() - new Date(ultimoPeso);
  return Math.floor(diff / (1000*60*60*24));
};

// ── Icons ──────────────────────────────────────────
const HomeIcon   = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>;
const PlusIcon   = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>;
const TrophyIcon = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>;
const UserIcon   = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>;

// ── Avatar Component ───────────────────────────────
function Avatar({ player, size=40 }) {
  const style = { width:size, height:size, borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center', fontSize:size*0.5, background:'var(--card)', border:'2px solid var(--border)', overflow:'hidden', flexShrink:0 };
  if (player.avatar && player.avatar.startsWith('http')) {
    return <div style={style}><img src={player.avatar} style={{width:'100%',height:'100%',objectFit:'cover'}} /></div>;
  }
  return <div style={style}>{player.avatar || '🏃'}</div>;
}

// ── Loading ────────────────────────────────────────
function LoadingScreen() {
  return (
    <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',minHeight:'100vh',gap:20}}>
      <div className="logo">FIT<span>WAR</span></div>
      <div className="spinner"/>
    </div>
  );
}

// ── Setup ──────────────────────────────────────────
function SetupScreen({ onComplete }) {
  const [jogadores, setJogadores] = React.useState(Array(4).fill(null).map(()=>({nome:'',pin:''})));
  const [loading, setLoading] = React.useState(false);
  const [erro, setErro] = React.useState('');

  const update = (i,field,val) => { const j=[...jogadores]; j[i]={...j[i],[field]:val}; setJogadores(j); };

  const submit = async () => {
    if (jogadores.some(j=>!j.nome.trim()||!j.pin.trim())) { setErro('Preenche todos os nomes e PINs.'); return; }
    if (new Set(jogadores.map(j=>j.nome.trim().toLowerCase())).size<4) { setErro('Nomes duplicados.'); return; }
    setLoading(true); setErro('');
    const { error } = await sb.from('players').insert(jogadores.map(j=>({nome:j.nome.trim(),pin:j.pin.trim(),multas:0,avatar:'🏃'})));
    if (error) { setErro(error.message); setLoading(false); return; }
    onComplete();
  };

  return (
    <div className="screen">
      <div style={{paddingTop:40,paddingBottom:28}}>
        <div className="logo">FIT<span>WAR</span></div>
        <div className="muted" style={{marginTop:8,fontSize:'0.9rem'}}>Configuração inicial — 4 jogadores e PINs.</div>
      </div>
      {jogadores.map((j,i) => (
        <div className="card" key={i}>
          <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:'1rem',marginBottom:12,color:'var(--muted)',letterSpacing:1}}>JOGADOR {i+1}</div>
          <div className="field">
            <label>Nome</label>
            <input type="text" placeholder="Ex: Manuel" value={j.nome} onChange={e=>update(i,'nome',e.target.value)} />
          </div>
          <div className="field" style={{marginBottom:0}}>
            <label>PIN</label>
            <input type="password" inputMode="numeric" placeholder="..." maxLength={6} value={j.pin} onChange={e=>update(i,'pin',e.target.value.replace(/\D/g,''))} />
          </div>
        </div>
      ))}
      {erro && <div className="error">⚠️ {erro}</div>}
      <button className="btn btn-primary" onClick={submit} disabled={loading} style={{marginTop:8}}>
        {loading ? 'A criar...' : 'Arrancar o FitWar 🔥'}
      </button>
    </div>
  );
}

// ── Login ──────────────────────────────────────────
function LoginScreen({ players, onLogin }) {
  const [selectedId, setSelectedId] = React.useState('');
  const [pin, setPin] = React.useState('');
  const [erro, setErro] = React.useState('');
  const [showChangelog, setShowChangelog] = React.useState(false);

  const handleLogin = () => {
    if (!selectedId) { setErro('Escolhe o teu nome.'); return; }
    const player = players.find(p=>p.id===selectedId);
    if (!player||player.pin!==pin) { setErro('PIN errado.'); setPin(''); return; }
    onLogin(player);
  };

  return (
    <div className="screen">
      <div style={{paddingTop:50,paddingBottom:32,textAlign:'center'}}>
        <div className="logo" style={{fontSize:'4rem'}}>FIT<span>WAR</span></div>
        <div style={{marginTop:10,display:'flex',alignItems:'center',justifyContent:'center',gap:8}}>
          <span className="version-badge" style={{cursor:'pointer'}} onClick={()=>setShowChangelog(!showChangelog)}>
            v{APP_VERSION} · {APP_DATE}
          </span>
        </div>
        {showChangelog && (
          <div style={{marginTop:14,textAlign:'left'}}>
            {CHANGELOG.map((c,i) => (
              <div key={i} className="changelog-item">
                <div style={{fontWeight:700,fontSize:'0.85rem'}}>v{c.v} <span style={{color:'var(--muted)',fontWeight:400,fontSize:'0.78rem'}}>— {c.data}</span></div>
                <div style={{fontSize:'0.82rem',color:'var(--muted)',marginTop:2}}>{c.resumo}</div>
              </div>
            ))}
          </div>
        )}
        <div className="muted" style={{marginTop:12,fontSize:'0.88rem'}}>Quem vai pagar a conta este mês? 😈</div>
      </div>
      <div className="card">
        <div className="field">
          <label>Quem és tu?</label>
          <select value={selectedId} onChange={e=>{setSelectedId(e.target.value);setErro('');}}>
            <option value="">Escolhe o teu nome...</option>
            {players.map(p=><option key={p.id} value={p.id}>{p.avatar&&!p.avatar.startsWith('http')?p.avatar+' ':''}{p.nickname||p.nome}</option>)}
          </select>
        </div>
        <div className="field" style={{marginBottom:0}}>
          <label>PIN</label>
          <input type="password" inputMode="numeric" placeholder="..." maxLength={6} value={pin}
            onChange={e=>{setPin(e.target.value.replace(/\D/g,''));setErro('');}}
            onKeyDown={e=>e.key==='Enter'&&handleLogin()} />
        </div>
        {erro && <div className="error">⚠️ {erro}</div>}
        <button className="btn btn-primary" onClick={handleLogin} style={{marginTop:16}}>Entrar 💪</button>
      </div>
    </div>
  );
}

// ── Bottom Nav ─────────────────────────────────────
function BottomNav({ screen, setScreen, temHoje, hasAlerts }) {
  return (
    <nav className="bottom-nav">
      <button className={'nav-btn'+(screen==='dashboard'?' active':'')} onClick={()=>setScreen('dashboard')}>
        <HomeIcon />Início
      </button>
      <button className={'nav-btn'+(screen==='entry'?' active':'')} onClick={()=>setScreen('entry')}>
        <PlusIcon />
        {!temHoje&&<span className="dot"/>}
        Registar
      </button>
      <button className={'nav-btn'+(screen==='leaderboard'?' active':'')} onClick={()=>setScreen('leaderboard')}>
        <TrophyIcon />Ranking
      </button>
      <button className={'nav-btn'+(screen==='perfil'?' active':'')} onClick={()=>setScreen('perfil')}>
        <UserIcon />
        {hasAlerts&&<span className="dot"/>}
        Perfil
      </button>
    </nav>
  );
}

// ── Mini Leaderboard ───────────────────────────────
function MiniLeaderboard({ players, currentPlayerId }) {
  const [ranks, setRanks] = React.useState([]);
  const [loading, setLoading] = React.useState(true);
  const mes = mesAtual();

  React.useEffect(()=>{
    (async()=>{
      const { data } = await sb.from('entries').select('player_id,passos,calorias,minutos').gte('data',mes.inicio).lte('data',mes.fim);
      const r = players.map(p=>{
        const es = data?data.filter(e=>e.player_id===p.id):[];
        return {...p,score:es.reduce((s,e)=>s+fitScore(e.passos,e.calorias,e.minutos),0)};
      }).sort((a,b)=>b.score-a.score);
      setRanks(r); setLoading(false);
    })();
  },[]);

  if (loading) return <div className="muted" style={{padding:'12px 0',fontSize:'0.85rem'}}>A carregar...</div>;

  return (
    <div>
      {ranks.map((p,i)=>(
        <div key={p.id} className={'rank-row'+(i===0?' winner':'')+(i===ranks.length-1&&ranks.length>1?' loser':'')}>
          <div className="rank-inner">
            <div className="rank-num">{i===0?'🥇':i===1?'🥈':i===2?'🥉':`${i+1}º`}</div>
            <Avatar player={p} size={32} />
            <div className="rank-name">
              {p.nickname||p.nome}
              {p.id===currentPlayerId&&<span className="you-badge">(tu)</span>}
              {i===ranks.length-1&&ranks.length>1&&<span className="loser-badge">PAGA 😅</span>}
              {p.multas>0&&<span className="multa-badge">🚨{p.multas}</span>}
            </div>
            <div className="rank-score">{p.score.toLocaleString()}</div>
          </div>
        </div>
      ))}
    </div>
  );
}

// ── Entry Form ─────────────────────────────────────
function EntryForm({ player, onSuccess }) {
  const [passos, setPassos]       = React.useState('');
  const [calorias, setCalorias]   = React.useState('');
  const [minutos, setMinutos]     = React.useState('');
  const [modoProva, setModoProva] = React.useState('foto');
  const [foto, setFoto]           = React.useState(null);
  const [preview, setPreview]     = React.useState(null);
  const [linkProva, setLinkProva] = React.useState('');
  const [mensagem, setMensagem]   = React.useState('');
  const [peso, setPeso]           = React.useState('');
  const [cintura, setCintura]     = React.useState('');
  const [precisaPeso, setPrecisaPeso] = React.useState(false);
  const [loading, setLoading]     = React.useState(false);
  const [erro, setErro]           = React.useState('');
  const [jaFeito, setJaFeito]     = React.useState(null);
  const [sucesso, setSucesso]     = React.useState(false);

  React.useEffect(()=>{
    (async()=>{
      const [{ data: entry },{ data: medSemana }] = await Promise.all([
        sb.from('entries').select('id').eq('player_id',player.id).eq('data',hoje()).maybeSingle(),
        sb.from('medidas').select('id').eq('player_id',player.id).gte('data',semanaAtual()).maybeSingle()
      ]);
      setJaFeito(!!entry);
      setPrecisaPeso(!medSemana);
    })();
  },[]);

  const handleFoto = (e) => { const f=e.target.files[0]; if(!f)return; setFoto(f); setPreview(URL.createObjectURL(f)); };

  const submit = async () => {
    if (!calorias&&!minutos) { setErro('Preenche pelo menos calorias ou minutos.'); return; }
    if (modoProva==='foto'&&!foto) { setErro('Junta uma foto de prova 📸'); return; }
    if (modoProva==='link'&&!linkProva.trim()) { setErro('Cola o link de prova 🔗'); return; }
    if (precisaPeso&&!peso) { setErro('É obrigatório registar o peso esta semana ⚖️'); return; }

    setLoading(true); setErro('');

    // Upload foto se necessário
    let foto_url = modoProva==='link' ? linkProva.trim() : null;
    if (modoProva==='foto'&&foto) {
      const ext = foto.name.split('.').pop()||'jpg';
      const path = `${player.id}/${hoje()}.${ext}`;
      const { error: upErr } = await sb.storage.from('provas').upload(path,foto,{upsert:true});
      if (upErr) { setErro('Erro no upload: '+upErr.message); setLoading(false); return; }
      const { data: { publicUrl } } = sb.storage.from('provas').getPublicUrl(path);
      foto_url = publicUrl;
    }

    // Guardar entrada
    const { error: insErr } = await sb.from('entries').insert({
      player_id:player.id, data:hoje(),
      passos:parseInt(passos)||0, calorias:parseInt(calorias)||0, minutos:parseInt(minutos)||0,
      foto_url
    });
    if (insErr) { setErro('Erro ao guardar: '+insErr.message); setLoading(false); return; }

    // Guardar peso/cintura se preenchido
    if (peso||cintura) {
      await sb.from('medidas').upsert({
        player_id:player.id, data:hoje(),
        peso:peso?parseFloat(peso):null,
        cintura:cintura?parseInt(cintura):null
      },{onConflict:'player_id,data'});
    }

    // Enviar mensagem aos outros
    if (mensagem.trim()) {
      const outros = await sb.from('players').select('id').neq('id',player.id);
      if (outros.data) {
        for (const outro of outros.data) {
          await sb.from('mensagens').insert({
            de_player_id:player.id, para_player_id:outro.id,
            mensagem:`💬 ${player.nickname||player.nome}: "${mensagem.trim()}"`
          });
        }
      }
    }

    setSucesso(true);
    setTimeout(()=>onSuccess(),1800);
  };

  if (jaFeito===null) return <div className="screen" style={{display:'flex',alignItems:'center',justifyContent:'center'}}><div className="spinner"/></div>;

  if (jaFeito||sucesso) return (
    <div className="screen">
      <div className="success-screen">
        <div style={{fontSize:'4.5rem',marginBottom:16}}>{sucesso?'🚀':'✅'}</div>
        <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:'2rem',marginBottom:8}}>{sucesso?'SUBMETIDO!':'JÁ REGISTASTE HOJE!'}</div>
        <div className="muted" style={{fontSize:'0.9rem'}}>{sucesso?'Registo guardado!':'Um registo por dia. Volta amanhã 💪'}</div>
      </div>
    </div>
  );

  const p=parseInt(passos)||0, c=parseInt(calorias)||0, m=parseInt(minutos)||0;
  const scorePreview = (c||m) ? fitScore(p,c,m) : null;

  return (
    <div className="screen">
      <div style={{paddingTop:24,paddingBottom:16}}>
        <div className="label-xs">{hoje()}</div>
        <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:'2rem',letterSpacing:1,marginTop:4}}>Registo de hoje</div>
      </div>

      {precisaPeso&&(
        <div className="warn-box">⚖️ Ainda não registaste o teu peso esta semana. Obrigatório antes de submeter!</div>
      )}

      <div className="card">
        <div className="field">
          <label>👟 Passos <span style={{fontWeight:400,fontSize:'0.68rem',color:'var(--muted)',textTransform:'none'}}>(opcional)</span></label>
          <input type="number" inputMode="numeric" placeholder="Ex: 10000" value={passos} onChange={e=>setPassos(e.target.value)} />
        </div>
        <div className="field">
          <label>🔥 Calorias gastas</label>
          <input type="number" inputMode="numeric" placeholder="Ex: 450" value={calorias} onChange={e=>setCalorias(e.target.value)} />
        </div>
        <div className="field" style={{marginBottom:0}}>
          <label>⏱️ Minutos ativos</label>
          <input type="number" inputMode="numeric" placeholder="Ex: 45" value={minutos} onChange={e=>setMinutos(e.target.value)} />
        </div>
      </div>

      <div className="card">
        <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:'1rem',letterSpacing:1,marginBottom:12,color:'var(--muted)'}}>⚖️ MEDIDAS</div>
        <div style={{display:'flex',gap:10}}>
          <div className="field" style={{flex:1,marginBottom:0}}>
            <label>Peso (kg){precisaPeso&&<span style={{color:'var(--red)'}}> *</span>}</label>
            <input type="number" inputMode="decimal" placeholder="Ex: 78.5" value={peso} onChange={e=>setPeso(e.target.value)} />
          </div>
          <div className="field" style={{flex:1,marginBottom:0}}>
            <label>Cintura (cm) <span style={{fontWeight:400,fontSize:'0.65rem',color:'var(--muted)',textTransform:'none'}}>(opc.)</span></label>
            <input type="number" inputMode="numeric" placeholder="Ex: 88" value={cintura} onChange={e=>setCintura(e.target.value)} />
          </div>
        </div>
      </div>

      <div className="card">
        <div className="toggle-row">
          <button className={'toggle-btn'+(modoProva==='foto'?' active':'')} onClick={()=>setModoProva('foto')}>📷 Foto</button>
          <button className={'toggle-btn'+(modoProva==='link'?' active':'')} onClick={()=>setModoProva('link')}>🔗 Link</button>
        </div>
        {modoProva==='foto'?(
          <div className="field" style={{marginBottom:0}}>
            <label>📸 Foto de prova</label>
            <input id="foto-camera" type="file" accept="image/*" capture="environment" onChange={handleFoto} style={{display:'none'}} />
            <input id="foto-galeria" type="file" accept="image/*" onChange={handleFoto} style={{display:'none'}} />
            {preview?(
              <div className="photo-zone filled" onClick={()=>document.getElementById('foto-galeria').click()}>
                <img src={preview} alt="prova" />
              </div>
            ):(
              <div style={{display:'flex',gap:8}}>
                <button className="btn btn-ghost" style={{flex:1,padding:'16px 8px',fontSize:'0.9rem',width:'auto'}} onClick={()=>document.getElementById('foto-camera').click()}>
                  📷<br/><span style={{fontSize:'0.72rem',color:'var(--muted)'}}>Câmara</span>
                </button>
                <button className="btn btn-ghost" style={{flex:1,padding:'16px 8px',fontSize:'0.9rem',width:'auto'}} onClick={()=>document.getElementById('foto-galeria').click()}>
                  🖼️<br/><span style={{fontSize:'0.72rem',color:'var(--muted)'}}>Galeria</span>
                </button>
              </div>
            )}
          </div>
        ):(
          <div className="field" style={{marginBottom:0}}>
            <label>🔗 Link de prova</label>
            <input type="url" placeholder="https://..." value={linkProva} onChange={e=>setLinkProva(e.target.value)} />
            <div className="muted" style={{fontSize:'0.78rem',marginTop:4}}>Strava, Samsung Health, Google Fit, etc.</div>
          </div>
        )}
      </div>

      <div className="card">
        <div className="field" style={{marginBottom:0}}>
          <label>💬 Mensagem aos outros <span style={{fontWeight:400,fontSize:'0.68rem',color:'var(--muted)',textTransform:'none'}}>(opcional)</span></label>
          <textarea placeholder="Ex: Hoje arrasámos no ginásio! 💪" value={mensagem} onChange={e=>setMensagem(e.target.value)} style={{minHeight:'70px'}} />
        </div>
      </div>

      {scorePreview!==null&&(
        <div className="score-preview">
          <div>
            <div className="label-xs">FitScore de hoje</div>
            <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:'1.8rem',color:'var(--green)',marginTop:2}}>+{scorePreview}</div>
          </div>
          <div style={{fontSize:'0.75rem',color:'var(--muted)',textAlign:'right',lineHeight:1.8}}>
            {p>0&&<div>Passos: {Math.round(p/100)}</div>}
            {c>0&&<div>Cal: {Math.round(c/8)}</div>}
            {m>0&&<div>Min: {Math.round(m*1.5)}</div>}
          </div>
        </div>
      )}

      {erro&&<div className="error">⚠️ {erro}</div>}
      <button className="btn btn-primary" onClick={submit} disabled={loading}>
        {loading?'A guardar...':'Submeter 🚀'}
      </button>
    </div>
  );
}

function LeaderboardFull({ players, currentPlayer }) {
  const [ranks, setRanks]         = React.useState([]);
  const [loading, setLoading]     = React.useState(true);
  const [fotoModal, setFotoModal] = React.useState(null);
  const mes = mesAtual();

  const load = async () => {
    setLoading(true);
    const [{ data: entries },{ data: medidas }] = await Promise.all([
      sb.from('entries').select('player_id,passos,calorias,minutos,data,foto_url').gte('data',mes.inicio).lte('data',mes.fim).order('data',{ascending:false}),
      sb.from('medidas').select('player_id,data,peso').gte('data',mes.inicio).lte('data',mes.fim).order('data',{ascending:false})
    ]);

    const r = players.map(p=>{
      const es = entries?entries.filter(e=>e.player_id===p.id):[];
      const ms = medidas?medidas.filter(m=>m.player_id===p.id&&m.peso):[];
      const ultimoMedida = medidas?medidas.filter(m=>m.player_id===p.id&&m.peso):[];
      return {
        ...p,
        score:    es.reduce((s,e)=>s+fitScore(e.passos,e.calorias,e.minutos),0),
        passos:   es.reduce((s,e)=>s+e.passos,0),
        calorias: es.reduce((s,e)=>s+e.calorias,0),
        minutos:  es.reduce((s,e)=>s+e.minutos,0),
        dias:     es.length,
        ultima_foto: es.length>0?es[0].foto_url:null,
        ultimo_peso: ultimoMedida.length>0?ultimoMedida[0].peso:null,
        dias_sem_peso: diasSemPeso(ultimoMedida.length>0?ultimoMedida[0].data:null)
      };
    }).sort((a,b)=>b.score-a.score);

    setRanks(r); setLoading(false);
  };

  React.useEffect(()=>{ load(); },[]);

  if (loading) return <div className="screen" style={{display:'flex',alignItems:'center',justifyContent:'center'}}><div className="spinner"/></div>;

  const loser = ranks.length>1?ranks[ranks.length-1]:null;

  return (
    <div className="screen">
      <div style={{paddingTop:24,paddingBottom:12}}>
        <div className="label-xs">{mes.label}</div>
        <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:'2.2rem',letterSpacing:1,marginTop:4}}>RANKING 🏆</div>
      </div>

      {loser&&(
        <div className="card" style={{borderColor:'rgba(255,56,100,0.3)',background:'rgba(255,56,100,0.05)',marginBottom:16,textAlign:'center'}}>
          <div style={{fontSize:'0.72rem',textTransform:'uppercase',letterSpacing:1,color:'var(--red)',fontWeight:700}}>🚨 Em último este mês</div>
          <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:'2rem',marginTop:4}}>{loser.nickname||loser.nome}</div>
          <div style={{color:'var(--muted)',fontSize:'0.82rem'}}>Vai a correr! 🏃</div>
        </div>
      )}

      {ranks.map((p,i)=>(
        <div key={p.id} className={'rank-row'+(i===0?' winner':'')+(i===ranks.length-1&&ranks.length>1?' loser':'')}>
          <div className="rank-inner">
            <div className="rank-num">{i===0?'🥇':i===1?'🥈':i===2?'🥉':`${i+1}º`}</div>
            <Avatar player={p} size={34} />
            <div className="rank-name" style={{marginLeft:6}}>
              {p.nickname||p.nome}
              {p.id===currentPlayer.id&&<span className="you-badge">(tu)</span>}
              {i===ranks.length-1&&ranks.length>1&&<span className="loser-badge">PAGA 😅</span>}
              {p.multas>0&&<span className="multa-badge">🚨{p.multas}</span>}
            </div>
            <div style={{textAlign:'right'}}>
              <div className="rank-score" style={{color:i===ranks.length-1&&ranks.length>1?'var(--red)':'var(--green)'}}>{p.score.toLocaleString()}</div>
              <div style={{fontSize:'0.68rem',color:'var(--muted)'}}>{p.dias} dias</div>
            </div>
          </div>
          <div className="rank-stats">
            <span className="stat-chip">👟 {p.passos.toLocaleString()}</span>
            <span className="stat-chip">🔥 {p.calorias.toLocaleString()}</span>
            <span className="stat-chip">⏱️ {p.minutos}m</span>
            {p.ultimo_peso&&<span className="stat-chip">⚖️ {p.ultimo_peso}kg</span>}
            {p.dias_sem_peso>=7&&<span className="stat-chip" style={{color:'var(--yellow)'}}>⚠️ sem peso</span>}
            {p.ultima_foto&&(
              <span className="stat-chip" style={{cursor:'pointer',color:'var(--green)',textDecoration:'underline'}} onClick={()=>setFotoModal(p.ultima_foto)}>
                📸 ver prova
              </span>
            )}
          </div>
        </div>
      ))}

      <div className="card" style={{marginTop:12,textAlign:'center'}}>
        <div className="label-xs" style={{marginBottom:6}}>Fórmula FitScore</div>
        <div style={{fontSize:'0.85rem',color:'var(--muted)'}}>Passos ÷ 100 + Calorias ÷ 8 + Minutos × 1.5</div>
        <div style={{fontSize:'0.78rem',color:'var(--muted)',marginTop:4}}>
          Ex: 421 cal + 43 min = <strong style={{color:'var(--green)'}}>117 pts</strong>
          &nbsp;|&nbsp;
          10k passos + 300 cal + 30 min = <strong style={{color:'var(--green)'}}>182 pts</strong>
        </div>
      </div>

      <button className="btn btn-ghost" style={{marginTop:8}} onClick={load}>Atualizar ↻</button>

      {fotoModal&&(
        <div onClick={()=>setFotoModal(null)} style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.92)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:200,padding:20}}>
          <img src={fotoModal} style={{maxWidth:'100%',maxHeight:'90vh',borderRadius:12}} />
        </div>
      )}
    </div>
  );
}

function PerfilScreen({ player, players, onUpdate, onLogout, theme, setTheme }) {
  const [nickname, setNickname]   = React.useState(player.nickname||'');
  const [sexo, setSexo]           = React.useState(player.sexo||'');
  const [altura, setAltura]       = React.useState(player.altura||'');
  const [idade, setIdade]         = React.useState(player.idade||'');
  const [avatarMode, setAvatarMode] = React.useState('emoji');
  const [selectedEmoji, setSelectedEmoji] = React.useState(player.avatar||'🏃');
  const [fotoAvatar, setFotoAvatar] = React.useState(null);
  const [previewAvatar, setPreviewAvatar] = React.useState(player.avatar&&player.avatar.startsWith('http')?player.avatar:null);
  const [saving, setSaving]       = React.useState(false);
  const [savedMsg, setSavedMsg]   = React.useState('');
  const [histPeso, setHistPeso]   = React.useState([]);
  const [showChangelog, setShowChangelog] = React.useState(false);

  React.useEffect(()=>{
    (async()=>{
      const { data } = await sb.from('medidas').select('data,peso,cintura').eq('player_id',player.id).not('peso','is',null).order('data',{ascending:false}).limit(10);
      setHistPeso(data||[]);
    })();
  },[]);

  const handleAvatarFoto = (e) => {
    const f=e.target.files[0]; if(!f)return;
    setFotoAvatar(f); setPreviewAvatar(URL.createObjectURL(f));
  };

  const save = async () => {
    setSaving(true);
    let avatarVal = avatarMode==='emoji' ? selectedEmoji : (previewAvatar&&previewAvatar.startsWith('blob:') ? null : previewAvatar);

    if (avatarMode==='foto'&&fotoAvatar) {
      const ext=fotoAvatar.name.split('.').pop()||'jpg';
      const path=`avatars/${player.id}.${ext}`;
      const { error: upErr } = await sb.storage.from('provas').upload(path,fotoAvatar,{upsert:true});
      if (!upErr) {
        const { data: { publicUrl } } = sb.storage.from('provas').getPublicUrl(path);
        avatarVal = publicUrl;
      }
    }

    const updates = {
      nickname:nickname.trim()||null,
      sexo:sexo||null,
      altura:altura?parseInt(altura):null,
      idade:idade?parseInt(idade):null,
      avatar:avatarVal||selectedEmoji
    };
    await sb.from('players').update(updates).eq('id',player.id);
    onUpdate({...player,...updates});
    setSaving(false); setSavedMsg('Guardado! ✅');
    setTimeout(()=>setSavedMsg(''),2000);
  };

  const toggleTheme = () => {
    const t = theme==='dark'?'light':'dark';
    setTheme(t);
    document.documentElement.setAttribute('data-theme',t);
    localStorage.setItem('fitwar_theme',t);
  };

  return (
    <div className="screen">
      <div style={{paddingTop:24,paddingBottom:16,display:'flex',alignItems:'center',gap:14}}>
        <div className="avatar-lg">
          {previewAvatar&&avatarMode==='foto'
            ? <img src={previewAvatar} alt="avatar" />
            : <span style={{fontSize:'2.2rem'}}>{selectedEmoji}</span>
          }
        </div>
        <div>
          <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:'1.8rem',letterSpacing:1}}>{player.nickname||player.nome}</div>
          <div className="muted" style={{fontSize:'0.82rem'}}>@{player.nome}</div>
        </div>
      </div>

      <div className="card">
        <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:'1rem',letterSpacing:1,marginBottom:12,color:'var(--muted)'}}>AVATAR</div>
        <div className="toggle-row">
          <button className={'toggle-btn'+(avatarMode==='emoji'?' active':'')} onClick={()=>setAvatarMode('emoji')}>Emoji</button>
          <button className={'toggle-btn'+(avatarMode==='foto'?' active':'')} onClick={()=>setAvatarMode('foto')}>Foto</button>
        </div>
        {avatarMode==='emoji'?(
          <div className="emoji-grid">
            {AVATARES.map(e=>(
              <div key={e} className={'emoji-opt'+(selectedEmoji===e?' selected':'')} onClick={()=>setSelectedEmoji(e)}>{e}</div>
            ))}
          </div>
        ):(
          <div>
            <input id="avatar-input" type="file" accept="image/*" onChange={handleAvatarFoto} style={{display:'none'}} />
            {previewAvatar?(
              <div style={{textAlign:'center'}}>
                <img src={previewAvatar} style={{width:80,height:80,borderRadius:'50%',objectFit:'cover',border:'2px solid var(--green)'}} />
                <div style={{marginTop:8}}>
                  <button className="btn-danger-sm" onClick={()=>document.getElementById('avatar-input').click()}>Mudar foto</button>
                </div>
              </div>
            ):(
              <button className="btn btn-ghost" style={{width:'100%'}} onClick={()=>document.getElementById('avatar-input').click()}>
                📷 Escolher foto
              </button>
            )}
          </div>
        )}
      </div>

      <div className="card">
        <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:'1rem',letterSpacing:1,marginBottom:12,color:'var(--muted)'}}>DADOS PESSOAIS</div>
        <div className="field">
          <label>Nickname</label>
          <input type="text" placeholder={player.nome} value={nickname} onChange={e=>setNickname(e.target.value)} />
        </div>
        <div className="field">
          <label>Sexo</label>
          <select value={sexo} onChange={e=>setSexo(e.target.value)}>
            <option value="">—</option>
            <option value="M">Masculino</option>
            <option value="F">Feminino</option>
            <option value="O">Outro</option>
          </select>
        </div>
        <div style={{display:'flex',gap:10}}>
          <div className="field" style={{flex:1,marginBottom:0}}>
            <label>Altura (cm)</label>
            <input type="number" inputMode="numeric" placeholder="175" value={altura} onChange={e=>setAltura(e.target.value)} />
          </div>
          <div className="field" style={{flex:1,marginBottom:0}}>
            <label>Idade</label>
            <input type="number" inputMode="numeric" placeholder="35" value={idade} onChange={e=>setIdade(e.target.value)} />
          </div>
        </div>
      </div>

      {histPeso.length>0&&(
        <div className="card">
          <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:'1rem',letterSpacing:1,marginBottom:10,color:'var(--muted)'}}>HISTÓRICO DE PESO</div>
          {histPeso.slice(0,5).map((m,i)=>(
            <div key={i} style={{display:'flex',justifyContent:'space-between',padding:'8px 0',borderBottom:i<histPeso.length-1?'1px solid var(--border)':'none'}}>
              <span className="muted" style={{fontSize:'0.85rem'}}>{m.data}</span>
              <span style={{fontWeight:700}}>{m.peso} kg {m.cintura?<span className="muted" style={{fontWeight:400}}>· {m.cintura} cm</span>:''}</span>
            </div>
          ))}
        </div>
      )}

      <div className="theme-switch">
        <div>
          <div style={{fontWeight:700,fontSize:'0.9rem'}}>Tema {theme==='dark'?'Escuro 🌙':'Claro ☀️'}</div>
          <div className="muted" style={{fontSize:'0.78rem'}}>Alterna entre escuro e claro</div>
        </div>
        <label className="switch">
          <input type="checkbox" checked={theme==='light'} onChange={toggleTheme} />
          <span className="slider"/>
        </label>
      </div>

      <div className="card" style={{cursor:'pointer'}} onClick={()=>setShowChangelog(!showChangelog)}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div>
            <div style={{fontWeight:700,fontSize:'0.9rem'}}>Versão da app</div>
            <div className="muted" style={{fontSize:'0.78rem'}}>Novidades e atualizações</div>
          </div>
          <span className="version-badge">v{APP_VERSION}</span>
        </div>
        {showChangelog&&(
          <div style={{marginTop:14}}>
            {CHANGELOG.map((c,i)=>(
              <div key={i} className="changelog-item">
                <div style={{fontWeight:700,fontSize:'0.85rem'}}>v{c.v} <span style={{color:'var(--muted)',fontWeight:400,fontSize:'0.78rem'}}>— {c.data}</span></div>
                <div style={{fontSize:'0.82rem',color:'var(--muted)',marginTop:2}}>{c.resumo}</div>
              </div>
            ))}
          </div>
        )}
      </div>

      {savedMsg&&<div style={{textAlign:'center',color:'var(--green)',fontWeight:700,margin:'8px 0'}}>{savedMsg}</div>}
      <button className="btn btn-primary" onClick={save} disabled={saving}>{saving?'A guardar...':'Guardar perfil'}</button>
      <button className="btn btn-ghost" style={{marginTop:8}} onClick={onLogout}>Terminar sessão</button>
    </div>
  );
}

// ── Root App ───────────────────────────────────────
function App() {
  const [state, setState]         = React.useState('loading');
  const [players, setPlayers]     = React.useState([]);
  const [player, setPlayer]       = React.useState(null);
  const [screen, setScreen]       = React.useState('dashboard');
  const [temHoje, setTemHoje]     = React.useState(false);
  const [alertas, setAlertas]     = React.useState([]);
  const [showAlertas, setShowAlertas] = React.useState(false);
  const [theme, setTheme]         = React.useState(()=>localStorage.getItem('fitwar_theme')||'dark');

  React.useEffect(()=>{
    document.documentElement.setAttribute('data-theme',theme);
  },[theme]);

  const checkHoje = async (pid) => {
    const { data } = await sb.from('entries').select('id').eq('player_id',pid).eq('data',hoje()).maybeSingle();
    setTemHoje(!!data);
  };

  const fetchNotificacoes = async (pid, allPlayers) => {
    const items = [];

    // Alertas (multas)
    const { data: al } = await sb.from('alertas').select('*').eq('para_player_id',pid).eq('visto',false);
    if (al&&al.length>0) items.push(...al.map(a=>({...a,tipo:'alerta'})));

    // Mensagens
    const { data: msgs } = await sb.from('mensagens').select('*').eq('para_player_id',pid).eq('visto',false);
    if (msgs&&msgs.length>0) items.push(...msgs.map(m=>({...m,tipo:'mensagem'})));

    // Peso em falta dos outros jogadores
    if (allPlayers) {
      for (const p of allPlayers) {
        if (p.id===pid) continue;
        const { data: med } = await sb.from('medidas').select('data').eq('player_id',p.id).not('peso','is',null).order('data',{ascending:false}).limit(1);
        const dias = diasSemPeso(med&&med.length>0?med[0].data:null);
        if (dias>=7) {
          items.push({id:`peso_${p.id}`,tipo:'peso',mensagem:`⚖️ ${p.nickname||p.nome} não regista o peso há ${dias===999?'muito tempo':`${dias} dias`}.`,visto:false});
        }
      }
    }

    if (items.length>0) { setAlertas(items); setShowAlertas(true); }
  };

  React.useEffect(()=>{
    (async()=>{
      const { data, error } = await sb.from('players').select('*').order('created_at');
      if (error||!data||data.length===0) { setState('setup'); return; }
      setPlayers(data);
      const saved = localStorage.getItem('fitwar_pid');
      if (saved) {
        const p = data.find(x=>x.id===saved);
        if (p) { setPlayer(p); await checkHoje(p.id); await fetchNotificacoes(p.id,data); setState('app'); return; }
      }
      setState('login');
    })();
  },[]);

  const handleLogin = async (p) => {
    setPlayer(p); localStorage.setItem('fitwar_pid',p.id);
    await checkHoje(p.id);
    const { data: allP } = await sb.from('players').select('*');
    await fetchNotificacoes(p.id,allP);
    setState('app');
  };

  const dismissAlertas = async () => {
    setShowAlertas(false);
    const pid = player?player.id:(alertas[0]?alertas[0].para_player_id:null);
    if (pid) {
      await sb.from('alertas').update({visto:true}).eq('para_player_id',pid).eq('visto',false);
      await sb.from('mensagens').update({visto:true}).eq('para_player_id',pid).eq('visto',false);
    }
    setAlertas([]);
  };

  const handleLogout = () => { localStorage.removeItem('fitwar_pid'); setPlayer(null); setAlertas([]); setState('login'); };
  const handleSetupComplete = async () => { const { data } = await sb.from('players').select('*').order('created_at'); setPlayers(data||[]); setState('login'); };
  const handleEntrySuccess = () => { setTemHoje(true); setScreen('dashboard'); };
  const handlePlayerUpdate = (updated) => { setPlayer(updated); setPlayers(prev=>prev.map(p=>p.id===updated.id?updated:p)); };

  if (state==='loading') return <LoadingScreen />;
  if (state==='setup')   return <SetupScreen onComplete={handleSetupComplete} />;
  if (state==='login')   return <LoginScreen players={players} onLogin={handleLogin} />;

  return (
    <div>
      {showAlertas&&(
        <div className="alert-overlay">
          <div className="alert-box">
            <div style={{fontSize:'1.6rem',marginBottom:6}}>👋</div>
            <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:'1.3rem',marginBottom:14,letterSpacing:1}}>NOVIDADES</div>
            {alertas.map((a,i)=>(
              <div key={i} className={a.tipo==='alerta'?'alert-item-self':a.tipo==='mensagem'?'alert-item-msg':'alert-item-peso'}>
                {a.mensagem}
              </div>
            ))}
            <button className="btn btn-primary" style={{marginTop:10}} onClick={dismissAlertas}>OK, percebi</button>
          </div>
        </div>
      )}
      {screen==='dashboard'   && <Dashboard player={player} players={players} setScreen={setScreen} />}
      {screen==='entry'       && <EntryForm player={player} onSuccess={handleEntrySuccess} />}
      {screen==='leaderboard' && <LeaderboardFull players={players} currentPlayer={player} />}
      {screen==='perfil'      && <PerfilScreen player={player} players={players} onUpdate={handlePlayerUpdate} onLogout={handleLogout} theme={theme} setTheme={setTheme} />}
      <BottomNav screen={screen} setScreen={setScreen} temHoje={temHoje} hasAlerts={alertas.length>0&&!showAlertas} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
