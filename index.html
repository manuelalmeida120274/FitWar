  if (!calorias || calorias <= 0) return false;
  const maxAceitavel = (tmb || 1650) + CFG.max_calorias_exercicio;
  return calorias <= maxAceitavel;
};

const calcCaloriasAtivas = (calorias, tmb, passos, minutos, peso, altura) => {
  // Sem calorias → estima por MET
  if (!calorias || calorias === 0) {
    return estimaCaloriasAtivas(passos||0, minutos||0, peso, altura);
  }
  // Calorias inválidas → estima por MET
  if (!isCaloriasValidas(calorias, tmb)) {
    return estimaCaloriasAtivas(passos||0, minutos||0, peso, altura);
  }
  // Calorias de treino (≤ threshold) → usa direto
  if (calorias <= CFG.threshold_calorias_totais) return calorias;
  // Total do dia → subtrai TMB
  const diff = Math.max(0, calorias - tmb);
  // Se resultado = 0 (cal ≈ TMB) → MET fallback com passos/minutos
  if (diff === 0) {
    return estimaCaloriasAtivas(passos||0, minutos||0, peso, altura);
  }
  return diff;
};

// Estima calorias ATIVAS (acima do basal) por MET
// MET caminhada = 3.5; basal = MET 1.0; activo = 3.5-1.0 = 2.5
const estimaCaloriasAtivas = (passos, minutos, peso, altura) => {
  const p = peso || 75;
  const h = altura || 170;
  let tempoHoras = 0;
  if (minutos > 0) {
    tempoHoras = minutos / 60;
  } else if (passos > 0) {
    const compPasso = h * 0.00414; // metros por passo
    const distancia = passos * compPasso;
    tempoHoras = distancia / 5000; // ~5 km/h
  }
  if (tempoHoras <= 0) return 0;
  return Math.round((CFG.met_caminhada - 1) * p * tempoHoras); // só acima do basal
};

const fitScore = (calorias_ativas, bonus_peso) => {
  return Math.max(0, Math.round((calorias_ativas||0) + (bonus_peso||0)));
};
const calcIMC = (peso, altura) => peso && altura ? Math.round((peso/(altura/100)**2)*10)/10 : null;
const imcOk = (imc) => imc !== null && imc >= IMC_MIN && imc <= IMC_MAX;
const calcBonusPeso = (pesoNovo, pesoAnterior, imc) => {
  if (!pesoAnterior) return 0;
  const diff = pesoAnterior - pesoNovo; // positivo = desceu
  if (Math.abs(diff) < (CFG.threshold_peso_g / 1000)) return 0;
  const bonus = Math.round(diff * BONUS_POR_KG_DYN);
  if (!imcOk(imc)) return Math.min(bonus, 0);
  return bonus;
};
const diasSemPeso = (ultimoPeso) => { if(!ultimoPeso) return 999; return Math.floor((new Date()-new Date(ultimoPeso))/(1000*60*60*24)); };
const getPeriodFrom = (periodo) => {
  const d = new Date();
  if (periodo==='dias') d.setDate(d.getDate()-29);
  else if (periodo==='semanas') d.setDate(d.getDate()-83);
  else d.setFullYear(d.getFullYear()-1);
  return d.toISOString().split('T')[0];
};
const groupByPeriodo = (rawData, metrica, periodo) => {
  const grouped = {};
  rawData.forEach(d => {
    const date = new Date(d.data+'T12:00:00');
    let key;
    if (periodo==='dias') key = d.data;
    else if (periodo==='semanas') {
      const day = date.getDay();
      const diff2 = date.getDate()-day+(day===0?-6:1);
      const mon = new Date(date); mon.setDate(diff2);
      key = mon.toISOString().split('T')[0];
    } else key = d.data.substring(0,7);
    if (!grouped[key]) grouped[key]=[];
    grouped[key].push(d);
  });
  return Object.entries(grouped).sort(([a],[b])=>a.localeCompare(b)).map(([key,items])=>{
    let value = null;
    if (metrica==='pontos') value = items.reduce((s,d)=>s+fitScore(d.calorias_ativas||0,d.bonus_peso||0),0);
    else if (metrica==='calorias') value = items.reduce((s,d)=>s+(d.calorias_ativas||d.calorias||0),0);
    else if (metrica==='minutos') value = items.reduce((s,d)=>s+(d.minutos||0),0);
    else if (metrica==='peso') { const v=items.filter(d=>d.peso); if(v.length) value=Math.round(v.reduce((s,d)=>s+d.peso,0)/v.length*10)/10; }
    else if (metrica==='cintura') { const v=items.filter(d=>d.cintura); if(v.length) value=Math.round(v.reduce((s,d)=>s+d.cintura,0)/v.length); }
    else if (metrica==='pressao') { const v=items.filter(d=>d.sistolica); if(v.length) value=v[v.length-1].sistolica; }
    const date2 = new Date((key+(periodo==='meses'?'-01':'')+'T12:00:00'));
    const label = periodo==='meses'
      ? date2.toLocaleDateString('pt-PT',{month:'short'})
      : `${date2.getDate()}/${date2.getMonth()+1}`;
    return { label, value };
  }).filter(d=>d.value!==null&&d.value!==undefined);
};

// ── IMC Widget ─────────────────────────────────────
function ImcWidget({ peso, altura }) {
  const imc = calcIMC(peso, altura);
  if (!imc) return null;
  const ok = imcOk(imc);
  const pct = Math.min(100, Math.max(0, ((imc-15)/(35-15))*100));
  const okStart = ((IMC_MIN-15)/(35-15))*100;
  const okEnd = ((IMC_MAX-15)/(35-15))*100;
  return (
    <div style={{marginTop:8}}>
      <div style={{display:'flex',justifyContent:'space-between',fontSize:'0.78rem',marginBottom:4}}>
        <span className="muted">IMC: <strong style={{color:ok?'var(--green)':'var(--red)'}}>{imc}</strong></span>
        <span className="muted">{ok?'✅ Saudável':'⚠️ Fora do range'}</span>
      </div>
      <div style={{height:8,borderRadius:4,background:'var(--border)',position:'relative',overflow:'hidden'}}>
        <div style={{position:'absolute',left:`${okStart}%`,width:`${okEnd-okStart}%`,height:'100%',background:'rgba(0,255,135,0.25)',borderRadius:4}} />
        <div style={{position:'absolute',left:`${pct}%`,top:0,width:3,height:'100%',background:ok?'var(--green)':'var(--red)',borderRadius:2,transform:'translateX(-50%)'}} />
      </div>
      <div style={{display:'flex',justifyContent:'space-between',fontSize:'0.68rem',color:'var(--muted)',marginTop:3}}>
        <span>15</span><span style={{color:'var(--green)'}}>18.5–24.9</span><span>35</span>
      </div>

  );
}

// ── LineChart ──────────────────────────────────────
function LineChart({ data, color }) {
  if (!data||data.length===0) return <div className="no-data">Sem dados para este período</div>;
  const W=300, H=80, PAD=12;
  const values = data.map(d=>d.value);
  const maxV = Math.max(...values)||1;
  const barW = Math.max(4, (W-PAD*2)/values.length - 2);
  const step = Math.max(1,Math.ceil(data.length/6));
  const c = color||'var(--green)';
  return (
    <div>
      <svg viewBox={`0 0 ${W} ${H+18}`} width="100%" style={{overflow:'visible'}}>
        <line x1={PAD} y1={H-PAD} x2={W-PAD} y2={H-PAD} stroke="var(--border)" strokeWidth="1"/>
        {data.map((d,i)=>{
          const x = PAD + (i/(Math.max(data.length-1,1)))*(W-PAD*2) - barW/2;
          const bh = Math.max(2, ((d.value/maxV)*(H-PAD*2)));
          const y = H-PAD-bh;
          return (
            <g key={i}>
              <rect x={x} y={y} width={barW} height={bh} fill={c} opacity="0.85" rx="2"/>
              {(i%step===0||i===data.length-1)&&(
                <text x={x+barW/2} y={H+14} textAnchor="middle" fill="rgba(200,200,200,0.5)" fontSize="8">{d.label}</text>
              )}
            </g>
          );
        })}
      </svg>
      <div style={{textAlign:'right',fontSize:'0.75rem',color:'var(--muted)',marginTop:2}}>
        Último: <strong style={{color:c}}>{values[values.length-1]}</strong>
      </div>
    </div>
  );
}

// ── Setup ──────────────────────────────────────────
function SetupScreen({ onComplete }) {
  const [jogadores, setJogadores] = React.useState(Array(4).fill(null).map(()=>({nome:'',pin:''})));
  const [loading, setLoading] = React.useState(false);
  const [erro, setErro] = React.useState('');
  const update = (i,f,v) => { const j=[...jogadores]; j[i]={...j[i],[f]:v}; setJogadores(j); };
  const submit = async () => {
    if (jogadores.some(j=>!j.nome.trim()||!j.pin.trim())) { setErro('Preenche todos os nomes e PINs.'); return; }
    if (new Set(jogadores.map(j=>j.nome.trim().toLowerCase())).size<4) { setErro('Nomes duplicados.'); return; }
    setLoading(true);
    const { error } = await sb.from('players').insert(jogadores.map(j=>({nome:j.nome.trim(),pin:j.pin.trim(),multas:0,avatar:'🏃'})));
    if (error) { setErro(error.message); setLoading(false); return; }
    onComplete();
  };
  return (
    <div className="screen">
      <div style={{paddingTop:40,paddingBottom:28}}>
        <div className="logo">FIT<span>WAR</span></div>
        <div className="muted" style={{marginTop:8,fontSize:'0.9rem'}}>Configuração inicial — 4 jogadores e PINs.</div>
      </div>
      {jogadores.map((j,i)=>(
        <div className="card" key={i}>
          <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:'1rem',marginBottom:10,color:'var(--muted)',letterSpacing:1}}>JOGADOR {i+1}</div>
          <div className="field"><label>Nome</label><input type="text" placeholder="Ex: Manuel" value={j.nome} onChange={e=>update(i,'nome',e.target.value)} /></div>
          <div className="field" style={{marginBottom:0}}><label>PIN</label><input type="password" inputMode="numeric" placeholder="..." maxLength={6} value={j.pin} onChange={e=>update(i,'pin',e.target.value.replace(/\D/g,''))} /></div>
        </div>
      ))}
      {erro&&<div className="error">⚠️ {erro}</div>}
      <button className="btn btn-primary" onClick={submit} disabled={loading} style={{marginTop:8}}>{loading?'A criar...':'Arrancar o FitWar 🔥'}</button>
    </div>
  );
}

// ── Score Card (expandable) ────────────────────────
function ScoreCard({ player, meuScore, dias, loading }) {
  const [expanded, setExpanded] = React.useState(true);
  const [ultimoPeso, setUltimoPeso] = React.useState(null);
  const [buscado, setBuscado] = React.useState(false);
  // Busca peso no mount (card começa aberto)
  React.useEffect(()=>{
    (async()=>{
      const { data } = await sb.from('medidas').select('peso').eq('player_id',player.id).not('peso','is',null).order('data',{ascending:false}).limit(1);
      if (data&&data.length>0) setUltimoPeso(data[0].peso);
      setBuscado(true);
    })();
  },[]);

  const handleExpand = async () => {
    const next = !expanded; setExpanded(next);
    if (next&&!buscado) {
      const { data } = await sb.from('medidas').select('peso').eq('player_id',player.id).not('peso','is',null).order('data',{ascending:false}).limit(1);
      if (data&&data.length>0) setUltimoPeso(data[0].peso);
      setBuscado(true);
    }
  };
  const imc = calcIMC(ultimoPeso, player.altura);
  return (
    <div className="card" style={{borderColor:'rgba(0,255,135,0.2)',cursor:'pointer'}} onClick={handleExpand}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
        <div>
          <div className="label-xs">Teu FitScore este mês</div>
          <div className="big-score" style={{marginTop:4}}>{loading?<span className="spinner"/>:meuScore.toLocaleString()}</div>
          <div className="muted" style={{fontSize:'0.78rem',marginTop:4}}>{dias} dia{dias!==1?'s':''} com registo</div>
        </div>
        <div style={{color:'var(--muted)',fontSize:'0.9rem',marginTop:4}}>{expanded?'▲':'▼'}</div>
      </div>
      {expanded&&(
        <div>
          <div className="expand-row">
            {player.idade&&<div className="expand-stat"><div className="label-xs">Idade</div><div style={{fontWeight:700}}>{player.idade} anos</div></div>}
            {player.altura&&<div className="expand-stat"><div className="label-xs">Altura</div><div style={{fontWeight:700}}>{player.altura} cm</div></div>}
            {ultimoPeso&&<div className="expand-stat"><div className="label-xs">Peso</div><div style={{fontWeight:700}}>{ultimoPeso} kg</div></div>}
            {imc&&<div className="expand-stat"><div className="label-xs">IMC</div><div style={{fontWeight:700,color:imcOk(imc)?'var(--green)':'var(--red)'}}>{imc}</div></div>}
            {player.sexo&&<div className="expand-stat"><div className="label-xs">Sexo</div><div style={{fontWeight:700}}>{player.sexo==='M'?'Masc.':player.sexo==='F'?'Fem.':'Outro'}</div></div>}
          </div>
          {ultimoPeso&&player.altura&&<ImcWidget peso={ultimoPeso} altura={player.altura} />}
          {!player.idade&&!player.altura&&!ultimoPeso&&<div className="muted" style={{fontSize:'0.82rem',marginTop:10}}>Preenche o teu perfil para ver mais dados.</div>}
        </div>
      )}
    </div>
  );
}

  const mes = mesAtual();
  React.useEffect(()=>{
    (async()=>{
      const [{ data: entries },{ data: meds }] = await Promise.all([
        sb.from('entries').select('player_id,calorias_ativas,calorias,passos,minutos,bonus_peso').gte('data',mes.inicio).lte('data',mes.fim),
        sb.from('medidas').select('player_id,peso,data').not('peso','is',null).order('data',{ascending:false})
      ]);

      (meds||[]).forEach(m=>{ if(!medByP[m.player_id]) medByP[m.player_id]=m; });
      setMedidas(medByP);
      const r = players.map(p=>{

            </div>
            <div className="rank-score">{p.score.toLocaleString()}</div>
          </div>
          {expandedId===p.id&&(
            <div className="expand-row">
              {p.idade&&<div className="expand-stat"><div className="label-xs">Idade</div><div style={{fontWeight:700}}>{p.idade} anos</div></div>}
              {p.altura&&<div className="expand-stat"><div className="label-xs">Altura</div><div style={{fontWeight:700}}>{p.altura} cm</div></div>}
              {medidas[p.id]&&<div className="expand-stat"><div className="label-xs">Peso</div><div style={{fontWeight:700}}>{medidas[p.id].peso} kg</div></div>}

          )}

  );

// ── Meus Registos ─────────────────────────────────
function MeusRegistos({ player, edicaoAtiva }) {
  const [entries, setEntries]       = React.useState([]);
  const [loading, setLoading]       = React.useState(true);
  const [editEntry, setEditEntry]   = React.useState(null);
  const mes = mesAtual();

  const load = async () => {
    const { data } = await sb.from('entries').select('*')
      .eq('player_id', player.id).gte('data', mes.inicio).lte('data', mes.fim)
      .order('data', {ascending: false});
    setEntries(data||[]); setLoading(false);
  };

  React.useEffect(()=>{ load(); },[]);

  if (loading) return null;
  if (!entries.length) return null;

  return (
    <div style={{marginTop:16}}>
      <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:'1.3rem',letterSpacing:1,marginBottom:8}}>
        Os meus registos {edicaoAtiva&&<span style={{fontSize:'0.7rem',fontFamily:'DM Sans,sans-serif',color:'var(--green)',textTransform:'none',letterSpacing:0}}>· edição ativa</span>}
      </div>
      {entries.map((e,i)=>(
        <div key={i} className="card" style={{padding:'12px 14px',marginBottom:8}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between'}}>
            <div>
              <div style={{fontWeight:700,fontSize:'0.88rem'}}>{e.data}</div>
              <div style={{fontSize:'0.78rem',color:'var(--muted)',marginTop:2}}>
                🔥 {e.calorias_ativas||e.calorias} cal · ⏱️ {e.minutos} min
                {e.passos>0&&` · 👟 ${e.passos.toLocaleString()}`}
                {e.bonus_peso!==0&&<span style={{color:e.bonus_peso>0?'var(--green)':'var(--red)'}}> · ⚖️ {e.bonus_peso>0?'+':''}{e.bonus_peso}</span>}
              </div>
            </div>
            <div style={{display:'flex',gap:8,alignItems:'center'}}>
              {e.foto_url&&<span style={{fontSize:'0.75rem',color:'var(--green)',cursor:'pointer'}} onClick={()=>window.open(e.foto_url,'_blank')}>📸</span>}
              {edicaoAtiva&&(
                <button className="btn-sm-danger" style={{color:'var(--green)',background:'rgba(0,255,135,0.08)',border:'1px solid rgba(0,255,135,0.2)'}}
                  onClick={()=>setEditEntry(e)}>
                  ✏️
                </button>
              )}
            </div>
          </div>
        </div>
      ))}
      {editEntry&&(
        <EditEntryModal
          entry={editEntry} player={player}
          onSave={()=>{ setEditEntry(null); load(); }}
          onClose={()=>setEditEntry(null)}
        />
      )}
    </div>
  );
}

// ── Dashboard ──────────────────────────────────────
function Dashboard({ player, players, setScreen, diasEmFalta, edicaoAtiva }) {
  const [meuScore, setMeuScore] = React.useState(0);
  const [dias, setDias] = React.useState(0);
  const [temHoje, setTemHoje] = React.useState(false);
  const [ultimoPeso, setUltimoPeso] = React.useState(null);
  const [loading, setLoading] = React.useState(true);
  const mes = mesAtual();
  React.useEffect(()=>{
    (async()=>{
      const [{ data: entries },{ data: med }] = await Promise.all([
        sb.from('entries').select('calorias_ativas,calorias,passos,minutos,bonus_peso,data').eq('player_id',player.id).gte('data',mes.inicio).lte('data',mes.fim),
        sb.from('medidas').select('data,peso').eq('player_id',player.id).not('peso','is',null).order('data',{ascending:false}).limit(1)
      ]);
      if (entries) { const tmb=calcTMB(player.peso_atual,player.altura,player.idade,player.sexo,player.tmb_manual);
      setMeuScore(entries.reduce((s,e)=>s+fitScore(e.calorias_ativas||0,e.bonus_peso||0),0)); setDias(entries.length); setTemHoje(entries.some(e=>e.data===hoje())); }
      if (med&&med.length>0) setUltimoPeso(med[0].data);
      setLoading(false);
    })();
  },[]);
  const diasP = diasSemPeso(ultimoPeso);
  return (
    <div className="screen">
      <div style={{paddingTop:22,paddingBottom:14,display:'flex',alignItems:'center',gap:12}}>
        <Avatar player={player} size={46} />
        <div>
          <div className="label-xs">{mesAtual().label}</div>
          <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:'1.9rem',letterSpacing:1,marginTop:2}}>Olá, {player.nickname||player.nome} 👋</div>
        </div>
      </div>
      {diasP>=7&&<div className="info-box">⚖️ Não registas o teu peso há {diasP===999?'algum tempo':`${diasP} dias`}. Regista e ganha bónus de pontos! 💪</div>}
      {diasEmFalta&&diasEmFalta.length>0&&(
        <div className="warn-box" style={{cursor:'pointer'}} onClick={()=>setScreen('entry')}>
          📅 Tens {diasEmFalta.length} dia{diasEmFalta.length!==1?'s':''} por registar desde o teu último registo.
          <div style={{fontSize:'0.78rem',marginTop:4,opacity:0.8}}>Toca para registar →</div>
        </div>
      )}
      <ScoreCard player={player} meuScore={meuScore} dias={dias} loading={loading} />
      <div className="card">
        <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:'1rem',marginBottom:10,letterSpacing:1}}>HOJE</div>
        {temHoje?(
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <span style={{fontSize:'1.4rem'}}>✅</span>
            <div><div style={{fontWeight:700}}>Registo feito!</div><div className="muted" style={{fontSize:'0.82rem'}}>Continua assim amanhã 💪</div></div>
          </div>
        ):(
          <div>
            <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:12}}>
              <span style={{fontSize:'1.4rem'}}>⚠️</span>
              <div><div style={{fontWeight:700,color:'var(--red)'}}>Ainda não registaste hoje</div><div className="muted" style={{fontSize:'0.82rem'}}>Não fiques para trás!</div></div>
            </div>
            <button className="btn btn-primary" onClick={()=>setScreen('entry')}>Registar agora 📸</button>
          </div>
        )}
      </div>
      <div style={{marginTop:6}}>
        <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:'1.3rem',letterSpacing:1,marginBottom:8}}>Ranking do mês</div>
        <MiniLeaderboard players={players} currentPlayerId={player.id} />
      </div>
      <button className="btn btn-ghost" style={{marginTop:8}} onClick={()=>setScreen('leaderboard')}>Ver ranking completo →</button>
      {edicaoAtiva&&<MeusRegistos player={player} edicaoAtiva={edicaoAtiva} />}
    </div>
  );
}

// ── Entry Form ─────────────────────────────────────
function EntryForm({ player, onSuccess, diasEmFalta, edicaoAtiva }) {
  const [selectedDate, setSelectedDate] = React.useState(hoje());
  const [calorias, setCalorias]   = React.useState('');
  const [minutos, setMinutos]     = React.useState('');
  const [passos, setPassos]       = React.useState('');
  const [mensagem, setMensagem]   = React.useState('');
  const [peso, setPeso]           = React.useState('');
  const [cintura, setCintura]     = React.useState('');
  const [sistolica, setSistolica] = React.useState('');
  const [diastolica, setDiastolica] = React.useState('');
  const [precisaPeso, setPrecisaPeso] = React.useState(false);
  const [loading, setLoading]     = React.useState(false);
  const [erro, setErro]           = React.useState('');
  const [existingEntry, setExistingEntry] = React.useState(null); // registo existente do dia
  const [provas, setProvas]       = React.useState([]); // provas já adicionadas
  const [sucesso, setSucesso]     = React.useState(false);
  const [bonusPreview, setBonusPreview] = React.useState(null);
  const [semAltura, setSemAltura] = React.useState(false);
  const [ocrStatus, setOcrStatus] = React.useState(null);
  const [ocrMsg, setOcrMsg]       = React.useState('');
  const [modoProva, setModoProva] = React.useState('foto');
  const [foto, setFoto]           = React.useState(null);
  const [preview, setPreview]     = React.useState(null);
  const [linkProva, setLinkProva] = React.useState('');
  const [initDone, setInitDone]   = React.useState(false);

  // Load existing entry for selected date
  const loadEntry = async (date) => {
    const [{ data: entry }, { data: medSemana }, { data: provList }] = await Promise.all([
      sb.from('entries').select('*').eq('player_id', player.id).eq('data', date).maybeSingle(),
      sb.from('medidas').select('id').eq('player_id', player.id).gte('data', semanaAtual()).maybeSingle(),
      sb.from('provas').select('*').order('created_at')
    ]);
    setPrecisaPeso(!medSemana);
    if (!player.altura) setSemAltura(true);
    if (entry) {
      setExistingEntry(entry);
      setCalorias(String(entry.calorias||''));
      setMinutos(String(entry.minutos||''));
      setPassos(String(entry.passos||''));
      // Load provas for this entry
      const { data: ep } = await sb.from('provas').select('*').eq('entry_id', entry.id).order('created_at');
      setProvas(ep||[]);
    } else {
      setExistingEntry(null);
      setCalorias(''); setMinutos(''); setPassos('');
      setProvas([]);
    }
    setInitDone(true);
  };

  // Init: smart date
  React.useEffect(()=>{
    (async()=>{
      const { data: hj } = await sb.from('entries').select('id').eq('player_id',player.id).eq('data',hoje()).maybeSingle();
      let dataInicial = hoje();
      if (!hj && diasEmFalta&&diasEmFalta.length>0) {
        dataInicial = diasEmFalta[diasEmFalta.length-1];
        setSelectedDate(dataInicial);
      }
      await loadEntry(dataInicial);
    })();
  },[]);

  React.useEffect(()=>{
    if (!initDone) return;
    loadEntry(selectedDate);
  },[selectedDate]);

  // Preview bónus peso
  React.useEffect(()=>{
    if (!peso) { setBonusPreview(null); return; }
    (async()=>{
      const pesoNum = parseFloat(peso);
      if (isNaN(pesoNum)||!player.altura) return;
      const imc = calcIMC(pesoNum, player.altura);
      const { data: ant } = await sb.from('medidas').select('peso').eq('player_id',player.id).not('peso','is',null).order('data',{ascending:false}).limit(1);
      const pesoAnt = ant&&ant.length>0?ant[0].peso:null;
      if (pesoAnt) setBonusPreview(calcBonusPeso(pesoNum, pesoAnt, imc));
    })();
  },[peso]);

  const parseOcrText = (text) => {
    let cal = null, min = null;
    const calPats = [/(\d[\d ]+)\s*kcal/i, /(\d[\d ]+)\s*cal/i, /calorias\D*(\d+)/i];
    for (const pat of calPats) {
      const m = text.match(pat);
      if (m) { const v=parseInt(m[1].replace(/\s/g,'')); if(v>50&&v<5000){cal=v;break;} }
    }
    const durPat = text.match(/(\d+):(\d{2})/);
    if (durPat) min=parseInt(durPat[1]);
    else { const mp=text.match(/(\d+)\s*min/i); if(mp){const v=parseInt(mp[1]);if(v>0&&v<600)min=v;} }
    return {cal,min};
  };

  const handleFoto = async (e) => {
    const f=e.target.files[0]; if(!f)return;
    setFoto(f); setPreview(URL.createObjectURL(f));
    setOcrStatus('reading'); setOcrMsg('A ler imagem... 🔍');
    try {
      if (!window.Tesseract) { setOcrStatus('fail'); setOcrMsg('OCR não disponível. Preenche manualmente.'); return; }
      const { data: { text } } = await window.Tesseract.recognize(f,'por+eng',{logger:()=>{}});
      const {cal,min} = parseOcrText(text);
      if (cal||min) {
        // Validação: valores impossíveis → rejeita
        const calOk = !cal || isCaloriasValidas(cal, 1650); // use avg TMB for OCR check
        const minOk = !min || (min > 0 && min <= CFG.max_minutos_dia);
        if (!calOk || !minOk) {
          setOcrStatus('fail');
          setOcrMsg(`Valores lidos parecem incorretos (${cal?cal+' cal':''} ${min?min+' min':''}). Preenche manualmente.`);
        } else {
          if (cal) setCalorias(String(cal));
          if (min) setMinutos(String(min));
          setOcrStatus('ok'); setOcrMsg(`Detetado: ${cal?cal+' kcal':''}${cal&&min?' · ':''}${min?min+' min':''}. Confirma os valores.`);
        }
      } else { setOcrStatus('fail'); setOcrMsg('Não foi possível ler os dados. Preenche manualmente.'); }
    } catch { setOcrStatus('fail'); setOcrMsg('Erro no OCR. Preenche manualmente.'); }
  };

  const uploadProva = async (entryId) => {
    if (modoProva==='link'&&linkProva.trim()) {
      await sb.from('provas').insert({ entry_id:entryId, tipo:'link', url:linkProva.trim() });
      setLinkProva('');
    } else if (modoProva==='foto'&&foto) {
      const ext=foto.name.split('.').pop()||'jpg';
      const path=`${player.id}/${selectedDate}_${Date.now()}.${ext}`;
      const { error: upErr } = await sb.storage.from('provas').upload(path,foto,{upsert:false});
      if (!upErr) {
        const { data:{publicUrl} } = sb.storage.from('provas').getPublicUrl(path);
        await sb.from('provas').insert({ entry_id:entryId, tipo:'foto', url:publicUrl });
      }
      setFoto(null); setPreview(null);
    }
  };

  const submit = async () => {
    if (!calorias&&!minutos) { setErro('Preenche pelo menos calorias ou minutos.'); return; }
    if (parseInt(minutos) > CFG.max_minutos_dia) { setErro(`Minutos não podem exceder ${CFG.max_minutos_dia} por dia. Verifica o valor.`); return; }
    if (!existingEntry && ((modoProva==='foto'&&!foto)||(modoProva==='link'&&!linkProva.trim()))) {
      setErro('Junta pelo menos uma prova no primeiro registo.'); return;
    }

    setLoading(true); setErro('');

    // Calculate bonus_peso
    let bonus_peso = existingEntry?.bonus_peso||0;
    if (peso) {
      const pesoNum=parseFloat(peso);
      if (player.altura) {
        const imc=calcIMC(pesoNum,player.altura);
        const { data:ant } = await sb.from('medidas').select('peso').eq('player_id',player.id).not('peso','is',null).order('data',{ascending:false}).limit(1);
        const pesoAnt=ant&&ant.length>0?ant[0].peso:null;
        if (pesoAnt) bonus_peso=calcBonusPeso(pesoNum,pesoAnt,imc);
      }
    }

    // Upsert entry
    // Calculate TMB and calorias_ativas
    const calNum = parseInt(calorias)||0;
    let tmb_usado = 0;
    let calorias_ativas = calNum;
    if (calNum > 0) {
      // Always get peso for TMB calculation
      let pesoParaTMB = peso ? parseFloat(peso) : null;
      if (!pesoParaTMB) {
        const { data: antPeso } = await sb.from('medidas').select('peso').eq('player_id',player.id).not('peso','is',null).order('data',{ascending:false}).limit(1);
        pesoParaTMB = antPeso&&antPeso.length>0 ? antPeso[0].peso : null;
      }
      if (pesoParaTMB && player.altura && player.idade) {
        tmb_usado = calcTMB(pesoParaTMB, player.altura, player.idade, player.sexo);
        calorias_ativas = calcCaloriasAtivas(calNum, tmb_usado);
      } else {
        // No TMB data — use fallback TMB from CFG
        tmb_usado = calcTMB(null, player.altura, player.idade, player.sexo);
        calorias_ativas = calcCaloriasAtivas(calNum, tmb_usado);
      }
    }

    const entryData = {
      player_id:player.id, data:selectedDate,
      calorias:calNum,
      calorias_ativas,
      tmb_usado,
      minutos:parseInt(minutos)||0,
      passos:parseInt(passos)||0,
      bonus_peso
    };

    let entryId = existingEntry?.id;
    if (existingEntry) {
      await sb.from('entries').update(entryData).eq('id', existingEntry.id);
    } else {
      const { data:newEntry } = await sb.from('entries').insert(entryData).select().maybeSingle();
      entryId = newEntry?.id;
    }

    // Save medidas
    if (peso||cintura||sistolica) {
      await sb.from('medidas').upsert({
        player_id:player.id, data:selectedDate,
        peso:peso?parseFloat(peso):null,
        cintura:cintura?parseInt(cintura):null,
        sistolica:sistolica?parseInt(sistolica):null,
        diastolica:diastolica?parseInt(diastolica):null
      },{onConflict:'player_id,data'});
    }

    // Upload prova
    if (entryId && (foto||(modoProva==='link'&&linkProva.trim()))) {
      await uploadProva(entryId);
    }

    // Send mensagem
    if (mensagem.trim()) {
      const { data:outros } = await sb.from('players').select('id').neq('id',player.id);
      if (outros) for (const o of outros) {
        await sb.from('mensagens').insert({ de_player_id:player.id, para_player_id:o.id, mensagem:`💬 ${player.nickname||player.nome}: "${mensagem.trim()}"` });
      }
    }

    setSucesso(true);
    setTimeout(()=>onSuccess(selectedDate),1800);
  };

  if (!initDone) return <div className="screen" style={{display:'flex',alignItems:'center',justifyContent:'center'}}><div className="spinner"/></div>;

  if (sucesso) return (
    <div className="screen">
      <div className="success-screen">
        <div style={{fontSize:'4.5rem',marginBottom:14}}>🚀</div>
        <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:'2rem',marginBottom:8}}>{existingEntry?'ATUALIZADO!':'SUBMETIDO!'}</div>
        <div className="muted" style={{fontSize:'0.9rem'}}>Registo guardado!</div>
      </div>
    </div>
  );

  const c2=parseInt(calorias)||0, m2=parseInt(minutos)||0;
  const tmb_prev = calcTMB(peso?parseFloat(peso):player.peso_atual, player.altura, player.idade, player.sexo, player.tmb_manual);
  const passos2 = parseInt(passos)||0;
  const cal_ativas_prev = calcCaloriasAtivas(c2, tmb_prev, passos2, m2, peso?parseFloat(peso):player.peso_atual, player.altura);
  const scorePreview = (c2||m2||passos2) ? fitScore(cal_ativas_prev, bonusPreview||0) : null;

  return (
    <div className="screen">
      <div style={{paddingTop:22,paddingBottom:14}}>
        <div className="label-xs">Data do registo</div>
        <div style={{display:'flex',alignItems:'center',gap:10,marginTop:6,marginBottom:4}}>
          <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:'1.8rem',letterSpacing:1,flex:1}}>
            {selectedDate===hoje()?'HOJE':'RETROATIVO'}
            {existingEntry&&<span style={{fontSize:'0.8rem',fontFamily:'DM Sans,sans-serif',color:'var(--green)',marginLeft:8,letterSpacing:0}}>· a atualizar</span>}
          </div>
          <input type="date" value={selectedDate} max={hoje()}
            onChange={e=>setSelectedDate(e.target.value)}
            style={{width:'auto',padding:'8px 10px',fontSize:'0.9rem'}} />
        </div>
        {diasEmFalta&&diasEmFalta.length>0&&(
          <div style={{display:'flex',gap:6,flexWrap:'wrap',marginTop:6}}>
            <button onClick={()=>setSelectedDate(hoje())}
              style={{padding:'4px 10px',borderRadius:6,border:`1px solid ${selectedDate===hoje()?'var(--green)':'var(--border)'}`,background:selectedDate===hoje()?'rgba(0,255,135,0.1)':'transparent',color:selectedDate===hoje()?'var(--green)':'var(--muted)',fontSize:'0.78rem',cursor:'pointer',fontFamily:'DM Sans,sans-serif'}}>
              hoje
            </button>
            {diasEmFalta.map(d=>(
              <button key={d} onClick={()=>setSelectedDate(d)}
                style={{padding:'4px 10px',borderRadius:6,border:`1px solid ${selectedDate===d?'var(--green)':'var(--border)'}`,background:selectedDate===d?'rgba(0,255,135,0.1)':'transparent',color:selectedDate===d?'var(--green)':'var(--muted)',fontSize:'0.78rem',cursor:'pointer',fontFamily:'DM Sans,sans-serif'}}>
                {new Date(d+'T12:00:00').toLocaleDateString('pt-PT',{day:'numeric',month:'short'})}
              </button>
            ))}
          </div>
        )}
      </div>

      {existingEntry&&(
        <div className="info-box">
          📝 Já tens registo para este dia. Os valores abaixo mostram o que está guardado — atualiza à vontade.
        </div>
      )}

      {semAltura&&peso&&<div className="warn-box">⚠️ Preenche a tua altura no perfil para calcular o IMC e o bónus de peso.</div>}
      {parseInt(calorias)>0&&!peso&&player.altura&&player.idade&&<div className="info-box">💡 Regista o peso para calcular automaticamente se são calorias de treino ou do dia total.</div>}
      {(()=>{
        const calNum = parseInt(calorias)||0;
        if (!calNum) return null;
        const tmbEst = calcTMB(peso?parseFloat(peso):null, player.altura, player.idade, player.sexo);
        if (!isCaloriasValidas(calNum, tmbEst)) {
          const maxAc = tmbEst ? Math.round(tmbEst+CFG.max_calorias_exercicio) : (1650+CFG.max_calorias_exercicio);
          return <div className="danger-box">⚠️ Valor impossível (máx ~{maxAc} cal). As calorias serão ignoradas — verifica o valor.</div>;
        }
        return null;
      })()}

      <div className="card">
        <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:'0.95rem',letterSpacing:1,marginBottom:10,color:'var(--muted)'}}>ATIVIDADE DO DIA</div>
        <div className="field">
          <label>🔥 Calorias gastas</label>
          <input type="number" inputMode="numeric" placeholder="Total do dia" value={calorias} onChange={e=>setCalorias(e.target.value)} />
        </div>
        <div className="field">
          <label>⏱️ Minutos ativos</label>
          <input type="number" inputMode="numeric" placeholder="Total do dia" value={minutos} onChange={e=>setMinutos(e.target.value)} />
        </div>
        <div className="field" style={{marginBottom:0}}>
          <label>👟 Passos <span style={{fontWeight:400,fontSize:'0.68rem',color:'var(--muted)',textTransform:'none'}}>(opcional · não conta para score)</span></label>
          <input type="number" inputMode="numeric" placeholder="Total do dia" value={passos} onChange={e=>setPassos(e.target.value)} />
        </div>
      </div>

      <div className="card">
        <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:'0.95rem',letterSpacing:1,marginBottom:10,color:'var(--muted)'}}>⚖️ MEDIDAS <span style={{fontSize:'0.7rem',fontFamily:'DM Sans,sans-serif',textTransform:'none',letterSpacing:0}}>(opcionais)</span></div>
        <div style={{display:'flex',gap:10,marginBottom:10}}>
          <div className="field" style={{flex:1,marginBottom:0}}>
            <label>Peso (kg) <span style={{color:'var(--green)',fontWeight:400,fontSize:'0.68rem',textTransform:'none'}}>+10pts/100g perdidas</span></label>

        </div>
        {provas.length>0&&(
          <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:12}}>
            {provas.map((p,i)=>(
              <div key={i} style={{position:'relative'}}>
                {p.tipo==='foto'
                  ? <img src={p.url} onClick={()=>window.open(p.url,'_blank')} style={{width:60,height:60,objectFit:'cover',borderRadius:8,border:'1px solid var(--border)',cursor:'pointer'}} />
                  : <div onClick={()=>window.open(p.url,'_blank')} style={{width:60,height:60,borderRadius:8,border:'1px solid var(--border)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'1.5rem',cursor:'pointer'}}>🔗</div>
                }
              </div>
            ))}
          </div>
        )}
        <div className="toggle-row">
          <button className={'toggle-btn'+(modoProva==='foto'?' active':'')} onClick={()=>setModoProva('foto')}>🖼️ Screenshot</button>
          <button className={'toggle-btn'+(modoProva==='link'?' active':'')} onClick={()=>setModoProva('link')}>🔗 Link</button>
        </div>
        {modoProva==='foto'?(
          <div className="field" style={{marginBottom:0}}>
            <input id="foto-gal" type="file" accept="image/*" onChange={handleFoto} style={{display:'none'}} />
            {preview?(
              <div>
                <div className="photo-zone filled" onClick={()=>document.getElementById('foto-gal').click()}>
                  <img src={preview} alt="prova" />
                </div>
                {ocrStatus==='ok'&&<div className="info-box" style={{marginTop:8}}>✅ {ocrMsg}</div>}
                {ocrStatus==='fail'&&<div className="warn-box" style={{marginTop:8}}>⚠️ {ocrMsg}</div>}
                {ocrStatus==='reading'&&<div style={{marginTop:8,color:'var(--muted)',fontSize:'0.85rem',display:'flex',alignItems:'center',gap:8}}><div className="spinner" style={{width:14,height:14}}/>{ocrMsg}</div>}
              </div>
            ):(
              <div className="photo-zone" onClick={()=>document.getElementById('foto-gal').click()}>
                <div style={{fontSize:'2rem',marginBottom:6}}>🖼️</div>
                <div style={{fontWeight:700,fontSize:'0.9rem'}}>Adicionar screenshot</div>
                <div className="muted" style={{fontSize:'0.75rem',marginTop:3}}>Dados lidos automaticamente 🔍</div>
              </div>
            )}
          </div>
        ):(
          <div className="field" style={{marginBottom:0}}>
            <input type="url" placeholder="https://..." value={linkProva} onChange={e=>setLinkProva(e.target.value)} />
            <div className="muted" style={{fontSize:'0.78rem',marginTop:4}}>Samsung Health, Google Fit, Strava, etc.</div>
          </div>
        )}
      </div>

      <div className="card">
        <div className="field" style={{marginBottom:0}}>
          <label>💬 Mensagem aos outros <span style={{fontWeight:400,fontSize:'0.68rem',color:'var(--muted)',textTransform:'none'}}>(opcional)</span></label>
          <textarea placeholder="Ex: Hoje foi difícil mas consegui! 💪" value={mensagem} onChange={e=>setMensagem(e.target.value)} />
        </div>
      </div>

      {scorePreview!==null&&(
        <div className="score-preview">
          <div>
            <div className="label-xs">{existingEntry?'Score atualizado':'FitScore de hoje'}</div>
            <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:'1.8rem',color:'var(--green)',marginTop:2}}>{existingEntry?'':'+'}{ scorePreview}</div>
          </div>
          <div style={{fontSize:'0.75rem',color:'var(--muted)',textAlign:'right',lineHeight:1.8}}>
            {c2>0&&<div>Cal ativas: {cal_ativas_prev}{c2>=800?` (${c2}-${tmb_prev})`:''}</div>}
            {cal_ativas_prev>0&&<div style={{fontSize:'0.7rem',opacity:0.7}}>cal ativas = {cal_ativas_prev}</div>}
            {cal_ativas_prev===0&&(m2>0||passos2>0)&&<div style={{fontSize:'0.7rem',opacity:0.7}}>estimado por {passos2>0?'passos':'minutos'}</div>}
            {bonusPreview!==null&&bonusPreview!==0&&<div style={{color:bonusPreview>0?'var(--green)':'var(--red)'}}>Peso: {bonusPreview>0?'+':''}{bonusPreview}</div>}
          </div>
        </div>
      )}

      {erro&&<div className="error">⚠️ {erro}</div>}
      <button className="btn btn-primary" onClick={submit} disabled={loading}>
        {loading?'A guardar...':(existingEntry?'Atualizar registo 🔄':'Submeter 🚀')}
      </button>
    </div>
  );
}

// ── Leaderboard ────────────────────────────────────
function LeaderboardFull({ players, currentPlayer }) {
  const [ranks, setRanks]         = React.useState([]);
  const [loading, setLoading]     = React.useState(true);
  const [fotoModal, setFotoModal] = React.useState(null);
  const [showFormula, setShowFormula] = React.useState(false);
  const [mesSel, setMesSel]       = React.useState(mesAtual().inicio.substring(0,7));
  const [meses, setMeses]         = React.useState([mesAtual().inicio.substring(0,7)]);
  const [aposta, setAposta]       = React.useState(null);

  React.useEffect(()=>{
    (async()=>{
      const { data } = await sb.from('entries').select('data').order('data',{ascending:true}).limit(1);
      if (!data||!data.length) return;
      const primeiro = data[0].data.substring(0,7);
      const atual = mesAtual().inicio.substring(0,7);
      const ms = [];
      let cur = new Date(primeiro+'-01');
      const fim = new Date(atual+'-01');
      while (cur <= fim) {
        ms.push(`${cur.getFullYear()}-${String(cur.getMonth()+1).padStart(2,'0')}`);
        cur.setMonth(cur.getMonth()+1);
      }
      setMeses(ms);
    })();
  },[]);

  const load = async () => {
    setLoading(true);
    const inicio = mesSel+'-01';
    const [mesSelAno, mesSelMes] = mesSel.split('-').map(Number);
    const ultimoDiaMs = new Date(mesSelAno, mesSelMes, 0).getDate();
    const fim = `${mesSel}-${String(ultimoDiaMs).padStart(2,'0')}`;
    const [{ data: entries },{ data: medidas },{ data: ap }] = await Promise.all([
      sb.from('entries').select('player_id,calorias,calorias_ativas,minutos,passos,bonus_peso,data,foto_url').gte('data',inicio).lte('data',fim).order('data',{ascending:false}),
      sb.from('medidas').select('player_id,data,peso').not('peso','is',null).order('data',{ascending:false}),
      sb.from('apostas').select('*').eq('mes',mesSel).maybeSingle()
    ]);
    setAposta(ap||null);
    const r = players.map(p=>{
      const es = entries?entries.filter(e=>e.player_id===p.id):[];
      const ms2 = medidas?medidas.filter(m=>m.player_id===p.id&&m.peso):[];
      const tmb = calcTMB(p.peso_atual,p.altura,p.idade,p.sexo,p.tmb_manual);
      return {
        ...p,
        score:    es.reduce((s,e)=>s+fitScore(e.calorias_ativas||0,e.bonus_peso||0),0),
        calorias: es.reduce((s,e)=>s+(e.calorias||0),0),
        calorias_ativas_total: es.reduce((s,e)=>s+(e.calorias_ativas||0),0),
        minutos:  es.reduce((s,e)=>s+(e.minutos||0),0),
        bonus_total: es.reduce((s,e)=>s+(e.bonus_peso||0),0),
        dias:     es.length,
        ultima_foto:  es.length>0?es[0].foto_url:null,
        ultimo_peso:  ms2.length>0?ms2[0].peso:null,
        dias_sem_peso:diasSemPeso(ms2.length>0?ms2[0].data:null)
      };
    }).sort((a,b)=>b.score-a.score||a.nome.localeCompare(b.nome));
    setRanks(r); setLoading(false);
  };

  React.useEffect(()=>{ load(); },[mesSel]);

  if (loading) return <div className="screen" style={{display:'flex',alignItems:'center',justifyContent:'center'}}><div className="spinner"/></div>;

  const isAtual = mesSel === mesAtual().inicio.substring(0,7);
  const mesIdx = meses.indexOf(mesSel);
  const mesLabel = new Date(mesSel+'-15').toLocaleDateString('pt-PT',{month:'long',year:'numeric'});
  const loser = ranks.length>1?ranks[ranks.length-1]:null;
  const winner = ranks.length>0?ranks[0]:null;

  return (
    <div className="screen">
      <div style={{paddingTop:22,paddingBottom:12}}>
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:8}}>
          <button onClick={()=>setMesSel(meses[mesIdx-1])} disabled={mesIdx===0}
            style={{background:'none',border:'1px solid var(--border)',borderRadius:6,color:'var(--text)',width:32,height:32,cursor:'pointer',fontSize:'1rem',opacity:mesIdx===0?0.3:1,flexShrink:0}}>←</button>
          <div style={{flex:1,textAlign:'center'}}>
            <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:'1.1rem',letterSpacing:1}}>{mesLabel.toUpperCase()}</div>
            <div style={{fontSize:'0.72rem',color:isAtual?'var(--green)':'var(--muted)',marginTop:1}}>
              {isAtual?'🔄 Em curso':'✅ Mês encerrado'}
            </div>
          </div>
          <button onClick={()=>setMesSel(meses[mesIdx+1])} disabled={mesIdx===meses.length-1}
            style={{background:'none',border:'1px solid var(--border)',borderRadius:6,color:'var(--text)',width:32,height:32,cursor:'pointer',fontSize:'1rem',opacity:mesIdx===meses.length-1?0.3:1,flexShrink:0}}>→</button>
        </div>
        <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:'2.1rem',letterSpacing:1}}>RANKING 🏆</div>
      </div>

      {/* Mês atual — mostra quem está em último */}
      {isAtual&&loser&&(
        <div className="card" style={{borderColor:'rgba(255,56,100,0.3)',background:'rgba(255,56,100,0.05)',marginBottom:14,textAlign:'center'}}>
          <div style={{fontSize:'0.7rem',textTransform:'uppercase',letterSpacing:1,color:'var(--red)',fontWeight:700}}>🚨 Em último este mês</div>
          <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:'2rem',marginTop:4}}>{loser.nickname||loser.nome}</div>
          <div style={{color:'var(--muted)',fontSize:'0.82rem'}}>Ainda há tempo para recuperar! 💪</div>
        </div>
      )}

      {/* Mês passado — mostra ganhou/perdeu */}
      {!isAtual&&winner&&loser&&(
        <div style={{display:'flex',gap:8,marginBottom:12}}>
          <div className="card" style={{flex:1,borderColor:'rgba(255,193,7,0.3)',background:'rgba(255,193,7,0.04)',textAlign:'center',padding:'12px 8px'}}>
            <div style={{fontSize:'0.65rem',textTransform:'uppercase',letterSpacing:1,color:'var(--yellow)',fontWeight:700,marginBottom:4}}>🏆 Ganhou</div>
            <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:'1.3rem'}}>{winner.nickname||winner.nome}</div>
            <div style={{fontSize:'0.75rem',color:'var(--muted)'}}>{winner.score} pts</div>
          </div>
          <div className="card" style={{flex:1,borderColor:'rgba(255,56,100,0.3)',background:'rgba(255,56,100,0.04)',textAlign:'center',padding:'12px 8px'}}>
            <div style={{fontSize:'0.65rem',textTransform:'uppercase',letterSpacing:1,color:'var(--red)',fontWeight:700,marginBottom:4}}>🚨 Perdeu</div>
            <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:'1.3rem'}}>{loser.nickname||loser.nome}</div>
            <div style={{fontSize:'0.75rem',color:'var(--muted)'}}>{loser.score} pts</div>
          </div>
        </div>
      )}

      {/* Aposta do mês */}
      {aposta&&aposta.status==='decidida'&&(
        <div className="card" style={{borderColor:'rgba(0,255,135,0.2)',marginBottom:12,textAlign:'center',padding:'10px 14px'}}>
          <div style={{fontSize:'0.65rem',textTransform:'uppercase',letterSpacing:1,color:'var(--muted)',marginBottom:4}}>🎰 Desafio</div>
          <div style={{fontWeight:700,color:'var(--green)'}}>{aposta.opcao_vencedora}</div>
          {aposta.pago&&<div style={{fontSize:'0.72rem',color:'var(--muted)',marginTop:3}}>✅ Pago</div>}
          {!aposta.pago&&<div style={{fontSize:'0.72rem',color:'var(--yellow)',marginTop:3}}>⏳ Por pagar</div>}
        </div>
      )}
      {ranks.map((p,i)=>(
        <div key={p.id} className={'rank-row'+(i===0?' winner':'')+(i===ranks.length-1&&ranks.length>1?' loser':'')}>
          <div className="rank-inner">
            <div className="rank-num">{i===0?'🥇':i===1?'🥈':i===2?'🥉':`${i+1}º`}</div>
            <Avatar player={p} size={32} />
            <div className="rank-name" style={{marginLeft:6}}>
              {p.nickname||p.nome}
              {p.id===currentPlayer.id&&<span className="badge badge-you">(tu)</span>}
              {i===ranks.length-1&&ranks.length>1&&<span className="badge badge-red">PAGA 😅</span>}
              {p.multas>0&&<span className="badge badge-red">🚨{p.multas}</span>}
            </div>
            <div style={{textAlign:'right'}}>
              <div className="rank-score" style={{color:i===ranks.length-1&&ranks.length>1?'var(--red)':'var(--green)'}}>{p.score.toLocaleString()}</div>
              <div style={{fontSize:'0.68rem',color:'var(--muted)'}}>{p.dias} dias</div>
            </div>
          </div>
          <div className="rank-stats">
            <span className="stat-chip">🔥 {p.calorias.toLocaleString()} cal</span>
            <span className="stat-chip">⏱️ {p.minutos}m</span>
            {p.bonus_total!==0&&<span className="stat-chip" style={{color:p.bonus_total>0?'var(--green)':'var(--red)'}}>⚖️ {p.bonus_total>0?'+':''}{p.bonus_total}</span>}
            {p.ultimo_peso&&<span className="stat-chip">⚖️ {p.ultimo_peso}kg</span>}
            {p.dias_sem_peso>=7&&<span className="stat-chip" style={{color:'var(--yellow)'}}>⚠️ sem peso</span>}
            {p.ultima_foto&&<span className="stat-chip" style={{cursor:'pointer',color:'var(--green)',textDecoration:'underline'}} onClick={()=>setFotoModal(p.ultima_foto)}>📸 prova</span>}
          </div>
        </div>
      ))}
      <div className="card" style={{marginTop:12,textAlign:'center'}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:6}}>
          <div className="label-xs">Fórmula FitScore</div>
          <button onClick={()=>setShowFormula(true)} style={{background:'none',border:'none',color:'var(--green)',fontSize:'0.78rem',cursor:'pointer',fontFamily:'DM Sans,sans-serif'}}>Saiba mais →</button>
        </div>
        <div style={{fontSize:'0.84rem',color:'var(--muted)'}}>
          Calorias ativas ± Bónus peso · Sem calorias: estimado por passos/tempo
        </div>
        <div style={{fontSize:'0.78rem',color:'var(--muted)',marginTop:4}}>
          Bónus peso: ±10 pts por cada 0.1 kg · só com IMC saudável (18.5–24.9)
        </div>
      </div>
      <button className="btn btn-ghost" style={{marginTop:8}} onClick={load}>Atualizar ↻</button>

      {showFormula&&(
        <div className="alert-overlay" onClick={()=>setShowFormula(false)}>
          <div className="alert-box" style={{borderColor:'rgba(0,255,135,0.3)',maxHeight:'85vh',overflowY:'auto'}} onClick={e=>e.stopPropagation()}>
            <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:'1.4rem',letterSpacing:1,marginBottom:16}}>COMO SE CALCULA O FITSCORE</div>

            <div style={{fontSize:'0.85rem',lineHeight:1.8}}>
              <div style={{fontWeight:700,color:'var(--green)',marginBottom:4}}>Fórmula base</div>
              <div style={{background:'rgba(0,255,135,0.05)',border:'1px solid rgba(0,255,135,0.15)',borderRadius:8,padding:'10px 14px',fontFamily:'monospace',marginBottom:14}}>
                FitScore = Calorias ativas + Bónus peso
              </div>

              <div style={{fontWeight:700,color:'var(--text)',marginBottom:4}}>📊 Calorias ativas</div>
              <div className="muted" style={{marginBottom:12,lineHeight:1.7}}>
                A app deteta automaticamente se registaste calorias de treino ou o total do dia:<br/><br/>
                · <strong style={{color:'var(--text)'}}>Cal ≤ {CFG.threshold_calorias_totais}</strong> → calorias de treino → usa direto<br/>
                · <strong style={{color:'var(--text)'}}>Cal &gt; {CFG.threshold_calorias_totais}</strong> → total do dia → subtrai TMB (metabolismo basal)<br/>
                · <strong style={{color:'var(--text)'}}>Cal impossível (&gt; TMB + {CFG.max_calorias_exercicio})</strong> → estima por minutos/passos
              </div>

              <div style={{fontWeight:700,color:'var(--text)',marginBottom:4}}>⏱️ Sem calorias registadas?</div>
              <div className="muted" style={{marginBottom:12,lineHeight:1.7}}>
                Se não registares calorias (ou forem inválidas), a app estima as calorias ativas pela fórmula MET:<br/><br/>
                <strong style={{color:'var(--text)',fontFamily:'monospace'}}>Cal ativas = 2.5 × peso(kg) × tempo(h)</strong><br/><br/>
                O tempo é calculado pelos minutos registados, ou pelos passos se não houver minutos. Por isso vale sempre a pena registar minutos ou passos mesmo sem calorias.
              </div>

              <div style={{fontWeight:700,color:'var(--text)',marginBottom:4}}>🧬 TMB (Metabolismo Basal)</div>
              <div className="muted" style={{marginBottom:12,lineHeight:1.7}}>
                Calculado pela fórmula Mifflin-St Jeor com os dados do teu perfil (peso, altura, idade, sexo). Preenche o perfil para maior precisão. Podes também definir o valor real da tua app de fitness no perfil.
              </div>

              <div style={{fontWeight:700,color:'var(--text)',marginBottom:4}}>⚖️ Bónus de peso</div>
              <div className="muted" style={{marginBottom:12,lineHeight:1.7}}>
                · Perdes peso dentro do IMC saudável (18.5–24.9) → <strong style={{color:'var(--green)'}}>+{CFG.bonus_por_100g} pts por 100g</strong><br/>
                · Ganhas peso → <strong style={{color:'var(--red)'}}>-{CFG.bonus_por_100g} pts por 100g</strong><br/>
                · Fora do IMC saudável → sem bónus, só penalização se subir<br/>
                · Variação mínima para contar: {CFG.threshold_peso_g}g
              </div>
            </div>

            <button className="btn btn-primary" style={{marginTop:8}} onClick={()=>setShowFormula(false)}>Fechar</button>
          </div>
        </div>
      )}

      {fotoModal&&(
        <div onClick={()=>setFotoModal(null)} style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.92)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:200,padding:20}}>
          <img src={fotoModal} style={{maxWidth:'100%',maxHeight:'90vh',borderRadius:12}} />
        </div>
      )}
    </div>
  );
}

// ── Progresso ──────────────────────────────────────
function ProgressoScreen({ players, currentPlayer }) {
  const [metrica, setMetrica] = React.useState('pontos');
  const [periodo, setPeriodo] = React.useState('dias');
  const [dadosPorPlayer, setDadosPorPlayer] = React.useState({});
  const [loading, setLoading] = React.useState(true);

  const fetchDados = async (m, p) => {
    setLoading(true);
    const fromStr = getPeriodFrom(p);
    const isEntries = ['pontos','calorias','minutos'].includes(m);
    const [{ data: entries },{ data: medidas }] = await Promise.all([
      isEntries ? sb.from('entries').select('player_id,data,calorias,calorias_ativas,minutos,bonus_peso').gte('data',fromStr).order('data') : Promise.resolve({data:[]}),
      !isEntries ? sb.from('medidas').select('player_id,data,peso,cintura,sistolica,diastolica').gte('data',fromStr).order('data') : Promise.resolve({data:[]})
    ]);
    const result = {};
    players.forEach(pl=>{
      const raw = isEntries
        ? (entries||[]).filter(e=>e.player_id===pl.id)
        : (medidas||[]).filter(e=>e.player_id===pl.id);
      result[pl.id] = groupByPeriodo(raw, m, p);
    });
    setDadosPorPlayer(result); setLoading(false);
  };

  React.useEffect(()=>{ fetchDados(metrica,periodo); },[metrica,periodo]);

  const currentIdx = players.findIndex(p=>p.id===currentPlayer.id);
  const currentColor = PLAYER_COLORS[currentIdx]||PLAYER_COLORS[0];
  const outros = players.filter(p=>p.id!==currentPlayer.id);

  return (
    <div className="screen">
      <div style={{paddingTop:22,paddingBottom:10}}>
        <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:'2rem',letterSpacing:1}}>PROGRESSO 📈</div>
      </div>
      <div className="metric-scroll">

  const [sexo, setSexo]             = React.useState(player.sexo||'');
  const [altura, setAltura]         = React.useState(player.altura||'');
  const [idade, setIdade]           = React.useState(player.idade||'');
  const [tmbManual, setTmbManual]   = React.useState(player.tmb_manual||'');
  const [avatarMode, setAvatarMode] = React.useState('emoji');
  const [selectedEmoji, setSelectedEmoji] = React.useState(player.avatar||'🏃');
  const [fotoAvatar, setFotoAvatar] = React.useState(null);
  const [previewAv, setPreviewAv]   = React.useState(player.avatar&&player.avatar.startsWith('http')?player.avatar:null);

  const [savedMsg, setSavedMsg]     = React.useState('');

      const { data } = await sb.from('medidas').select('data,peso,cintura,sistolica,diastolica').eq('player_id',player.id).order('data',{ascending:false}).limit(10);
      setHistMedidas(data||[]);

  const handleAvatarFoto = (e) => { const f=e.target.files[0]; if(!f)return; setFotoAvatar(f); setPreviewAv(URL.createObjectURL(f)); };

        ):(

      {histMedidas.length>0&&(

          {histMedidas.map((m,i)=>(
            <div key={i} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 0',borderBottom:i<histMedidas.length-1?'1px solid var(--border)':'none'}}>
              <span className="muted" style={{fontSize:'0.82rem'}}>{m.data}</span>
              <div style={{textAlign:'right',fontSize:'0.85rem'}}>
                {m.peso&&<span style={{fontWeight:700}}>{m.peso} kg </span>}
                {m.cintura&&<span className="muted">{m.cintura} cm </span>}
                {m.sistolica&&<span style={{color:'var(--red)',fontWeight:700}}>{m.sistolica}/{m.diastolica||'?'}</span>}
              </div>
            </div>
          ))}
        </div>
      )}

      <div className="theme-switch">
        <div><div style={{fontWeight:700,fontSize:'0.9rem'}}>Tema {theme==='dark'?'Escuro 🌙':'Claro ☀️'}</div><div className="muted" style={{fontSize:'0.78rem'}}>Alterna entre escuro e claro</div></div>
        <label className="switch"><input type="checkbox" checked={theme==='light'} onChange={toggleTheme} /><span className="slider"/></label>
      </div>

      <div className="card" style={{cursor:'pointer'}} onClick={()=>setShowCL(!showCL)}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div><div style={{fontWeight:700,fontSize:'0.9rem'}}>Versão da app</div><div className="muted" style={{fontSize:'0.78rem'}}>Novidades e atualizações</div></div>
          <span className="version-badge">v{APP_VERSION}</span>
        </div>
        {showCL&&(
          <div style={{marginTop:14}}>
            {CHANGELOG.map((c,i)=>(
              <div key={i} className="changelog-item">
                <div style={{fontWeight:700,fontSize:'0.85rem'}}>v{c.v} <span style={{color:'var(--muted)',fontWeight:400,fontSize:'0.78rem'}}>— {c.data}</span></div>
