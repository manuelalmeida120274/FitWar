// ── Edit Entry Modal ──────────────────────────────
function EditEntryModal({ entry, player, onSave, onClose }) {
  const [calorias, setCalorias] = React.useState(String(entry.calorias||''));
  const [minutos, setMinutos]   = React.useState(String(entry.minutos||''));
  const [passos, setPassos]     = React.useState(String(entry.passos||''));
  const [saving, setSaving]     = React.useState(false);
  const [erro, setErro]         = React.useState('');

  const save = async () => {
    if (!calorias && !minutos) { setErro('Preenche pelo menos calorias ou minutos.'); return; }
    setSaving(true);
    const { error } = await sb.from('entries').update({
      calorias: parseInt(calorias)||0,
      minutos:  parseInt(minutos)||0,
      passos:   parseInt(passos)||0,
    }).eq('id', entry.id).eq('player_id', player.id);
    if (error) { setErro(error.message); setSaving(false); return; }
    onSave();
  };

  return (
    <div className="alert-overlay">
      <div className="alert-box" style={{borderColor:'rgba(0,255,135,0.3)'}}>
        <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:'1.2rem',letterSpacing:1,marginBottom:4}}>
          EDITAR REGISTO
        </div>
        <div className="muted" style={{fontSize:'0.82rem',marginBottom:16}}>{entry.data}</div>
        <div className="field">
          <label>🔥 Calorias do treino</label>
          <input type="number" inputMode="numeric" value={calorias} onChange={e=>setCalorias(e.target.value)} />
        </div>
        <div className="field">
          <label>⏱️ Minutos ativos</label>
          <input type="number" inputMode="numeric" value={minutos} onChange={e=>setMinutos(e.target.value)} />
        </div>
        <div className="field" style={{marginBottom:0}}>
          <label>👟 Passos <span style={{fontWeight:400,fontSize:'0.68rem',color:'var(--muted)',textTransform:'none'}}>(opcional)</span></label>
          <input type="number" inputMode="numeric" value={passos} onChange={e=>setPassos(e.target.value)} />
        </div>
        {erro && <div className="error" style={{marginTop:10}}>⚠️ {erro}</div>}
        <div style={{display:'flex',gap:8,marginTop:16}}>
          <button className="btn btn-primary" style={{flex:1}} onClick={save} disabled={saving}>
            {saving?'A guardar...':'Guardar ✓'}
          </button>
          <button className="btn btn-ghost" style={{flex:1}} onClick={onClose}>Cancelar</button>
        </div>
      </div>
    </div>
  );
}

// ── Apostas ───────────────────────────────────────
function ApostaScreen({ player, players }) {
  const [aposta, setAposta]           = React.useState(null);
  const [meuVoto, setMeuVoto]         = React.useState(null);
  const [votos, setVotos]             = React.useState([]);
  const [historico, setHistorico]     = React.useState([]);
  const [loading, setLoading]         = React.useState(true);
  const [novasOpcoes, setNovasOpcoes] = React.useState(['','']);
  const [saving, setSaving]           = React.useState(false);
  const [msg, setMsg]                 = React.useState('');
  const [tab, setTab]                 = React.useState('mes'); // 'mes' | 'historico'
  const [rankMesAnt, setRankMesAnt]   = React.useState(null); // {ganhador, perdedor}

  const mesKey = () => {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  };
  const mesAntKey = () => {
    const d = new Date(); d.setMonth(d.getMonth()-1);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  };
  const mesLabel = (key) => {
    const [y,m] = key.split('-');
    return new Date(parseInt(y),parseInt(m)-1,1).toLocaleDateString('pt-PT',{month:'long',year:'numeric'});
  };

  const calcRankMes = async (mesK) => {
    const inicio = mesK+'-01';
    const [mkAno, mkMes] = mesK.split('-').map(Number);
    const ultimoDiaMk = new Date(mkAno, mkMes, 0).getDate();
    const fim = `${mesK}-${String(ultimoDiaMk).padStart(2,'0')}`;
    const { data: entries } = await sb.from('entries')
      .select('player_id,calorias_ativas,bonus_peso').gte('data',inicio).lte('data',fim);
    if (!entries||entries.length===0) return null;
    const scores = players.map(p=>({
      ...p,
      score: entries.filter(e=>e.player_id===p.id).reduce((s,e)=>s+fitScore(e.calorias_ativas||0,e.bonus_peso||0),0),
    })).sort((a,b)=>b.score-a.score);
    return { ganhador: scores[0], perdedor: scores[scores.length-1] };
  };

  const load = async () => {
    setLoading(true);
    const mk = mesKey();
    const [{ data: ap },{ data: hist }] = await Promise.all([
      sb.from('apostas').select('*').eq('mes',mk).maybeSingle(),
      sb.from('apostas').select('*').order('mes',{ascending:false}).limit(12)
    ]);
    setAposta(ap||null);
    setHistorico((hist||[]).filter(h=>h.mes!==mk));

    if (ap) {
      const { data: vs } = await sb.from('votos_apostas').select('*').eq('aposta_id',ap.id);
      setVotos(vs||[]);
      const meu = (vs||[]).find(v=>v.player_id===player.id);
      setMeuVoto(meu?meu.opcao:null);
    }

    // Calcular rank do mês anterior para determinar quem pode criar apostas
    const rank = await calcRankMes(mesAntKey());
    setRankMesAnt(rank);
    setLoading(false);
  };

  React.useEffect(()=>{ load(); },[]);

  // Quem pode criar opções este mês:
  // Mês 1 (sem histórico com apostas decididas) → qualquer jogador (admin trata pelo admin panel)
  // Mês 2+ → quem ganhou o mês anterior
  const apostasDecididas = historico.filter(h=>h.status==='decidida');
  const isPrimeiro = apostasDecididas.length === 0;
  const podeDefinir = isPrimeiro
    ? false // primeiro mês é sempre pelo admin
    : rankMesAnt && rankMesAnt.ganhador && rankMesAnt.ganhador.id === player.id;

  // Quem decide empate: mês 1 = admin (não está aqui), mês 2+ = quem perdeu
  const podeDecidirEmpate = !isPrimeiro && rankMesAnt && rankMesAnt.perdedor && rankMesAnt.perdedor.id === player.id;

  const contarVotos = (opcao) => votos.filter(v=>v.opcao===opcao).length;
  const totalVotos = votos.length;
  const todosVotaram = players.every(p=>votos.some(v=>v.player_id===p.id));

  const temEmpate = () => {
    if (!aposta||!Array.isArray(aposta.opcoes)) return false;
    const counts = aposta.opcoes.map(o=>contarVotos(o));
    const max = Math.max(...counts);
    return counts.filter(c=>c===max&&c>0).length>1;
  };

  const vencedorOpcao = () => {
    if (!aposta||!Array.isArray(aposta.opcoes)) return null;
    const counts = aposta.opcoes.map(o=>({o,c:contarVotos(o)}));
    const max = Math.max(...counts.map(x=>x.c));
    const tops = counts.filter(x=>x.c===max&&x.c>0);
    return tops.length===1?tops[0].o:null;
  };

  const criarAposta = async () => {
    const opcoes = novasOpcoes.map(o=>o.trim()).filter(o=>o.length>0);
    if (opcoes.length<2) { setMsg('Precisas de pelo menos 2 opções.'); return; }
    setSaving(true);
    const mk = mesKey();
    const rank = await calcRankMes(mesAntKey());
    const { error } = await sb.from('apostas').insert({
      mes: mk,
      criado_por_player_id: player.id,
      opcoes,
      status: 'votacao',
      ganhador_player_id: rank?.ganhador?.id||null,
      perdedor_player_id: rank?.perdedor?.id||null
    });
    if (error) { setMsg('Erro: '+error.message); setSaving(false); return; }
    setSaving(false); setMsg(''); load();
  };

  const votar = async (opcao) => {
    if (meuVoto) return;
    const { error } = await sb.from('votos_apostas').insert({
      aposta_id:aposta.id, player_id:player.id, opcao
    });
    if (!error) { setMeuVoto(opcao); load(); }
  };

  const decidirEmpate = async (opcao) => {
    setSaving(true);
    await sb.from('apostas').update({
      opcao_vencedora:opcao, status:'decidida', decidido_por_player_id:player.id
    }).eq('id',aposta.id);
    setSaving(false); load();
  };

  const marcarPago = async (id) => {
    await sb.from('apostas').update({ pago:true, pago_em:new Date().toISOString() }).eq('id',id);
    load();
  };

  if (loading) return <div className="screen" style={{display:'flex',alignItems:'center',justifyContent:'center'}}><div className="spinner"/></div>;

  return (
    <div className="screen">
      <div style={{paddingTop:22,paddingBottom:14}}>
        <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:'2rem',letterSpacing:1}}>APOSTAS 🎰</div>
      </div>

      <div className="toggle-row">
        <button className={'toggle-btn'+(tab==='mes'?' active':'')} onClick={()=>setTab('mes')}>Este mês</button>
        <button className={'toggle-btn'+(tab==='historico'?' active':'')} onClick={()=>setTab('historico')}>Histórico</button>
      </div>

      {tab==='mes'&&(
        <div>
          {/* Sem aposta ainda */}
          {!aposta&&(
            <div>
              {podeDefinir?(
                <div className="card">
                  <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:'1rem',letterSpacing:1,marginBottom:8,color:'var(--green)'}}>
                    🏆 GANHASTE O MÊS PASSADO!
                  </div>
                  <div style={{fontSize:'0.85rem',color:'var(--muted)',marginBottom:14,lineHeight:1.5}}>
                    É a tua vez de definir o desafio. Define pelo menos 2 opções — o grupo vai votar.
                    {!isPrimeiro&&rankMesAnt?.perdedor&&<span> Se houver empate, <strong style={{color:'var(--text)'}}>{rankMesAnt.perdedor.nickname||rankMesAnt.perdedor.nome}</strong> decide.</span>}
                  </div>
                  {novasOpcoes.map((o,i)=>(
                    <div key={i} style={{display:'flex',gap:8,marginBottom:8}}>
                      <input type="text" placeholder={`Opção ${i+1}`} value={o}
                        onChange={e=>{const n=[...novasOpcoes];n[i]=e.target.value;setNovasOpcoes(n);}} style={{flex:1}} />
                      {novasOpcoes.length>2&&<button className="btn-sm-danger" onClick={()=>setNovasOpcoes(novasOpcoes.filter((_,j)=>j!==i))}>✕</button>}
                    </div>
                  ))}
                  <button className="btn btn-ghost" style={{marginBottom:10}} onClick={()=>setNovasOpcoes([...novasOpcoes,''])}>+ Adicionar opção</button>
                  {msg&&<div className="error">{msg}</div>}
                  <button className="btn btn-primary" onClick={criarAposta} disabled={saving}>{saving?'A criar...':'Lançar votação 🗳️'}</button>
                </div>
              ):(
                <div className="card" style={{textAlign:'center',padding:'32px 16px'}}>
                  <div style={{fontSize:'3rem',marginBottom:12}}>⏳</div>
                  <div style={{fontWeight:700,marginBottom:8}}>Votação ainda não aberta</div>
                  <div style={{color:'var(--muted)',fontSize:'0.88rem',lineHeight:1.5}}>
                    {isPrimeiro
                      ? 'O administrador ainda não definiu as opções para este mês.'
                      : rankMesAnt?.ganhador
                        ? `A aguardar que ${rankMesAnt.ganhador.nickname||rankMesAnt.ganhador.nome} defina as opções.`
                        : 'A aguardar definição das opções.'
                    }
                  </div>
                </div>
              )}
            </div>
          )}

          {/* Votação em curso */}
          {aposta&&aposta.status==='votacao'&&(
            <div>
              {rankMesAnt?.perdedor&&(
                <div className="card" style={{borderColor:'rgba(255,56,100,0.3)',background:'rgba(255,56,100,0.04)',textAlign:'center',marginBottom:12}}>
                  <div style={{fontSize:'0.7rem',textTransform:'uppercase',letterSpacing:1,color:'var(--red)',fontWeight:700}}>🚨 Vai pagar quem ficar em último</div>
                  <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:'1.6rem',marginTop:4}}>
                    Está em último: {rankMesAnt.perdedor.nickname||rankMesAnt.perdedor.nome}
                  </div>
                  <div style={{color:'var(--muted)',fontSize:'0.78rem',marginTop:2}}>Ainda falta o resto do mês!</div>
                </div>
              )}

              <div className="aposta-card">
                <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:'1rem',letterSpacing:1,marginBottom:4}}>VOTAÇÃO 🗳️</div>
                <div style={{fontSize:'0.82rem',color:'var(--muted)',marginBottom:14}}>
                  {totalVotos}/{players.length} votos
                  {meuVoto?' · Já votaste ✓':' · O teu voto ainda não foi registado'}
                </div>
                {Array.isArray(aposta.opcoes)&&aposta.opcoes.map((opcao,i)=>{
                  const count = contarVotos(opcao);
                  const pct = totalVotos>0?Math.round((count/totalVotos)*100):0;
                  const isMyVote = meuVoto===opcao;
                  return (
                    <button key={i} className={'voto-btn'+(isMyVote?' selected':'')}
                      onClick={()=>votar(opcao)} disabled={!!meuVoto}>
                      <div style={{flex:1}}>
                        <div>{opcao}</div>
                        {totalVotos>0&&(
                          <div className="voto-bar" style={{marginTop:6}}>
                            <div className="voto-bar-fill" style={{width:pct+'%'}}/>
                          </div>
                        )}
                      </div>
                      <div style={{fontSize:'0.82rem',color:'var(--muted)',marginLeft:12,flexShrink:0}}>
                        {count} voto{count!==1?'s':''}{isMyVote?' ✓':''}
                      </div>
                    </button>
                  );
                })}
              </div>

              {/* Empate — perdedor decide */}
              {todosVotaram&&temEmpate()&&(
                <div>
                  {podeDecidirEmpate?(
                    <div className="card" style={{borderColor:'rgba(255,56,100,0.3)'}}>
                      <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:'1rem',letterSpacing:1,marginBottom:8,color:'var(--red)'}}>
                        🤝 EMPATE — DECIDES TU
                      </div>
                      <div style={{fontSize:'0.84rem',color:'var(--muted)',marginBottom:12}}>
                        Perdeste o mês passado, por isso decides o empate.
                      </div>
                      {Array.isArray(aposta.opcoes)&&aposta.opcoes.map((opcao,i)=>(
                        <button key={i} className="voto-btn" onClick={()=>decidirEmpate(opcao)} disabled={saving}>
                          {opcao} <span style={{color:'var(--green)'}}>→ escolher</span>
                        </button>
                      ))}
                    </div>
                  ):(
                    <div className="warn-box">
                      🤝 Há empate! A aguardar que {!isPrimeiro&&rankMesAnt?.perdedor?(rankMesAnt.perdedor.nickname||rankMesAnt.perdedor.nome):'o administrador'} decida.
                    </div>
                  )}
                </div>
              )}

              {todosVotaram&&!temEmpate()&&vencedorOpcao()&&(
                <div className="info-box">
                  ✅ Todos votaram. Resultado: <strong>{vencedorOpcao()}</strong>. Aguarda confirmação.
                </div>
              )}
            </div>
          )}

          {/* Resultado decidido */}
          {aposta&&aposta.status==='decidida'&&(
            <div>
              <div className="aposta-card ganhou">
                <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:'1.1rem',letterSpacing:1,marginBottom:8}}>
                  🏆 DESAFIO DESTE MÊS
                </div>
                <div style={{fontSize:'1.5rem',fontWeight:700,color:'var(--green)',marginBottom:10}}>
                  {aposta.opcao_vencedora}
                </div>
                {aposta.perdedor_player_id&&(
                  <div style={{fontSize:'0.88rem'}}>
                    Quem paga: <strong>{players.find(p=>p.id===aposta.perdedor_player_id)?.nickname||players.find(p=>p.id===aposta.perdedor_player_id)?.nome||'?'}</strong>
                  </div>
                )}
                {aposta.pago?(
                  <div style={{marginTop:10,padding:'8px 12px',background:'rgba(0,255,135,0.1)',borderRadius:8,fontSize:'0.85rem',color:'var(--green)'}}>
                    ✅ Pago! {aposta.pago_em?new Date(aposta.pago_em).toLocaleDateString('pt-PT'):''}
                  </div>
                ):(
                  <div style={{marginTop:10,padding:'8px 12px',background:'rgba(255,193,7,0.08)',borderRadius:8,fontSize:'0.85rem',color:'var(--yellow)'}}>
                    ⏳ Ainda não foi pago
                  </div>
                )}
                {aposta.decidido_por_player_id&&(
                  <div style={{fontSize:'0.72rem',color:'var(--muted)',marginTop:6}}>
                    Empate decidido por {players.find(p=>p.id===aposta.decidido_por_player_id)?.nickname||players.find(p=>p.id===aposta.decidido_por_player_id)?.nome||'?'}
                  </div>
                )}
              </div>

              {/* Resultados da votação */}
              <div className="card">
                <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:'0.9rem',letterSpacing:1,marginBottom:10,color:'var(--muted)'}}>VOTOS</div>
                {Array.isArray(aposta.opcoes)&&aposta.opcoes.map((opcao,i)=>{
                  const count = contarVotos(opcao);
                  const pct = totalVotos>0?Math.round((count/totalVotos)*100):0;
                  const isWinner = opcao===aposta.opcao_vencedora;
                  return (
                    <div key={i} style={{marginBottom:10}}>
                      <div style={{display:'flex',justifyContent:'space-between',fontSize:'0.85rem',marginBottom:3}}>
                        <span style={{fontWeight:isWinner?700:400}}>{opcao}{isWinner?' 🏆':''}</span>
                        <span style={{color:'var(--muted)'}}>{count} voto{count!==1?'s':''}</span>
                      </div>
                      <div className="voto-bar">
                        <div className="voto-bar-fill" style={{width:pct+'%',background:isWinner?'var(--green)':'rgba(0,255,135,0.3)'}}/>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          <button className="btn btn-ghost" style={{marginTop:8}} onClick={load}>Atualizar ↻</button>
        </div>
      )}

      {tab==='historico'&&(
        <div>
          {historico.length===0?(
            <div className="card" style={{textAlign:'center',padding:'28px 16px'}}>
              <div style={{fontSize:'2.5rem',marginBottom:10}}>📜</div>
              <div style={{color:'var(--muted)',fontSize:'0.88rem'}}>Ainda não há histórico de apostas.</div>
            </div>
          ):(
            historico.map((h,i)=>{
              const perdedor = players.find(p=>p.id===h.perdedor_player_id);
              const ganhador = players.find(p=>p.id===h.ganhador_player_id);
              return (
                <div key={i} className="card" style={{borderColor:h.pago?'rgba(0,255,135,0.2)':'rgba(255,193,7,0.2)'}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:6}}>
                    <div style={{fontWeight:700,fontSize:'0.9rem'}}>{mesLabel(h.mes)}</div>
                    {h.pago
                      ? <span style={{fontSize:'0.7rem',background:'rgba(0,255,135,0.12)',color:'var(--green)',padding:'2px 7px',borderRadius:4,fontWeight:700}}>PAGO ✅</span>
                      : h.status==='decidida'
                        ? <span style={{fontSize:'0.7rem',background:'rgba(255,193,7,0.1)',color:'var(--yellow)',padding:'2px 7px',borderRadius:4,fontWeight:700}}>POR PAGAR</span>
                        : <span style={{fontSize:'0.7rem',background:'var(--card)',color:'var(--muted)',padding:'2px 7px',borderRadius:4}}>Em curso</span>
                    }
                  </div>
                  {h.opcao_vencedora&&<div style={{fontSize:'1rem',fontWeight:700,color:'var(--green)',marginBottom:4}}>{h.opcao_vencedora}</div>}
                  <div style={{fontSize:'0.82rem',color:'var(--muted)'}}>
                    {perdedor&&<span>Pagou: <strong style={{color:'var(--text)'}}>{perdedor.nickname||perdedor.nome}</strong></span>}
                    {ganhador&&<span style={{marginLeft:10}}>Ganhou: <strong style={{color:'var(--text)'}}>{ganhador.nickname||ganhador.nome}</strong></span>}
                  </div>
                  {h.pago&&h.pago_em&&<div style={{fontSize:'0.72rem',color:'var(--muted)',marginTop:4}}>{new Date(h.pago_em).toLocaleDateString('pt-PT')}</div>}
                </div>
              );
            })
          )}
        </div>
      )}
    </div>
  );
}

// ── Root App ───────────────────────────────────────
function App() {
  const [state, setState]         = React.useState('loading');
  const [players, setPlayers]     = React.useState([]);
  const [player, setPlayer]       = React.useState(null);
  const [screen, setScreen]       = React.useState('dashboard');
  const [temHoje, setTemHoje]     = React.useState(false);
  const [alertas, setAlertas]     = React.useState([]);
  const [showAlertas, setShowAlertas] = React.useState(false);
  const [theme, setTheme]         = React.useState(()=>localStorage.getItem('fitwar_theme')||'dark');
  const [hasNewAposta, setHasNewAposta] = React.useState(false);
  const [isAdmin, setIsAdmin]       = React.useState(false);
  const [diasEmFalta, setDiasEmFalta] = React.useState([]);
  const [edicaoAtiva, setEdicaoAtiva] = React.useState(true);

  React.useEffect(()=>{ document.documentElement.setAttribute('data-theme',theme); },[theme]);
  React.useEffect(()=>{ loadConfig(); },[]);

  const checkHoje = async (pid) => { const { data } = await sb.from('entries').select('id').eq('player_id',pid).eq('data',hoje()).maybeSingle(); setTemHoje(!!data); };

  const fetchConfig = async () => {
    const { data } = await sb.from('config').select('value').eq('key','edicao_ativa').maybeSingle();
    setEdicaoAtiva(!data || data.value !== 'false');
  };

  const checkDiasEmFalta = async (pid) => {
    const mes = mesAtual();
    const { data: entries } = await sb.from('entries').select('data')
      .eq('player_id', pid).gte('data', mes.inicio).lte('data', mes.fim)
      .order('data', {ascending: true});
    if (!entries || entries.length === 0) return;
    const registados = new Set(entries.map(e => e.data));
    const ultimo = entries[entries.length-1].data;
    const falta = [];
    const cur = new Date(ultimo + 'T12:00:00');
    const hj = new Date(hoje() + 'T12:00:00');
    cur.setDate(cur.getDate() + 1);
    while (cur < hj) {
      const d = cur.toISOString().split('T')[0];
      if (!registados.has(d)) falta.push(d);
      cur.setDate(cur.getDate() + 1);
    }
    setDiasEmFalta(falta);
  };

  const checkAposta = async (pid) => {
    const mesKey = mesAtual().inicio.substring(0,7);
    const { data: ap } = await sb.from('apostas').select('id,status').eq('mes',mesKey).maybeSingle();
    if (!ap) return;
    if (ap.status === 'votacao') {
      const { data: meuVoto } = await sb.from('votos_apostas').select('id').eq('aposta_id',ap.id).eq('player_id',pid).maybeSingle();
      if (!meuVoto) setHasNewAposta(true);
    }
  };

  const fetchNotificacoes = async (pid, allPlayers) => {
    const items = [];
    const [{ data: al },{ data: msgs }] = await Promise.all([
      sb.from('alertas').select('*').eq('para_player_id',pid).eq('visto',false),
      sb.from('mensagens').select('*').eq('para_player_id',pid).eq('visto',false)
    ]);
    if (al&&al.length>0) items.push(...al.map(a=>({...a,tipo:'alerta'})));
    if (msgs&&msgs.length>0) items.push(...msgs.map(m=>({...m,tipo:'mensagem'})));
    // Verifica apostas por pagar do mês anterior
    const mesAtualK = mesAtual().inicio.substring(0,7);
    const mesAntK = (()=>{ const d=new Date(); d.setMonth(d.getMonth()-1); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; })();

    const [{ data: apostaNaoPaga }, { data: apostaMesAtual }] = await Promise.all([
      sb.from('apostas').select('*').eq('mes',mesAntK).eq('status','decidida').maybeSingle(),
      sb.from('apostas').select('*').eq('mes',mesAtualK).maybeSingle()
    ]);

    // Aviso: prémio por pagar — calcula quem perdeu pelo ranking
    if (apostaNaoPaga && !apostaNaoPaga.pago) {
      const desafio = apostaNaoPaga.opcao_vencedora||'o desafio';
      let nomePerdedor = '?';
      // Tenta perdedor_player_id primeiro, se não, calcula pelo ranking
      if (apostaNaoPaga.perdedor_player_id) {
        const p = (allPlayers||[]).find(p=>p.id===apostaNaoPaga.perdedor_player_id);
        nomePerdedor = p?.nickname||p?.nome||'?';
      } else {
        // Calcula pelo ranking do mês da aposta
        const { data: entradasAp } = await sb.from('entries')
          .select('player_id,calorias_ativas,bonus_peso')
          .gte('data', mesAntK+'-01').lte('data', mesAntK+'-31');
        if (entradasAp&&entradasAp.length>0) {
          const scores = (allPlayers||[]).map(p=>({
            p, score: entradasAp.filter(e=>e.player_id===p.id).reduce((s,e)=>s+fitScore(e.calorias_ativas||0,e.bonus_peso||0),0)
          })).sort((a,b)=>a.score-b.score);
          if (scores[0]) nomePerdedor = scores[0].p?.nickname||scores[0].p?.nome||'?';
        }
      }
      items.push({id:'aposta_nao_paga',tipo:'alerta',mensagem:`🚨 ${nomePerdedor} ainda não pagou: "${desafio}" (mês passado)`});
    }

    // Aviso ao vencedor do mês anterior para definir aposta (independente de haver aposta não paga)
    if (!apostaMesAtual) {
      // Calcula quem ganhou o mês anterior pelo ranking
      const { data: entradasMesAnt } = await sb.from('entries')
        .select('player_id,calorias_ativas,bonus_peso')
        .gte('data', mesAntK+'-01').lte('data', mesAntK+'-31');
      if (entradasMesAnt&&entradasMesAnt.length>0) {
        const scores = (allPlayers||[]).map(p=>({
          id: p.id,
          score: entradasMesAnt.filter(e=>e.player_id===p.id).reduce((s,e)=>s+fitScore(e.calorias_ativas||0,e.bonus_peso||0),0)
        })).sort((a,b)=>b.score-a.score);
        if (scores[0]&&scores[0].id===pid) {
          items.push({id:'definir_aposta',tipo:'mensagem',mensagem:`🏆 Ganhaste o mês passado! Define o desafio de ${new Date().toLocaleDateString('pt-PT',{month:'long'})} no separador Aposta.`});
        }
      }
    }
    if (allPlayers) {
      for (const p of allPlayers) {
        if (p.id===pid) continue;
        const { data: med } = await sb.from('medidas').select('data').eq('player_id',p.id).not('peso','is',null).order('data',{ascending:false}).limit(1);
        const dias = diasSemPeso(med&&med.length>0?med[0].data:null);
        if (dias>=7) items.push({id:`peso_${p.id}`,tipo:'peso',mensagem:`⚖️ ${p.nickname||p.nome} não regista o peso há ${dias===999?'muito tempo':`${dias} dias`}.`});
      }
    }
    if (items.length>0) { setAlertas(items); setShowAlertas(true); }
  };

  React.useEffect(()=>{
    (async()=>{
      const { data, error } = await sb.from('players').select('*').order('created_at');
      if (error||!data||data.length===0) { setState('setup'); return; }
      setPlayers(data);
      const saved = localStorage.getItem('fitwar_pid');
      if (saved) {
        const p = data.find(x=>x.id===saved);
        if (p) { setPlayer(p); await checkHoje(p.id); await fetchNotificacoes(p.id,data); await checkAposta(p.id); await checkDiasEmFalta(p.id); await fetchConfig(); setState('app'); return; }
      }
      setState('login');
    })();
  },[]);

  const handleLogin = async (p) => {
    setPlayer(p); localStorage.setItem('fitwar_pid',p.id);
    // Admin = first player created (index 0) — can be changed
    // We use a separate admin flag stored in localStorage after admin panel login
    await checkHoje(p.id);
    const { data: allP } = await sb.from('players').select('*');
    await fetchNotificacoes(p.id,allP);
    await checkAposta(p.id);
    await checkDiasEmFalta(p.id);
    await fetchConfig();
    setState('app');
  };

  const dismissAlertas = async () => {
    setShowAlertas(false);
    const pid = player?player.id:(alertas[0]?alertas[0].para_player_id:null);
    if (pid) {
      await sb.from('alertas').update({visto:true}).eq('para_player_id',pid).eq('visto',false);
      await sb.from('mensagens').update({visto:true}).eq('para_player_id',pid).eq('visto',false);
    }
    setAlertas([]);
  };

  const handleLogout    = () => { localStorage.removeItem('fitwar_pid'); setPlayer(null); setAlertas([]); setState('login'); };
  const handleSetup     = async () => { const { data } = await sb.from('players').select('*').order('created_at'); setPlayers(data||[]); setState('login'); };
  const handleEntry     = (submittedDate) => { if (submittedDate===hoje()) setTemHoje(true); setScreen('dashboard'); };
  const handleUpdate    = (u) => { setPlayer(u); setPlayers(prev=>prev.map(p=>p.id===u.id?u:p)); };

  if (state==='loading') return <LoadingScreen />;
  if (state==='setup')   return <SetupScreen onComplete={handleSetup} />;
  if (state==='login')   return <LoginScreen players={players} onLogin={handleLogin} />;

  return (
    <div>
      {showAlertas&&(
        <div className="alert-overlay">
          <div className="alert-box">
            <div style={{fontSize:'1.5rem',marginBottom:6}}>👋</div>
            <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:'1.3rem',marginBottom:14,letterSpacing:1}}>NOVIDADES</div>
            {alertas.map((a,i)=>(
              <div key={i} className={a.tipo==='alerta'?'alert-item-a':a.tipo==='mensagem'?'alert-item-m':'alert-item-p'}>{a.mensagem}</div>
            ))}
            <button className="btn btn-primary" style={{marginTop:10}} onClick={dismissAlertas}>OK, percebi</button>
          </div>
        </div>
      )}
      {screen==='dashboard'   && <Dashboard player={player} players={players} setScreen={setScreen} diasEmFalta={diasEmFalta} edicaoAtiva={edicaoAtiva} />}
      {screen==='entry'       && <EntryForm player={player} onSuccess={handleEntry} diasEmFalta={diasEmFalta} />}
      {screen==='progresso'   && <ProgressoScreen players={players} currentPlayer={player} />}
      {screen==='leaderboard' && <LeaderboardFull players={players} currentPlayer={player} />}
      {screen==='perfil'      && <PerfilScreen player={player} players={players} onUpdate={handleUpdate} onLogout={handleLogout} theme={theme} setTheme={setTheme} />}
      {screen==='apostas'     && <ApostaScreen player={player} players={players} isAdmin={localStorage.getItem('fitwar_admin')==='1'} />}
      <BottomNav screen={screen} setScreen={setScreen} temHoje={temHoje} hasAlerts={alertas.length>0&&!showAlertas} hasNewAposta={hasNewAposta} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
