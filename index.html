  const [minutos, setMinutos]     = React.useState('');
  const [modoProva, setModoProva] = React.useState('foto');
  const [foto, setFoto]           = React.useState(null);
  const [preview, setPreview]     = React.useState(null);
  const [linkProva, setLinkProva] = React.useState('');
  const [mensagem, setMensagem]   = React.useState('');
  const [peso, setPeso]           = React.useState('');
  const [cintura, setCintura]     = React.useState('');
  const [sistolica, setSistolica] = React.useState('');
  const [diastolica, setDiastolica] = React.useState('');
  const [precisaPeso, setPrecisaPeso] = React.useState(false);
  const [loading, setLoading]     = React.useState(false);
  const [erro, setErro]           = React.useState('');
  const [jaFeito, setJaFeito]     = React.useState(null);
  const [sucesso, setSucesso]     = React.useState(false);
  const [bonusPreview, setBonusPreview] = React.useState(null);
  const [imcPreview, setImcPreview] = React.useState(null);
  const [semAltura, setSemAltura] = React.useState(false);
  const [ocrStatus, setOcrStatus] = React.useState(null); // null | 'reading' | 'ok' | 'fail'
  const [ocrMsg, setOcrMsg]       = React.useState('');

  React.useEffect(()=>{
    (async()=>{
      const [{ data: entry },{ data: medSemana }] = await Promise.all([
        sb.from('entries').select('id').eq('player_id',player.id).eq('data',selectedDate).maybeSingle(),
        sb.from('medidas').select('id').eq('player_id',player.id).gte('data',semanaAtual()).maybeSingle()
      ]);
      setJaFeito(!!entry); setPrecisaPeso(!medSemana);
      if (!player.altura) setSemAltura(true);
    })();
  },[selectedDate]);

  // Preview bónus quando peso muda
  React.useEffect(()=>{
    if (!peso) { setBonusPreview(null); setImcPreview(null); return; }
    (async()=>{
      const pesoNum = parseFloat(peso);
      if (isNaN(pesoNum)) return;
      if (!player.altura) { setSemAltura(true); return; }
      const imc = calcIMC(pesoNum, player.altura);
      setImcPreview(imc);
      const { data: ant } = await sb.from('medidas').select('peso').eq('player_id',player.id).not('peso','is',null).order('data',{ascending:false}).limit(1);
      const pesoAnterior = ant&&ant.length>0?ant[0].peso:null;
      if (pesoAnterior) {
        const bonus = calcBonusPeso(pesoNum, pesoAnterior, imc);
        setBonusPreview(bonus);
      }
    })();
  },[peso]);

  const parseOcrText = (text) => {
    let cal = null, min = null;
    // Calorias: "421kcal", "332 kcal", "1 468 Cal"
    const calPats = [/(\d[\d\s]+)\s*kcal/i, /(\d[\d\s]+)\s*cal/i, /calorias[^\d]*(\d+)/i];
    for (const pat of calPats) {
      const m = text.match(pat);
      if (m) { const v = parseInt(m[1].replace(/\s/g,'')); if (v>50&&v<5000) { cal=v; break; } }
    }
    // Minutos: "42:40" -> 42, "38:17" -> 38, "45 min"
    const durPat = text.match(/(\d+):(\d{2})/);
    if (durPat) { min = parseInt(durPat[1]); }
    else {
      const minPat = text.match(/(\d+)\s*min/i);
      if (minPat) { const v=parseInt(minPat[1]); if(v>0&&v<600) min=v; }
    }
    return { cal, min };
  };

  const handleFoto = async (e) => {
    const f = e.target.files[0]; if (!f) return;
    setFoto(f); setPreview(URL.createObjectURL(f));
    setOcrStatus('reading'); setOcrMsg('A ler imagem... 🔍');
    try {
      if (!window.Tesseract) {
        setOcrStatus('fail'); setOcrMsg('OCR não disponível. Preenche manualmente.');
        return;
      }
      const { data: { text } } = await window.Tesseract.recognize(f, 'por+eng', {
        logger: () => {}
      });
      const { cal, min } = parseOcrText(text);
      if (cal || min) {
        if (cal) setCalorias(String(cal));
        if (min) setMinutos(String(min));
        setOcrStatus('ok');
        setOcrMsg(`Detetado: ${cal?cal+' kcal':''}${cal&&min?' · ':''}${min?min+' min':''}. Confirma os valores abaixo.`);
      } else {
        setOcrStatus('fail');
        setOcrMsg('Não foi possível ler os dados. Preenche manualmente.');
      }
    } catch {
      setOcrStatus('fail'); setOcrMsg('Erro no OCR. Preenche manualmente.');
    }
  };

  const submit = async () => {
    if (!calorias&&!minutos) { setErro('Preenche pelo menos calorias ou minutos.'); return; }
    if (modoProva==='foto'&&!foto) { setErro('Junta uma foto de prova 📸'); return; }
    if (modoProva==='link'&&!linkProva.trim()) { setErro('Cola o link de prova 🔗'); return; }
    // peso opcional — não bloqueia submissão
    setLoading(true); setErro('');

    let foto_url = modoProva==='link'?linkProva.trim():null;
    if (modoProva==='foto'&&foto) {
      const ext=foto.name.split('.').pop()||'jpg';
      const path=`${player.id}/${selectedDate}.${ext}`;
      const { error: upErr } = await sb.storage.from('provas').upload(path,foto,{upsert:true});
      if (upErr) { setErro('Erro no upload: '+upErr.message); setLoading(false); return; }
      const { data: { publicUrl } } = sb.storage.from('provas').getPublicUrl(path);
      foto_url = publicUrl;
    }

    // Calcular bónus de peso
    let bonus_peso = 0;
    if (peso) {
      const pesoNum = parseFloat(peso);
      if (!player.altura) {
        setErro('Preenche a tua altura no perfil para calcular o IMC e o bónus de peso.'); setLoading(false); return;
      }
      const imc = calcIMC(pesoNum, player.altura);
      const { data: ant } = await sb.from('medidas').select('peso').eq('player_id',player.id).not('peso','is',null).order('data',{ascending:false}).limit(1);
      const pesoAnterior = ant&&ant.length>0?ant[0].peso:null;
      if (pesoAnterior) bonus_peso = calcBonusPeso(pesoNum, pesoAnterior, imc);
    }

    const { error: insErr } = await sb.from('entries').insert({
      player_id:player.id, data:selectedDate,
      calorias:parseInt(calorias)||0, minutos:parseInt(minutos)||0,
      passos:0, foto_url, bonus_peso
    });
    if (insErr) { setErro('Erro ao guardar: '+insErr.message); setLoading(false); return; }

    if (peso||cintura||sistolica) {
      await sb.from('medidas').upsert({
        player_id:player.id, data:selectedDate,
        peso:peso?parseFloat(peso):null,
        cintura:cintura?parseInt(cintura):null,
        sistolica:sistolica?parseInt(sistolica):null,
        diastolica:diastolica?parseInt(diastolica):null
      },{onConflict:'player_id,data'});
    }

    if (mensagem.trim()) {
      const { data: outros } = await sb.from('players').select('id').neq('id',player.id);
      if (outros) {
        for (const o of outros) {
          await sb.from('mensagens').insert({ de_player_id:player.id, para_player_id:o.id, mensagem:`💬 ${player.nickname||player.nome}: "${mensagem.trim()}"` });
        }
      }
    }

    setSucesso(true);
    setTimeout(()=>onSuccess(),1800);
  };

  if (jaFeito===null) return <div className="screen" style={{display:'flex',alignItems:'center',justifyContent:'center'}}><div className="spinner"/></div>;
  if (jaFeito||sucesso) return (
    <div className="screen">
      <div className="success-screen">
        <div style={{fontSize:'4.5rem',marginBottom:14}}>{sucesso?'🚀':'✅'}</div>
        <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:'2rem',marginBottom:8}}>{sucesso?'SUBMETIDO!':'JÁ REGISTASTE HOJE!'}</div>
        <div className="muted" style={{fontSize:'0.9rem'}}>{sucesso?'Registo guardado!':'Um registo por dia. Volta amanhã 💪'}</div>
      </div>
    </div>
  );

  const c2=parseInt(calorias)||0, m2=parseInt(minutos)||0;
  const scoreBase = (c2||m2)?Math.round(c2/8+m2*1.5):null;
  const scoreTotal = scoreBase!==null?(scoreBase+(bonusPreview||0)):null;

  return (
    <div className="screen">
      <div style={{paddingTop:22,paddingBottom:14}}>
        <div className="label-xs">Data do registo</div>
        <div style={{display:'flex',alignItems:'center',gap:10,marginTop:6,marginBottom:4}}>
          <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:'1.8rem',letterSpacing:1,flex:1}}>
            {selectedDate===hoje()?'HOJE':'RETROATIVO'}
          </div>
          <input type="date" value={selectedDate} max={hoje()}
            onChange={e=>setSelectedDate(e.target.value)}
            style={{width:'auto',padding:'8px 10px',fontSize:'0.9rem'}} />
        </div>
        {diasEmFalta&&diasEmFalta.length>0&&(
          <div style={{display:'flex',gap:6,flexWrap:'wrap',marginTop:6}}>
            {diasEmFalta.map(d=>(
              <button key={d} onClick={()=>setSelectedDate(d)}
                style={{padding:'4px 10px',borderRadius:6,border:`1px solid ${selectedDate===d?'var(--green)':'var(--border)'}`,background:selectedDate===d?'rgba(0,255,135,0.1)':'transparent',color:selectedDate===d?'var(--green)':'var(--muted)',fontSize:'0.78rem',cursor:'pointer',fontFamily:'DM Sans,sans-serif'}}>
                {new Date(d+'T12:00:00').toLocaleDateString('pt-PT',{day:'numeric',month:'short'})}
              </button>
            ))}
          </div>
        )}
      </div>
      {precisaPeso&&<div className="info-box">⚖️ Ainda não registaste o peso esta semana! Regista e ganha +10 pts por cada 100g perdidas 💪</div>}
      {semAltura&&peso&&<div className="warn-box">⚠️ Preenche a tua altura no perfil para calcular o IMC e o bónus de peso.</div>}

      {/* PROVA PRIMEIRO */}
      <div className="card">
        <div className="toggle-row">
          <button className={'toggle-btn'+(modoProva==='foto'?' active':'')} onClick={()=>setModoProva('foto')}>🖼️ Screenshot</button>
          <button className={'toggle-btn'+(modoProva==='link'?' active':'')} onClick={()=>setModoProva('link')}>🔗 Link</button>
        </div>
        {modoProva==='foto'?(
          <div className="field" style={{marginBottom:0}}>
            <label>📸 Screenshot da app de fitness</label>
            <input id="foto-gal" type="file" accept="image/*" onChange={handleFoto} style={{display:'none'}} />
            {preview?(
              <div>
                <div className="photo-zone filled" onClick={()=>document.getElementById('foto-gal').click()}>
                  <img src={preview} alt="prova" />
                </div>
                {ocrStatus==='ok'&&<div className="info-box" style={{marginTop:8}}>✅ {ocrMsg}</div>}
                {ocrStatus==='fail'&&<div className="warn-box" style={{marginTop:8}}>⚠️ {ocrMsg}</div>}
                {ocrStatus==='reading'&&<div style={{marginTop:8,color:'var(--muted)',fontSize:'0.85rem',display:'flex',alignItems:'center',gap:8}}><div className="spinner" style={{width:14,height:14}}/>{ocrMsg}</div>}
              </div>
            ):(
              <div className="photo-zone" onClick={()=>document.getElementById('foto-gal').click()}>
                <div style={{fontSize:'2.5rem',marginBottom:8}}>🖼️</div>
                <div style={{fontWeight:700,fontSize:'0.95rem'}}>Escolher screenshot</div>
                <div className="muted" style={{fontSize:'0.78rem',marginTop:4}}>
                  Samsung Health, Google Fit, Strava...<br/>
                  Os dados são lidos automaticamente 🔍
                </div>
              </div>
            )}
          </div>
        ):(
          <div className="field" style={{marginBottom:0}}>
            <label>🔗 Link de partilha</label>
            <input type="url" placeholder="https://..." value={linkProva} onChange={e=>setLinkProva(e.target.value)} />
            <div className="muted" style={{fontSize:'0.78rem',marginTop:4}}>Link de partilha do treino (Samsung Health, Strava, etc.)</div>
          </div>
        )}
      </div>

      {/* CAMPOS — pré-preenchidos pelo OCR, editáveis */}
      <div className="card">
        <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:'0.95rem',letterSpacing:1,marginBottom:10,color:'var(--muted)'}}>
          DADOS DO TREINO
          {ocrStatus==='ok'&&<span style={{fontFamily:'DM Sans,sans-serif',fontSize:'0.7rem',color:'var(--green)',marginLeft:8,textTransform:'none',letterSpacing:0}}>pré-preenchido ✓</span>}
        </div>
        <div className="field">
          <label>🔥 Calorias gastas</label>
          <input type="number" inputMode="numeric" placeholder="Ex: 450" value={calorias} onChange={e=>setCalorias(e.target.value)} />
        </div>
        <div className="field" style={{marginBottom:0}}>
          <label>⏱️ Minutos ativos</label>
          <input type="number" inputMode="numeric" placeholder="Ex: 45" value={minutos} onChange={e=>setMinutos(e.target.value)} />
        </div>
      </div>

      <div className="card">
        <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:'0.95rem',letterSpacing:1,marginBottom:10,color:'var(--muted)'}}>⚖️ MEDIDAS <span style={{fontSize:'0.7rem',fontFamily:'DM Sans,sans-serif',textTransform:'none',letterSpacing:0}}>(opcionais)</span></div>
        <div style={{display:'flex',gap:10,marginBottom:10}}>
          <div className="field" style={{flex:1,marginBottom:0}}>
            <label>Peso (kg) <span style={{fontWeight:400,fontSize:'0.68rem',color:'var(--green)',textTransform:'none',letterSpacing:0}}>+10 pts/100g perdidas</span></label>
            <input type="number" inputMode="decimal" placeholder="78.5" value={peso} onChange={e=>setPeso(e.target.value)} />
          </div>
          <div className="field" style={{flex:1,marginBottom:0}}>
            <label>Cintura (cm)</label>
            <input type="number" inputMode="numeric" placeholder="88" value={cintura} onChange={e=>setCintura(e.target.value)} />
          </div>
        </div>
        {peso&&imcPreview&&player.altura&&<ImcWidget peso={parseFloat(peso)} altura={player.altura} />}
        {bonusPreview!==null&&(
          <div style={{marginTop:10}}>
            {bonusPreview>0&&<div className="info-box">🎉 Bónus de peso: <strong>+{bonusPreview} pts</strong> (peso desceu, IMC saudável)</div>}
            {bonusPreview<0&&<div className="danger-box">📉 Penalização de peso: <strong>{bonusPreview} pts</strong> (peso subiu)</div>}
            {bonusPreview===0&&<div className="warn-box">➡️ Sem bónus: peso igual ao anterior ou IMC fora do range.</div>}
          </div>
        )}
        <div style={{display:'flex',gap:10,marginTop:10,alignItems:'flex-end'}}>
          <div className="field" style={{flex:1,marginBottom:0}}>
            <label>Pressão sistólica</label>
            <input type="number" inputMode="numeric" placeholder="120" value={sistolica} onChange={e=>setSistolica(e.target.value)} />
          </div>
          <div style={{color:'var(--muted)',padding:'0 4px 12px',fontSize:'1.2rem'}}>/</div>
          <div className="field" style={{flex:1,marginBottom:0}}>
            <label>Diastólica</label>
            <input type="number" inputMode="numeric" placeholder="80" value={diastolica} onChange={e=>setDiastolica(e.target.value)} />
          </div>
        </div>
      </div>

      <div className="card">
        <div className="field" style={{marginBottom:0}}>
          <label>💬 Mensagem aos outros <span style={{fontWeight:400,fontSize:'0.68rem',color:'var(--muted)',textTransform:'none'}}>(opcional)</span></label>
          <textarea placeholder="Ex: Hoje arrasámos! 💪" value={mensagem} onChange={e=>setMensagem(e.target.value)} />
        </div>
      </div>

      {scoreTotal!==null&&(
        <div className="score-preview">
          <div>
            <div className="label-xs">FitScore de hoje</div>
            <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:'1.8rem',color:'var(--green)',marginTop:2}}>+{scoreTotal}</div>
          </div>
          <div style={{fontSize:'0.75rem',color:'var(--muted)',textAlign:'right',lineHeight:1.8}}>
            {c2>0&&<div>Cal: {Math.round(c2/8)}</div>}
            {m2>0&&<div>Min: {Math.round(m2*1.5)}</div>}
            {bonusPreview!==null&&bonusPreview!==0&&<div style={{color:bonusPreview>0?'var(--green)':'var(--red)'}}>Peso: {bonusPreview>0?'+':''}{bonusPreview}</div>}
          </div>
        </div>
      )}

      {erro&&<div className="error">⚠️ {erro}</div>}
      <button className="btn btn-primary" onClick={submit} disabled={loading}>{loading?'A guardar...':'Submeter 🚀'}</button>
    </div>
  );
}

// ── Leaderboard ────────────────────────────────────
function LeaderboardFull({ players, currentPlayer }) {
  const [ranks, setRanks]         = React.useState([]);
  const [loading, setLoading]     = React.useState(true);
  const [fotoModal, setFotoModal] = React.useState(null);
  const mes = mesAtual();
  const load = async () => {
    setLoading(true);
    const [{ data: entries },{ data: medidas }] = await Promise.all([
      sb.from('entries').select('player_id,calorias,minutos,bonus_peso,data,foto_url').gte('data',mes.inicio).lte('data',mes.fim).order('data',{ascending:false}),
      sb.from('medidas').select('player_id,data,peso').gte('data',mes.inicio).lte('data',mes.fim).order('data',{ascending:false})
    ]);
    const r = players.map(p=>{
      const es = entries?entries.filter(e=>e.player_id===p.id):[];
      const ms = medidas?medidas.filter(m=>m.player_id===p.id&&m.peso):[];
      return {
        ...p,
        score:    es.reduce((s,e)=>s+fitScore(e.calorias||0,e.minutos||0,e.bonus_peso||0),0),
        calorias: es.reduce((s,e)=>s+(e.calorias||0),0),
        minutos:  es.reduce((s,e)=>s+(e.minutos||0),0),
        bonus_total: es.reduce((s,e)=>s+(e.bonus_peso||0),0),
        dias:     es.length,
        ultima_foto:  es.length>0?es[0].foto_url:null,
        ultimo_peso:  ms.length>0?ms[0].peso:null,
        dias_sem_peso:diasSemPeso(ms.length>0?ms[0].data:null)
      };
    }).sort((a,b)=>b.score-a.score);
    setRanks(r); setLoading(false);
  };
  React.useEffect(()=>{ load(); },[]);
  if (loading) return <div className="screen" style={{display:'flex',alignItems:'center',justifyContent:'center'}}><div className="spinner"/></div>;
  const loser = ranks.length>1?ranks[ranks.length-1]:null;
  return (
    <div className="screen">
      <div style={{paddingTop:22,paddingBottom:12}}>
        <div className="label-xs">{mes.label}</div>
        <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:'2.1rem',letterSpacing:1,marginTop:4}}>RANKING 🏆</div>
      </div>
      {loser&&(
        <div className="card" style={{borderColor:'rgba(255,56,100,0.3)',background:'rgba(255,56,100,0.05)',marginBottom:14,textAlign:'center'}}>
          <div style={{fontSize:'0.7rem',textTransform:'uppercase',letterSpacing:1,color:'var(--red)',fontWeight:700}}>🚨 Em último este mês</div>
          <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:'2rem',marginTop:4}}>{loser.nickname||loser.nome}</div>
          <div style={{color:'var(--muted)',fontSize:'0.82rem'}}>Vai a correr! 🏃</div>
        </div>
      )}
      {ranks.map((p,i)=>(
        <div key={p.id} className={'rank-row'+(i===0?' winner':'')+(i===ranks.length-1&&ranks.length>1?' loser':'')}>
          <div className="rank-inner">
            <div className="rank-num">{i===0?'🥇':i===1?'🥈':i===2?'🥉':`${i+1}º`}</div>
            <Avatar player={p} size={32} />
            <div className="rank-name" style={{marginLeft:6}}>
              {p.nickname||p.nome}
              {p.id===currentPlayer.id&&<span className="badge badge-you">(tu)</span>}
              {i===ranks.length-1&&ranks.length>1&&<span className="badge badge-red">PAGA 😅</span>}
              {p.multas>0&&<span className="badge badge-red">🚨{p.multas}</span>}
            </div>
            <div style={{textAlign:'right'}}>
              <div className="rank-score" style={{color:i===ranks.length-1&&ranks.length>1?'var(--red)':'var(--green)'}}>{p.score.toLocaleString()}</div>
              <div style={{fontSize:'0.68rem',color:'var(--muted)'}}>{p.dias} dias</div>
            </div>
          </div>
          <div className="rank-stats">
            <span className="stat-chip">🔥 {p.calorias.toLocaleString()} cal</span>
            <span className="stat-chip">⏱️ {p.minutos}m</span>
            {p.bonus_total!==0&&<span className="stat-chip" style={{color:p.bonus_total>0?'var(--green)':'var(--red)'}}>⚖️ {p.bonus_total>0?'+':''}{p.bonus_total}</span>}
            {p.ultimo_peso&&<span className="stat-chip">⚖️ {p.ultimo_peso}kg</span>}
            {p.dias_sem_peso>=7&&<span className="stat-chip" style={{color:'var(--yellow)'}}>⚠️ sem peso</span>}
            {p.ultima_foto&&<span className="stat-chip" style={{cursor:'pointer',color:'var(--green)',textDecoration:'underline'}} onClick={()=>setFotoModal(p.ultima_foto)}>📸 prova</span>}
          </div>
        </div>
      ))}
      <div className="card" style={{marginTop:12,textAlign:'center'}}>
        <div className="label-xs" style={{marginBottom:6}}>Fórmula FitScore</div>
        <div style={{fontSize:'0.84rem',color:'var(--muted)'}}>Calorias ÷ 8 + Minutos × 1.5 ± Bónus de peso</div>
        <div style={{fontSize:'0.78rem',color:'var(--muted)',marginTop:4}}>
          Bónus peso: ±10 pts por cada 0.1 kg · só com IMC saudável (18.5–24.9)
        </div>
      </div>
      <button className="btn btn-ghost" style={{marginTop:8}} onClick={load}>Atualizar ↻</button>
      {fotoModal&&(
        <div onClick={()=>setFotoModal(null)} style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.92)',display:'flex',alignItems:'center',justifyContent:'center',zIndex:200,padding:20}}>
          <img src={fotoModal} style={{maxWidth:'100%',maxHeight:'90vh',borderRadius:12}} />
        </div>
      )}
    </div>
  );
}

// ── Progresso ──────────────────────────────────────
function ProgressoScreen({ players, currentPlayer }) {
  const [metrica, setMetrica] = React.useState('pontos');
  const [periodo, setPeriodo] = React.useState('dias');
  const [dadosPorPlayer, setDadosPorPlayer] = React.useState({});
  const [loading, setLoading] = React.useState(true);

  const fetchDados = async (m, p) => {
    setLoading(true);
    const fromStr = getPeriodFrom(p);
    const isEntries = ['pontos','calorias','minutos'].includes(m);
    const [{ data: entries },{ data: medidas }] = await Promise.all([
      isEntries ? sb.from('entries').select('player_id,data,calorias,minutos,bonus_peso').gte('data',fromStr).order('data') : Promise.resolve({data:[]}),
      !isEntries ? sb.from('medidas').select('player_id,data,peso,cintura,sistolica,diastolica').gte('data',fromStr).order('data') : Promise.resolve({data:[]})
    ]);
    const result = {};
    players.forEach(pl=>{
      const raw = isEntries
        ? (entries||[]).filter(e=>e.player_id===pl.id)
        : (medidas||[]).filter(e=>e.player_id===pl.id);
      result[pl.id] = groupByPeriodo(raw, m, p);
    });
    setDadosPorPlayer(result); setLoading(false);
  };

  React.useEffect(()=>{ fetchDados(metrica,periodo); },[metrica,periodo]);

  const currentIdx = players.findIndex(p=>p.id===currentPlayer.id);
  const currentColor = PLAYER_COLORS[currentIdx]||PLAYER_COLORS[0];
  const outros = players.filter(p=>p.id!==currentPlayer.id);

  return (
    <div className="screen">
      <div style={{paddingTop:22,paddingBottom:10}}>
        <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:'2rem',letterSpacing:1}}>PROGRESSO 📈</div>
      </div>
      <div className="metric-scroll">
        {METRICAS.map(m=><button key={m.key} className={'metric-chip'+(metrica===m.key?' active':'')} onClick={()=>setMetrica(m.key)}>{m.label}</button>)}
      </div>
      <div className="toggle-row">
        {[{k:'dias',l:'Dias'},{k:'semanas',l:'Semanas'},{k:'meses',l:'Meses'}].map(p=>(
          <button key={p.k} className={'toggle-btn'+(periodo===p.k?' active':'')} onClick={()=>setPeriodo(p.k)}>{p.l}</button>
        ))}
      </div>
      {loading?(
        <div style={{display:'flex',justifyContent:'center',padding:40}}><div className="spinner"/></div>
      ):(
        <div>
          <div className="chart-card" style={{borderColor:currentColor+'44'}}>
            <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:12}}>
              <Avatar player={currentPlayer} size={32} />
              <div>
                <div style={{fontWeight:700}}>{currentPlayer.nickname||currentPlayer.nome} <span style={{color:'var(--muted)',fontWeight:400,fontSize:'0.8rem'}}>(tu)</span></div>
                <div style={{fontSize:'0.75rem',color:'var(--muted)'}}>{METRICAS.find(x=>x.key===metrica)?.label}</div>
              </div>
            </div>
            <LineChart data={dadosPorPlayer[currentPlayer.id]||[]} color={currentColor} />
          </div>
          {outros.map((p,i)=>{
            const idx = players.findIndex(x=>x.id===p.id);
            const color = PLAYER_COLORS[idx]||PLAYER_COLORS[1+i];
            return (
              <div key={p.id} className="chart-card" style={{borderColor:color+'44'}}>
                <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:10}}>
                  <Avatar player={p} size={28} />
                  <div>
                    <div style={{fontWeight:700,fontSize:'0.9rem'}}>{p.nickname||p.nome}</div>
                    <div style={{fontSize:'0.72rem',color:'var(--muted)'}}>{METRICAS.find(x=>x.key===metrica)?.label}</div>
                  </div>
                </div>
                <LineChart data={dadosPorPlayer[p.id]||[]} color={color} />
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ── Perfil ─────────────────────────────────────────
function PerfilScreen({ player, players, onUpdate, onLogout, theme, setTheme }) {
  const [nickname, setNickname]     = React.useState(player.nickname||'');
  const [sexo, setSexo]             = React.useState(player.sexo||'');
  const [altura, setAltura]         = React.useState(player.altura||'');
  const [idade, setIdade]           = React.useState(player.idade||'');
  const [avatarMode, setAvatarMode] = React.useState('emoji');
  const [selectedEmoji, setSelectedEmoji] = React.useState(player.avatar||'🏃');
  const [fotoAvatar, setFotoAvatar] = React.useState(null);
  const [previewAv, setPreviewAv]   = React.useState(player.avatar&&player.avatar.startsWith('http')?player.avatar:null);
  const [saving, setSaving]         = React.useState(false);
  const [savedMsg, setSavedMsg]     = React.useState('');
  const [histMedidas, setHistMedidas] = React.useState([]);
  const [showCL, setShowCL]         = React.useState(false);

  React.useEffect(()=>{
    (async()=>{
      const { data } = await sb.from('medidas').select('data,peso,cintura,sistolica,diastolica').eq('player_id',player.id).order('data',{ascending:false}).limit(10);
      setHistMedidas(data||[]);
    })();
  },[]);

  const handleAvatarFoto = (e) => { const f=e.target.files[0]; if(!f)return; setFotoAvatar(f); setPreviewAv(URL.createObjectURL(f)); };

  const save = async () => {
    setSaving(true);
    let avatarVal = avatarMode==='emoji'?selectedEmoji:(previewAv&&!previewAv.startsWith('blob:')?previewAv:null);
    if (avatarMode==='foto'&&fotoAvatar) {
      const ext=fotoAvatar.name.split('.').pop()||'jpg';
      const path=`avatars/${player.id}.${ext}`;
      const { error: upErr } = await sb.storage.from('provas').upload(path,fotoAvatar,{upsert:true});
      if (!upErr) { const { data: { publicUrl } } = sb.storage.from('provas').getPublicUrl(path); avatarVal=publicUrl; }
    }
    const updates = { nickname:nickname.trim()||null, sexo:sexo||null, altura:altura?parseInt(altura):null, idade:idade?parseInt(idade):null, avatar:avatarVal||selectedEmoji };
    await sb.from('players').update(updates).eq('id',player.id);
    onUpdate({...player,...updates});
    setSaving(false); setSavedMsg('Guardado! ✅');
    setTimeout(()=>setSavedMsg(''),2500);
  };

  const toggleTheme = () => {
    const t=theme==='dark'?'light':'dark';
    setTheme(t); document.documentElement.setAttribute('data-theme',t); localStorage.setItem('fitwar_theme',t);
  };

  const ultimoPeso = histMedidas.find(m=>m.peso)?.peso;
  const imc = calcIMC(ultimoPeso, parseInt(altura)||player.altura);

  return (
    <div className="screen">
      <div style={{paddingTop:22,paddingBottom:14,display:'flex',alignItems:'center',gap:14}}>
        <div style={{width:68,height:68,borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'2rem',background:'var(--card)',border:'2px solid var(--border)',overflow:'hidden',flexShrink:0}}>
          {previewAv&&avatarMode==='foto'
            ?<img src={previewAv} alt="av" style={{width:'100%',height:'100%',objectFit:'cover'}} />
            :<span>{selectedEmoji}</span>}
        </div>
        <div>
          <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:'1.7rem',letterSpacing:1}}>{player.nickname||player.nome}</div>
          <div className="muted" style={{fontSize:'0.82rem'}}>@{player.nome}</div>
          {imc&&<div style={{fontSize:'0.8rem',marginTop:2}}>IMC: <strong style={{color:imcOk(imc)?'var(--green)':'var(--red)'}}>{imc}</strong> {imcOk(imc)?'✅':'⚠️'}</div>}
        </div>
      </div>

      <div className="card">
        <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:'0.95rem',letterSpacing:1,marginBottom:10,color:'var(--muted)'}}>AVATAR</div>
        <div className="toggle-row">
          <button className={'toggle-btn'+(avatarMode==='emoji'?' active':'')} onClick={()=>setAvatarMode('emoji')}>Emoji</button>
          <button className={'toggle-btn'+(avatarMode==='foto'?' active':'')} onClick={()=>setAvatarMode('foto')}>Foto</button>
        </div>
        {avatarMode==='emoji'?(
          <div className="emoji-grid">{AVATARES.map(e=><div key={e} className={'emoji-opt'+(selectedEmoji===e?' selected':'')} onClick={()=>setSelectedEmoji(e)}>{e}</div>)}</div>
        ):(
          <div>
            <input id="av-input" type="file" accept="image/*" onChange={handleAvatarFoto} style={{display:'none'}} />
            {previewAv?(
              <div style={{textAlign:'center'}}>
                <img src={previewAv} style={{width:72,height:72,borderRadius:'50%',objectFit:'cover',border:'2px solid var(--green)'}} />
                <div style={{marginTop:8}}><button className="btn-sm-danger" onClick={()=>document.getElementById('av-input').click()}>Mudar foto</button></div>
              </div>
            ):(
              <button className="btn btn-ghost" style={{width:'100%'}} onClick={()=>document.getElementById('av-input').click()}>📷 Escolher foto</button>
            )}
          </div>
        )}
      </div>

      <div className="card">
        <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:'0.95rem',letterSpacing:1,marginBottom:10,color:'var(--muted)'}}>DADOS PESSOAIS</div>
        <div className="field"><label>Nickname</label><input type="text" placeholder={player.nome} value={nickname} onChange={e=>setNickname(e.target.value)} /></div>
        <div className="field">
          <label>Sexo</label>
          <select value={sexo} onChange={e=>setSexo(e.target.value)}>
            <option value="">—</option>
            <option value="M">Masculino</option>
            <option value="F">Feminino</option>
            <option value="O">Outro</option>
          </select>
        </div>
        <div style={{display:'flex',gap:10}}>
          <div className="field" style={{flex:1,marginBottom:0}}><label>Altura (cm) <span style={{color:'var(--green)'}}>*IMC</span></label><input type="number" inputMode="numeric" placeholder="175" value={altura} onChange={e=>setAltura(e.target.value)} /></div>
          <div className="field" style={{flex:1,marginBottom:0}}><label>Idade</label><input type="number" inputMode="numeric" placeholder="35" value={idade} onChange={e=>setIdade(e.target.value)} /></div>
        </div>
      </div>

      {histMedidas.length>0&&(
        <div className="card">
          <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:'0.95rem',letterSpacing:1,marginBottom:10,color:'var(--muted)'}}>HISTÓRICO DE MEDIDAS</div>
          {histMedidas.map((m,i)=>(
            <div key={i} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'8px 0',borderBottom:i<histMedidas.length-1?'1px solid var(--border)':'none'}}>
              <span className="muted" style={{fontSize:'0.82rem'}}>{m.data}</span>
              <div style={{textAlign:'right',fontSize:'0.85rem'}}>
                {m.peso&&<span style={{fontWeight:700}}>{m.peso} kg </span>}
                {m.cintura&&<span className="muted">{m.cintura} cm </span>}
                {m.sistolica&&<span style={{color:'var(--red)',fontWeight:700}}>{m.sistolica}/{m.diastolica||'?'}</span>}
              </div>
            </div>
          ))}
        </div>
      )}

      <div className="theme-switch">
        <div><div style={{fontWeight:700,fontSize:'0.9rem'}}>Tema {theme==='dark'?'Escuro 🌙':'Claro ☀️'}</div><div className="muted" style={{fontSize:'0.78rem'}}>Alterna entre escuro e claro</div></div>
        <label className="switch"><input type="checkbox" checked={theme==='light'} onChange={toggleTheme} /><span className="slider"/></label>
      </div>

      <div className="card" style={{cursor:'pointer'}} onClick={()=>setShowCL(!showCL)}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <div><div style={{fontWeight:700,fontSize:'0.9rem'}}>Versão da app</div><div className="muted" style={{fontSize:'0.78rem'}}>Novidades e atualizações</div></div>
          <span className="version-badge">v{APP_VERSION}</span>
        </div>
        {showCL&&(
          <div style={{marginTop:14}}>
            {CHANGELOG.map((c,i)=>(
              <div key={i} className="changelog-item">
                <div style={{fontWeight:700,fontSize:'0.85rem'}}>v{c.v} <span style={{color:'var(--muted)',fontWeight:400,fontSize:'0.78rem'}}>— {c.data}</span></div>
                <div style={{fontSize:'0.82rem',color:'var(--muted)',marginTop:2}}>{c.resumo}</div>
              </div>
            ))}
          </div>
        )}
      </div>

      {savedMsg&&<div style={{textAlign:'center',color:'var(--green)',fontWeight:700,margin:'8px 0'}}>{savedMsg}</div>}
      <button className="btn btn-primary" onClick={save} disabled={saving}>{saving?'A guardar...':'Guardar perfil'}</button>
      <button className="btn btn-ghost" style={{marginTop:8}} onClick={onLogout}>Terminar sessão</button>
    </div>
  );
}

// ── Apostas ───────────────────────────────────────
function ApostaScreen({ player, players }) {
  const [aposta, setAposta]           = React.useState(null);
  const [meuVoto, setMeuVoto]         = React.useState(null);
  const [votos, setVotos]             = React.useState([]);
  const [historico, setHistorico]     = React.useState([]);
  const [loading, setLoading]         = React.useState(true);
  const [novasOpcoes, setNovasOpcoes] = React.useState(['','']);
  const [saving, setSaving]           = React.useState(false);
  const [msg, setMsg]                 = React.useState('');
  const [tab, setTab]                 = React.useState('mes'); // 'mes' | 'historico'
  const [rankMesAnt, setRankMesAnt]   = React.useState(null); // {ganhador, perdedor}

  const mesKey = () => {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  };
  const mesAntKey = () => {
    const d = new Date(); d.setMonth(d.getMonth()-1);
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
  };
  const mesLabel = (key) => {
    const [y,m] = key.split('-');
    return new Date(parseInt(y),parseInt(m)-1,1).toLocaleDateString('pt-PT',{month:'long',year:'numeric'});
  };

  const calcRankMes = async (mesK) => {
    const inicio = mesK+'-01';
    const fim = mesK+'-31';
    const { data: entries } = await sb.from('entries')
      .select('player_id,calorias,minutos,bonus_peso').gte('data',inicio).lte('data',fim);
    if (!entries||entries.length===0) return null;
    const scores = players.map(p=>({
      ...p,
      score: entries.filter(e=>e.player_id===p.id).reduce((s,e)=>s+fitScore(e.calorias||0,e.minutos||0,e.bonus_peso||0),0)
    })).sort((a,b)=>b.score-a.score);
    return { ganhador: scores[0], perdedor: scores[scores.length-1] };
  };

  const load = async () => {
    setLoading(true);
    const mk = mesKey();
    const [{ data: ap },{ data: hist }] = await Promise.all([
      sb.from('apostas').select('*').eq('mes',mk).maybeSingle(),
      sb.from('apostas').select('*').order('mes',{ascending:false}).limit(12)
    ]);
    setAposta(ap||null);
    setHistorico((hist||[]).filter(h=>h.mes!==mk));

    if (ap) {
      const { data: vs } = await sb.from('votos_apostas').select('*').eq('aposta_id',ap.id);
      setVotos(vs||[]);
      const meu = (vs||[]).find(v=>v.player_id===player.id);
      setMeuVoto(meu?meu.opcao:null);
    }

    // Calcular rank do mês anterior para determinar quem pode criar apostas
    const rank = await calcRankMes(mesAntKey());
    setRankMesAnt(rank);
    setLoading(false);
  };

  React.useEffect(()=>{ load(); },[]);

  // Quem pode criar opções este mês:
  // Mês 1 (sem histórico com apostas decididas) → qualquer jogador (admin trata pelo admin panel)
  // Mês 2+ → quem ganhou o mês anterior
  const apostasDecididas = historico.filter(h=>h.status==='decidida');
  const isPrimeiro = apostasDecididas.length === 0;
  const podeDefinir = isPrimeiro
    ? false // primeiro mês é sempre pelo admin
    : rankMesAnt && rankMesAnt.ganhador && rankMesAnt.ganhador.id === player.id;

  // Quem decide empate: mês 1 = admin (não está aqui), mês 2+ = quem perdeu
  const podeDecidirEmpate = !isPrimeiro && rankMesAnt && rankMesAnt.perdedor && rankMesAnt.perdedor.id === player.id;

  const contarVotos = (opcao) => votos.filter(v=>v.opcao===opcao).length;
  const totalVotos = votos.length;
  const todosVotaram = players.every(p=>votos.some(v=>v.player_id===p.id));

  const temEmpate = () => {
    if (!aposta||!Array.isArray(aposta.opcoes)) return false;
    const counts = aposta.opcoes.map(o=>contarVotos(o));
    const max = Math.max(...counts);
    return counts.filter(c=>c===max&&c>0).length>1;
  };

  const vencedorOpcao = () => {
    if (!aposta||!Array.isArray(aposta.opcoes)) return null;
    const counts = aposta.opcoes.map(o=>({o,c:contarVotos(o)}));
    const max = Math.max(...counts.map(x=>x.c));
    const tops = counts.filter(x=>x.c===max&&x.c>0);
    return tops.length===1?tops[0].o:null;
  };

  const criarAposta = async () => {
    const opcoes = novasOpcoes.map(o=>o.trim()).filter(o=>o.length>0);
    if (opcoes.length<2) { setMsg('Precisas de pelo menos 2 opções.'); return; }
    setSaving(true);
    const mk = mesKey();
    const rank = await calcRankMes(mesAntKey());
    const { error } = await sb.from('apostas').insert({
      mes: mk,
      criado_por_player_id: player.id,
      opcoes,
      status: 'votacao',
      ganhador_player_id: rank?.ganhador?.id||null,
      perdedor_player_id: rank?.perdedor?.id||null
    });
    if (error) { setMsg('Erro: '+error.message); setSaving(false); return; }
    setSaving(false); setMsg(''); load();
  };

  const votar = async (opcao) => {
    if (meuVoto) return;
    const { error } = await sb.from('votos_apostas').insert({
      aposta_id:aposta.id, player_id:player.id, opcao
    });
    if (!error) { setMeuVoto(opcao); load(); }
  };

  const decidirEmpate = async (opcao) => {
    setSaving(true);
    await sb.from('apostas').update({
      opcao_vencedora:opcao, status:'decidida', decidido_por_player_id:player.id
    }).eq('id',aposta.id);
    setSaving(false); load();
  };

  const marcarPago = async (id) => {
    await sb.from('apostas').update({ pago:true, pago_em:new Date().toISOString() }).eq('id',id);
    load();
  };

  if (loading) return <div className="screen" style={{display:'flex',alignItems:'center',justifyContent:'center'}}><div className="spinner"/></div>;

  return (
    <div className="screen">
      <div style={{paddingTop:22,paddingBottom:14}}>
        <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:'2rem',letterSpacing:1}}>APOSTAS 🎰</div>
      </div>

      <div className="toggle-row">
        <button className={'toggle-btn'+(tab==='mes'?' active':'')} onClick={()=>setTab('mes')}>Este mês</button>
        <button className={'toggle-btn'+(tab==='historico'?' active':'')} onClick={()=>setTab('historico')}>Histórico</button>
      </div>

      {tab==='mes'&&(
        <div>
          {/* Sem aposta ainda */}
          {!aposta&&(
            <div>
              {podeDefinir?(
                <div className="card">
                  <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:'1rem',letterSpacing:1,marginBottom:8,color:'var(--green)'}}>
                    🏆 GANHASTE O MÊS PASSADO!
                  </div>
                  <div style={{fontSize:'0.85rem',color:'var(--muted)',marginBottom:14,lineHeight:1.5}}>
                    É a tua vez de definir o desafio. Define pelo menos 2 opções — o grupo vai votar.
                    {!isPrimeiro&&rankMesAnt?.perdedor&&<span> Se houver empate, <strong style={{color:'var(--text)'}}>{rankMesAnt.perdedor.nickname||rankMesAnt.perdedor.nome}</strong> decide.</span>}
                  </div>
                  {novasOpcoes.map((o,i)=>(
                    <div key={i} style={{display:'flex',gap:8,marginBottom:8}}>
                      <input type="text" placeholder={`Opção ${i+1}`} value={o}
                        onChange={e=>{const n=[...novasOpcoes];n[i]=e.target.value;setNovasOpcoes(n);}} style={{flex:1}} />
                      {novasOpcoes.length>2&&<button className="btn-sm-danger" onClick={()=>setNovasOpcoes(novasOpcoes.filter((_,j)=>j!==i))}>✕</button>}
                    </div>
                  ))}
                  <button className="btn btn-ghost" style={{marginBottom:10}} onClick={()=>setNovasOpcoes([...novasOpcoes,''])}>+ Adicionar opção</button>
                  {msg&&<div className="error">{msg}</div>}
                  <button className="btn btn-primary" onClick={criarAposta} disabled={saving}>{saving?'A criar...':'Lançar votação 🗳️'}</button>
                </div>
              ):(
                <div className="card" style={{textAlign:'center',padding:'32px 16px'}}>
                  <div style={{fontSize:'3rem',marginBottom:12}}>⏳</div>
                  <div style={{fontWeight:700,marginBottom:8}}>Votação ainda não aberta</div>
                  <div style={{color:'var(--muted)',fontSize:'0.88rem',lineHeight:1.5}}>
                    {isPrimeiro
                      ? 'O administrador ainda não definiu as opções para este mês.'
                      : rankMesAnt?.ganhador
                        ? `A aguardar que ${rankMesAnt.ganhador.nickname||rankMesAnt.ganhador.nome} defina as opções.`
                        : 'A aguardar definição das opções.'
                    }
                  </div>
                </div>
              )}
            </div>
          )}

          {/* Votação em curso */}
          {aposta&&aposta.status==='votacao'&&(
            <div>
              {rankMesAnt?.perdedor&&(
                <div className="card" style={{borderColor:'rgba(255,56,100,0.3)',background:'rgba(255,56,100,0.04)',textAlign:'center',marginBottom:12}}>
                  <div style={{fontSize:'0.7rem',textTransform:'uppercase',letterSpacing:1,color:'var(--red)',fontWeight:700}}>🚨 Vai pagar quem ficar em último</div>
                  <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:'1.6rem',marginTop:4}}>
                    Está em último: {rankMesAnt.perdedor.nickname||rankMesAnt.perdedor.nome}
                  </div>
                  <div style={{color:'var(--muted)',fontSize:'0.78rem',marginTop:2}}>Ainda falta o resto do mês!</div>
                </div>
              )}

              <div className="aposta-card">
                <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:'1rem',letterSpacing:1,marginBottom:4}}>VOTAÇÃO 🗳️</div>
                <div style={{fontSize:'0.82rem',color:'var(--muted)',marginBottom:14}}>
                  {totalVotos}/{players.length} votos
                  {meuVoto?' · Já votaste ✓':' · O teu voto ainda não foi registado'}
                </div>
                {Array.isArray(aposta.opcoes)&&aposta.opcoes.map((opcao,i)=>{
                  const count = contarVotos(opcao);
                  const pct = totalVotos>0?Math.round((count/totalVotos)*100):0;
                  const isMyVote = meuVoto===opcao;
                  return (
                    <button key={i} className={'voto-btn'+(isMyVote?' selected':'')}
                      onClick={()=>votar(opcao)} disabled={!!meuVoto}>
                      <div style={{flex:1}}>
                        <div>{opcao}</div>
                        {totalVotos>0&&(
                          <div className="voto-bar" style={{marginTop:6}}>
                            <div className="voto-bar-fill" style={{width:pct+'%'}}/>
                          </div>
                        )}
                      </div>
                      <div style={{fontSize:'0.82rem',color:'var(--muted)',marginLeft:12,flexShrink:0}}>
                        {count} voto{count!==1?'s':''}{isMyVote?' ✓':''}
                      </div>
                    </button>
                  );
                })}
              </div>

              {/* Empate — perdedor decide */}
              {todosVotaram&&temEmpate()&&(
                <div>
                  {podeDecidirEmpate?(
                    <div className="card" style={{borderColor:'rgba(255,56,100,0.3)'}}>
                      <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:'1rem',letterSpacing:1,marginBottom:8,color:'var(--red)'}}>
                        🤝 EMPATE — DECIDES TU
                      </div>
                      <div style={{fontSize:'0.84rem',color:'var(--muted)',marginBottom:12}}>
                        Perdeste o mês passado, por isso decides o empate.
                      </div>
                      {Array.isArray(aposta.opcoes)&&aposta.opcoes.map((opcao,i)=>(
                        <button key={i} className="voto-btn" onClick={()=>decidirEmpate(opcao)} disabled={saving}>
                          {opcao} <span style={{color:'var(--green)'}}>→ escolher</span>
                        </button>
                      ))}
                    </div>
                  ):(
                    <div className="warn-box">
                      🤝 Há empate! A aguardar que {!isPrimeiro&&rankMesAnt?.perdedor?(rankMesAnt.perdedor.nickname||rankMesAnt.perdedor.nome):'o administrador'} decida.
                    </div>
                  )}
                </div>
              )}

              {todosVotaram&&!temEmpate()&&vencedorOpcao()&&(
                <div className="info-box">
                  ✅ Todos votaram. Resultado: <strong>{vencedorOpcao()}</strong>. Aguarda confirmação.
                </div>
              )}
            </div>
          )}

          {/* Resultado decidido */}
          {aposta&&aposta.status==='decidida'&&(
            <div>
              <div className="aposta-card ganhou">
                <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:'1.1rem',letterSpacing:1,marginBottom:8}}>
                  🏆 DESAFIO DESTE MÊS
                </div>
                <div style={{fontSize:'1.5rem',fontWeight:700,color:'var(--green)',marginBottom:10}}>
                  {aposta.opcao_vencedora}
                </div>
                {aposta.perdedor_player_id&&(
                  <div style={{fontSize:'0.88rem'}}>
                    Quem paga: <strong>{players.find(p=>p.id===aposta.perdedor_player_id)?.nickname||players.find(p=>p.id===aposta.perdedor_player_id)?.nome||'?'}</strong>
                  </div>
                )}
                {aposta.pago?(
                  <div style={{marginTop:10,padding:'8px 12px',background:'rgba(0,255,135,0.1)',borderRadius:8,fontSize:'0.85rem',color:'var(--green)'}}>
                    ✅ Pago! {aposta.pago_em?new Date(aposta.pago_em).toLocaleDateString('pt-PT'):''}
                  </div>
                ):(
                  <div style={{marginTop:10,padding:'8px 12px',background:'rgba(255,193,7,0.08)',borderRadius:8,fontSize:'0.85rem',color:'var(--yellow)'}}>
                    ⏳ Ainda não foi pago
                  </div>
                )}
                {aposta.decidido_por_player_id&&(
                  <div style={{fontSize:'0.72rem',color:'var(--muted)',marginTop:6}}>
                    Empate decidido por {players.find(p=>p.id===aposta.decidido_por_player_id)?.nickname||players.find(p=>p.id===aposta.decidido_por_player_id)?.nome||'?'}
                  </div>
                )}
              </div>

              {/* Resultados da votação */}
              <div className="card">
                <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:'0.9rem',letterSpacing:1,marginBottom:10,color:'var(--muted)'}}>VOTOS</div>
                {Array.isArray(aposta.opcoes)&&aposta.opcoes.map((opcao,i)=>{
                  const count = contarVotos(opcao);
                  const pct = totalVotos>0?Math.round((count/totalVotos)*100):0;
                  const isWinner = opcao===aposta.opcao_vencedora;
                  return (
                    <div key={i} style={{marginBottom:10}}>
                      <div style={{display:'flex',justifyContent:'space-between',fontSize:'0.85rem',marginBottom:3}}>
                        <span style={{fontWeight:isWinner?700:400}}>{opcao}{isWinner?' 🏆':''}</span>
                        <span style={{color:'var(--muted)'}}>{count} voto{count!==1?'s':''}</span>
                      </div>
                      <div className="voto-bar">
                        <div className="voto-bar-fill" style={{width:pct+'%',background:isWinner?'var(--green)':'rgba(0,255,135,0.3)'}}/>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}

          <button className="btn btn-ghost" style={{marginTop:8}} onClick={load}>Atualizar ↻</button>
        </div>
      )}

      {tab==='historico'&&(
        <div>
          {historico.length===0?(
            <div className="card" style={{textAlign:'center',padding:'28px 16px'}}>
              <div style={{fontSize:'2.5rem',marginBottom:10}}>📜</div>
              <div style={{color:'var(--muted)',fontSize:'0.88rem'}}>Ainda não há histórico de apostas.</div>
            </div>
          ):(
            historico.map((h,i)=>{
              const perdedor = players.find(p=>p.id===h.perdedor_player_id);
              const ganhador = players.find(p=>p.id===h.ganhador_player_id);
              return (
                <div key={i} className="card" style={{borderColor:h.pago?'rgba(0,255,135,0.2)':'rgba(255,193,7,0.2)'}}>
                  <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:6}}>
                    <div style={{fontWeight:700,fontSize:'0.9rem'}}>{mesLabel(h.mes)}</div>
                    {h.pago
                      ? <span style={{fontSize:'0.7rem',background:'rgba(0,255,135,0.12)',color:'var(--green)',padding:'2px 7px',borderRadius:4,fontWeight:700}}>PAGO ✅</span>
                      : h.status==='decidida'
                        ? <span style={{fontSize:'0.7rem',background:'rgba(255,193,7,0.1)',color:'var(--yellow)',padding:'2px 7px',borderRadius:4,fontWeight:700}}>POR PAGAR</span>
                        : <span style={{fontSize:'0.7rem',background:'var(--card)',color:'var(--muted)',padding:'2px 7px',borderRadius:4}}>Em curso</span>
                    }
                  </div>
                  {h.opcao_vencedora&&<div style={{fontSize:'1rem',fontWeight:700,color:'var(--green)',marginBottom:4}}>{h.opcao_vencedora}</div>}
                  <div style={{fontSize:'0.82rem',color:'var(--muted)'}}>
                    {perdedor&&<span>Pagou: <strong style={{color:'var(--text)'}}>{perdedor.nickname||perdedor.nome}</strong></span>}
                    {ganhador&&<span style={{marginLeft:10}}>Ganhou: <strong style={{color:'var(--text)'}}>{ganhador.nickname||ganhador.nome}</strong></span>}
                  </div>
                  {h.pago&&h.pago_em&&<div style={{fontSize:'0.72rem',color:'var(--muted)',marginTop:4}}>{new Date(h.pago_em).toLocaleDateString('pt-PT')}</div>}
                </div>
              );
            })
          )}
        </div>
      )}
    </div>
  );
}

// ── Root App ───────────────────────────────────────
function App() {
  const [state, setState]         = React.useState('loading');
  const [players, setPlayers]     = React.useState([]);
  const [player, setPlayer]       = React.useState(null);
  const [screen, setScreen]       = React.useState('dashboard');
  const [temHoje, setTemHoje]     = React.useState(false);
  const [alertas, setAlertas]     = React.useState([]);
  const [showAlertas, setShowAlertas] = React.useState(false);
  const [theme, setTheme]         = React.useState(()=>localStorage.getItem('fitwar_theme')||'dark');
  const [hasNewAposta, setHasNewAposta] = React.useState(false);
  const [isAdmin, setIsAdmin]       = React.useState(false);
  const [diasEmFalta, setDiasEmFalta] = React.useState([]);

  React.useEffect(()=>{ document.documentElement.setAttribute('data-theme',theme); },[theme]);

  const checkHoje = async (pid) => { const { data } = await sb.from('entries').select('id').eq('player_id',pid).eq('data',hoje()).maybeSingle(); setTemHoje(!!data); };

  const checkDiasEmFalta = async (pid) => {
    const mes = mesAtual();
    const { data: entries } = await sb.from('entries').select('data')
      .eq('player_id', pid).gte('data', mes.inicio).lte('data', mes.fim)
      .order('data', {ascending: true});
    if (!entries || entries.length === 0) return;
    const registados = new Set(entries.map(e => e.data));
    const ultimo = entries[entries.length-1].data;
    const falta = [];
    const cur = new Date(ultimo + 'T12:00:00');
    const hj = new Date(hoje() + 'T12:00:00');
    cur.setDate(cur.getDate() + 1);
    while (cur < hj) {
      const d = cur.toISOString().split('T')[0];
      if (!registados.has(d)) falta.push(d);
      cur.setDate(cur.getDate() + 1);
    }
    setDiasEmFalta(falta);
  };

  const checkAposta = async (pid) => {
    const mesKey = mesAtual().inicio.substring(0,7);
    const { data: ap } = await sb.from('apostas').select('id,status').eq('mes',mesKey).maybeSingle();
    if (!ap) return;
    if (ap.status === 'votacao') {
      const { data: meuVoto } = await sb.from('votos_apostas').select('id').eq('aposta_id',ap.id).eq('player_id',pid).maybeSingle();
      if (!meuVoto) setHasNewAposta(true);
    }
  };

  const fetchNotificacoes = async (pid, allPlayers) => {
    const items = [];
    const [{ data: al },{ data: msgs }] = await Promise.all([
      sb.from('alertas').select('*').eq('para_player_id',pid).eq('visto',false),
      sb.from('mensagens').select('*').eq('para_player_id',pid).eq('visto',false)
    ]);
    if (al&&al.length>0) items.push(...al.map(a=>({...a,tipo:'alerta'})));
    if (msgs&&msgs.length>0) items.push(...msgs.map(m=>({...m,tipo:'mensagem'})));
    if (allPlayers) {
      for (const p of allPlayers) {
        if (p.id===pid) continue;
        const { data: med } = await sb.from('medidas').select('data').eq('player_id',p.id).not('peso','is',null).order('data',{ascending:false}).limit(1);
        const dias = diasSemPeso(med&&med.length>0?med[0].data:null);
        if (dias>=7) items.push({id:`peso_${p.id}`,tipo:'peso',mensagem:`⚖️ ${p.nickname||p.nome} não regista o peso há ${dias===999?'muito tempo':`${dias} dias`}.`});
      }
    }
    if (items.length>0) { setAlertas(items); setShowAlertas(true); }
  };

  React.useEffect(()=>{
    (async()=>{
      const { data, error } = await sb.from('players').select('*').order('created_at');
      if (error||!data||data.length===0) { setState('setup'); return; }
      setPlayers(data);
      const saved = localStorage.getItem('fitwar_pid');
      if (saved) {
        const p = data.find(x=>x.id===saved);
        if (p) { setPlayer(p); await checkHoje(p.id); await fetchNotificacoes(p.id,data); await checkAposta(p.id); await checkDiasEmFalta(p.id); setState('app'); return; }
      }
      setState('login');
    })();
  },[]);

  const handleLogin = async (p) => {
    setPlayer(p); localStorage.setItem('fitwar_pid',p.id);
    // Admin = first player created (index 0) — can be changed
    // We use a separate admin flag stored in localStorage after admin panel login
    await checkHoje(p.id);
    const { data: allP } = await sb.from('players').select('*');
    await fetchNotificacoes(p.id,allP);
    await checkAposta(p.id);
    await checkDiasEmFalta(p.id);
    setState('app');
  };

  const dismissAlertas = async () => {
    setShowAlertas(false);
    const pid = player?player.id:(alertas[0]?alertas[0].para_player_id:null);
    if (pid) {
      await sb.from('alertas').update({visto:true}).eq('para_player_id',pid).eq('visto',false);
      await sb.from('mensagens').update({visto:true}).eq('para_player_id',pid).eq('visto',false);
    }
    setAlertas([]);
  };

  const handleLogout    = () => { localStorage.removeItem('fitwar_pid'); setPlayer(null); setAlertas([]); setState('login'); };
  const handleSetup     = async () => { const { data } = await sb.from('players').select('*').order('created_at'); setPlayers(data||[]); setState('login'); };
  const handleEntry     = () => { setTemHoje(true); setScreen('dashboard'); };
  const handleUpdate    = (u) => { setPlayer(u); setPlayers(prev=>prev.map(p=>p.id===u.id?u:p)); };

  if (state==='loading') return <LoadingScreen />;
  if (state==='setup')   return <SetupScreen onComplete={handleSetup} />;
  if (state==='login')   return <LoginScreen players={players} onLogin={handleLogin} />;

  return (
    <div>
      {showAlertas&&(
        <div className="alert-overlay">
          <div className="alert-box">
            <div style={{fontSize:'1.5rem',marginBottom:6}}>👋</div>
            <div style={{fontFamily:'Bebas Neue,sans-serif',fontSize:'1.3rem',marginBottom:14,letterSpacing:1}}>NOVIDADES</div>
            {alertas.map((a,i)=>(
              <div key={i} className={a.tipo==='alerta'?'alert-item-a':a.tipo==='mensagem'?'alert-item-m':'alert-item-p'}>{a.mensagem}</div>
            ))}
            <button className="btn btn-primary" style={{marginTop:10}} onClick={dismissAlertas}>OK, percebi</button>
          </div>
        </div>
      )}
      {screen==='dashboard'   && <Dashboard player={player} players={players} setScreen={setScreen} diasEmFalta={diasEmFalta} />}
      {screen==='entry'       && <EntryForm player={player} onSuccess={handleEntry} diasEmFalta={diasEmFalta} />}
      {screen==='progresso'   && <ProgressoScreen players={players} currentPlayer={player} />}
      {screen==='leaderboard' && <LeaderboardFull players={players} currentPlayer={player} />}
      {screen==='perfil'      && <PerfilScreen player={player} players={players} onUpdate={handleUpdate} onLogout={handleLogout} theme={theme} setTheme={setTheme} />}
      {screen==='apostas'     && <ApostaScreen player={player} players={players} isAdmin={localStorage.getItem('fitwar_admin')==='1'} />}
      <BottomNav screen={screen} setScreen={setScreen} temHoje={temHoje} hasAlerts={alertas.length>0&&!showAlertas} hasNewAposta={hasNewAposta} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
